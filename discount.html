Updated : 2026-09-30
Data : discounts.json (GitHub Actions .github/workflows/discounts.yml 가 하루 2회 갱신)
Stores : 무신사 / 29CM / W컨셉 / SSG(비식품 카테고리)
-->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><script src="auth-gate.js?v=20260925-1"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063c2d"><title>할인 레이더 | STARBUCKS HELPER</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--g:#00754a;--deep:#063c2d;--bg:#f3f5f3;--line:#dce4df;--text:#18201c;--muted:#68756d;--red:#c8322b;--soft:#edf8f2}*{box-sizing:border-box}html{background:var(--bg);-webkit-tap-highlight-color:transparent}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}
header{padding:calc(18px + env(safe-area-inset-top)) 16px 34px;background:var(--deep);color:#fff}.head,main{width:min(100%,860px);margin:auto}.back{color:#cde1d7;text-decoration:none;font-size:13px;font-weight:800}h1{margin:17px 0 6px;font-size:28px;letter-spacing:-.04em}.sub{margin:0;color:#c7d5ce;font-size:13px;line-height:1.5}
main{margin-top:-20px;padding:0 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:16px;border:1px solid rgba(9,54,39,.09);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(13,48,35,.06)}h2{margin:0;font-size:16px}.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hint{color:var(--muted);font-size:11px}
.stores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.store{min-width:0;padding:11px 10px;border:1px solid var(--line);border-radius:14px;background:#fbfcfb;text-align:left;cursor:pointer;color:var(--text)}.store.active{border-color:var(--g);background:var(--soft)}.store-name{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:850}.dot{width:7px;height:7px;flex:none;border-radius:50%;background:#00a862}.dot.fail{background:var(--red)}.store-count{margin-top:6px;font-size:19px;font-weight:900;color:var(--g)}.store-count small{font-size:11px;color:var(--muted);font-weight:700}.store-note{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.35;overflow-wrap:anywhere}.store.fail .store-note{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;color:var(--text);font-size:16px;outline:none}.search:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.1)}.select{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff;color:var(--text);font-size:13px;font-weight:700}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer}.chip.active{border-color:var(--g);background:var(--soft);color:var(--g)}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{position:relative;display:flex;gap:11px;min-width:0;padding:11px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);text-decoration:none}.thumb{flex:0 0 82px;width:82px;height:82px;border-radius:11px;background:#f1f4f2;object-fit:cover}.info{min-width:0;flex:1;display:flex;flex-direction:column}.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}.badge{padding:2px 6px;border-radius:6px;background:#eef2ef;color:#46524b;font-size:10px;font-weight:850}.badge.new{background:#fff1d6;color:#9a5b00}.badge.sold{background:#f3e2e1;color:var(--red)}.name{font-size:13px;font-weight:750;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.prices{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 7px;margin-top:auto;padding-top:6px}.rate{color:var(--red);font-size:16px;font-weight:900}.price{font-size:15px;font-weight:900}.orig{color:var(--muted);font-size:11px;text-decoration:line-through}.seen{margin-top:3px;color:var(--muted);font-size:10px}.item.soldout{opacity:.55}
.empty{padding:26px 10px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}.foot{margin:8px 2px 0;color:var(--muted);font-size:11px;line-height:1.6}.foot a{color:var(--g)}
@media(max-width:619px){.stores{grid-template-columns:repeat(2,minmax(0,1fr))}.list{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><a class="back" href="index.html">← 헬퍼 홈</a><h1>할인 레이더</h1><p class="sub" id="sub">판매처 스타벅스 브랜드관에서 지금 할인 중인 상품만 모아 보여줘요.</p></div></header>
<main>
<section class="card"><div class="row-head"><h2>판매처별 현황</h2><span class="hint" id="updated">불러오는 중…</span></div><div class="stores" id="stores"></div>
<div class="tools"><input id="q" class="search" type="search" placeholder="상품명 검색" autocomplete="off"><select id="sort" class="select" aria-label="정렬"><option value="rate">할인율 높은순</option><option value="new">최근 발견순</option><option value="price">가격 낮은순</option></select><button id="newOnly" class="chip" type="button">NEW만</button></div></section>
<section class="card"><div class="row-head"><h2 id="listTitle">할인 상품</h2><span class="hint">누르면 판매처 새 창</span></div><div id="list" class="list"></div><div id="empty" class="empty" hidden></div></section>
<p class="foot">· 하루 2회(오전 9시·오후 6시 무렵) 자동 갱신돼요. 쿠폰·카드 할인처럼 결제 단계에서만 적용되는 할인은 잡히지 않아요.<br>· SSG는 식품·원두 묶음을 빼고 주방·가방·잡화 등 MD 카테고리만 수집해요.<br>· 지금 바로 다시 수집하려면 <a href="https://github.com/runipokr-dotcom/STARBUCKS-HELPER/actions/workflows/discounts.yml" target="_blank" rel="noopener noreferrer">GitHub Actions</a>에서 Run workflow를 누르세요.</p>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),PREF='starbucks-helper-discount-radar-v1',NEW_HOURS=72;
const ORDER=['musinsa','29cm','wconcept','ssg'];
let data=null,store='all',sort='rate',newOnly=false,q='';
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');store=p.store||store;sort=p.sort||sort;newOnly=!!p.newOnly}catch{}
function savePref(){try{localStorage.setItem(PREF,JSON.stringify({store,sort,newOnly}))}catch{}}
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u||'')?u:'#';
function when(iso){if(!iso)return'-';const d=new Date(iso);if(isNaN(d))return'-';return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function isNew(it){const t=new Date(it.firstSeen).getTime();return t&&Date.now()-t<NEW_HOURS*3600e3}
function renderStores(){
  const s=data.stores||{},total=(data.items||[]).length;
  const cards=[`<button class="store${store==='all'?' active':''}" data-store="all"><span class="store-name">전체</span><div class="store-count">${total}<small>개</small></div><div class="store-note">모든 판매처</div></button>`];
  for(const k of ORDER){const st=s[k];if(!st)continue;const fail=!st.ok;
    const note=fail?`수집 실패 · 마지막 성공 ${when(st.lastSuccessAt)}`:`${Number(st.scanned||0).toLocaleString('ko-KR')}개 중`;
    cards.push(`<button class="store${store===k?' active':''}${fail?' fail':''}" data-store="${k}" title="${esc(fail?st.error:'')}"><span class="store-name"><span class="dot${fail?' fail':''}"></span>${esc(st.name)}</span><div class="store-count">${Number(st.discounted||0)}<small>개</small></div><div class="store-note">${esc(note)}</div></button>`)}
  $('stores').innerHTML=cards.join('');
  $('stores').querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>{store=b.dataset.store;savePref();renderStores();renderList()});
}
function renderList(){
  const names=Object.fromEntries(Object.entries(data.stores||{}).map(([k,v])=>[k,v.name]));
  let rows=(data.items||[]).filter(it=>(store==='all'||it.store===store)&&(!newOnly||isNew(it))&&(!q||String(it.name).toLowerCase().includes(q)));
  rows.sort(sort==='new'?(a,b)=>String(b.firstSeen).localeCompare(String(a.firstSeen))||b.rate-a.rate:sort==='price'?(a,b)=>a.price-b.price:(a,b)=>b.rate-a.rate||a.price-b.price);
  $('listTitle').textContent=`할인 상품 ${rows.length}개`;
  $('list').innerHTML=rows.map(it=>`<a class="item${it.soldOut?' soldout':''}" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer"><img class="thumb" src="${esc(safeUrl(it.image))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><div class="info"><div class="badges"><span class="badge">${esc(names[it.store]||it.store)}</span>${isNew(it)?'<span class="badge new">NEW</span>':''}${it.soldOut?'<span class="badge sold">품절</span>':''}${it.category?`<span class="badge">${esc(it.category)}</span>`:''}</div><div class="name">${esc(it.name)}</div><div class="prices"><span class="rate">${Number(it.rate)}%</span><span class="price">${won(it.price)}</span>${it.originalPrice>it.price?`<span class="orig">${won(it.originalPrice)}</span>`:''}</div><div class="seen">할인 발견 ${when(it.firstSeen)}</div></div></a>`).join('');
  const e=$('empty');e.hidden=rows.length>0;
  e.textContent=(data.items||[]).length?'조건에 맞는 할인 상품이 없어요.':'지금은 할인 중인 상품이 없어요. 다음 갱신 때 다시 확인해 주세요.';
}
function bindTools(){
  $('sort').value=sort;$('newOnly').classList.toggle('active',newOnly);
  $('sort').onchange=()=>{sort=$('sort').value;savePref();renderList()};
  $('newOnly').onclick=()=>{newOnly=!newOnly;$('newOnly').classList.toggle('active',newOnly);savePref();renderList()};
  $('q').oninput=()=>{q=$('q').value.trim().toLowerCase();renderList()};
}
async function load(){
  bindTools();
  try{
    const res=await fetch('discounts.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    data=await res.json();
    if(!data||!Array.isArray(data.items))throw new Error('형식 오류');
    if(store!=='all'&&!(data.stores||{})[store])store='all';
    $('updated').textContent='마지막 수집 '+when(data.updatedAt);
    renderStores();renderList();
  }catch(err){
    console.error(err);
    $('updated').textContent='데이터 없음';
    $('stores').innerHTML='';
    const e=$('empty');e.hidden=false;e.textContent='아직 수집된 데이터가 없어요. 첫 자동 수집이 끝나면 여기에 표시돼요.';
  }
}
load();
})();
</script>
</body></html>
