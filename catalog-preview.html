<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 카탈로그</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>
:root{font-family:Pretendard,sans-serif;--g:#00754a;--line:#e5e8e6;--mut:#737b76}*{box-sizing:border-box}body{margin:0;color:#17201b;background:#fff}header{padding:28px max(16px,4vw);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:clamp(25px,4vw,40px)}main{padding:22px max(10px,4vw) 150px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.product{min-width:0}.photo{position:relative;display:grid;place-items:center;aspect-ratio:5/6;overflow:hidden;background:#fafaf8}.photo img{width:100%;height:100%;object-fit:contain}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:27px;height:27px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.82);cursor:pointer}.prev{left:4px}.next{right:4px}.count{position:absolute;right:5px;bottom:4px;padding:2px 4px;background:rgba(255,255,255,.75);font-size:9px}.name{margin:10px 0 6px;font-size:var(--name,16px);font-weight:700}.sale{margin:0;color:var(--mut);font-size:var(--sale,13px);text-decoration:line-through}.offer{margin:3px 0;font-size:var(--offer,14px);font-weight:800}.pick{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px}.basket{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(820px,calc(100% - 22px));padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 15px 50px rgba(0,0,0,.17)}.basket-head{display:flex;justify-content:space-between;gap:10px}.rows{max-height:150px;overflow:auto}.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.qty{display:flex;align-items:center;gap:6px}.qty button,.fold{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.qty button{width:28px;height:28px}.fold{padding:5px 8px}.basket.closed .rows{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:720px){header{padding:18px 12px}main{padding:12px 7px 120px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.name{font-size:12px}.sale,.offer{font-size:11px}.row{grid-template-columns:1fr auto}.row>strong{grid-column:1/-1;text-align:right}}
.filters{padding:12px max(10px,4vw);border-bottom:1px solid var(--line)}.filter-line{display:flex;align-items:center;gap:8px;margin:6px 0}.filter-line b{flex:0 0 48px;font-size:12px}.filter-buttons{display:flex;gap:6px;overflow-x:auto}.filter{flex:0 0 auto;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:11px;cursor:pointer}.filter.active{border-color:var(--g);background:#e8f5ee;color:var(--g)}
</style></head><body><header><h1 id="title">상품 카탈로그</h1><p>전 상품 VAT 포함 · 패키지 및 쇼핑백 제공</p></header><section class="filters"><div class="filter-line"><b>대분류</b><div class="filter-buttons" id="previewCategories"></div></div><div class="filter-line"><b>소분류</b><div class="filter-buttons" id="previewTags"></div></div></section><main><section class="grid" id="grid"></section></main><aside class="basket closed" id="basket"><div class="basket-head"><b id="summary">선택 상품 0개 · 합계 0원</b><button class="fold" id="fold">펼치기⌃</button></div><div class="rows" id="rows"></div></aside><script>
const previewImageCache=new Map();function previewImageSrc(ref){return previewImageCache.get(ref)||ref||''}function openPreviewImageDb(){return new Promise((resolve,reject)=>{let request=indexedDB.open('starbucks-helper-catalog-images-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('images');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}async function hydratePreviewImages(){let refs=data.products.flatMap(p=>(p.images||[]).filter(ref=>ref.startsWith('idb:'))),db=await openPreviewImageDb();await Promise.all(refs.map(ref=>new Promise((resolve,reject)=>{let request=db.transaction('images').objectStore('images').get(ref.slice(4));request.onsuccess=()=>{if(request.result)previewImageCache.set(ref,URL.createObjectURL(request.result));resolve()};request.onerror=()=>reject(request.error)})));db.close();render()}
const KEY='starbucks-helper-web-catalog-v1',data=JSON.parse(localStorage.getItem(KEY)||'null')||{category:'상품 카탈로그',sizes:{name:16,sale:13,offer:14},products:[]},$=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('ko-KR')+'원';document.documentElement.style.setProperty('--name',data.sizes.name+'px');document.documentElement.style.setProperty('--sale',data.sizes.sale+'px');document.documentElement.style.setProperty('--offer',data.sizes.offer+'px');$('#title').textContent=data.category;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){$('#grid').innerHTML=data.products.map((p,i)=>`<article class="product" data-i="${i}"><div class="photo"><img src="${esc(previewImageSrc(p.images[p.current||0]||''))}" alt="${esc(p.name)}">${p.images.length>1?'<button class="arrow prev">‹</button><button class="arrow next">›</button><span class="count">'+((p.current||0)+1)+'/'+p.images.length+'</span>':''}</div><h2 class="name">${esc(p.name)}</h2><p class="sale">판매가 ${money(p.sale)}</p><p class="offer">제안가 ${money(p.offer)}</p><label class="pick"><input type="checkbox" ${p.selected?'checked':''}> 상품 선택</label></article>`).join('')||'<p>에디터에서 상품을 추가하고 저장해주세요.</p>';document.querySelectorAll('.product').forEach(card=>{let p=data.products[+card.dataset.i],prev=card.querySelector('.prev'),next=card.querySelector('.next');if(prev)prev.onclick=()=>{p.current=(p.current-1+p.images.length)%p.images.length;render()};if(next)next.onclick=()=>{p.current=(p.current+1)%p.images.length;render()};card.querySelector('input').onchange=e=>{p.selected=e.target.checked;basket()}});basket()}function basket(){let sel=data.products.filter(p=>p.selected),total=sel.reduce((s,p)=>s+p.offer*p.qty,0);$('#summary').textContent=`선택 상품 ${sel.length}개 · 합계 ${money(total)}`;$('#rows').innerHTML=sel.map(p=>`<div class="row" data-id="${p.id}"><span>${esc(p.name)}</span><span class="qty"><button class="minus">−</button><b>${p.qty}개</b><button class="plus">＋</button></span><strong>${money(p.offer*p.qty)}</strong></div>`).join('');document.querySelectorAll('.row').forEach(r=>{let p=data.products.find(x=>x.id==r.dataset.id);r.querySelector('.minus').onclick=()=>{p.qty=Math.max(1,p.qty-1);basket()};r.querySelector('.plus').onclick=()=>{p.qty++;basket()}})}$('#fold').onclick=()=>{let c=$('#basket').classList.toggle('closed');$('#fold').textContent=c?'펼치기⌃':'접기⌄'};render();
</script><script>
data.products.forEach(p=>{p.category=p.category||'텀블러';p.tags=Array.isArray(p.tags)?p.tags:[]});
let previewCategory='전체',previewTag='전체';
function previewItems(){return data.products.map((p,i)=>({p,i})).filter(({p})=>(previewCategory==='전체'||p.category===previewCategory)&&(previewTag==='전체'||p.tags.includes(previewTag)))}
function previewFilters(){let categories=['전체','텀블러','머그','우산','티바나(차)','비아','원두','액세서리','리유저블'],tags=['전체',...new Set(data.products.flatMap(p=>p.tags||[]))];$('#previewCategories').innerHTML=categories.map(v=>`<button class="filter ${v===previewCategory?'active':''}" data-preview-category="${esc(v)}">${esc(v)}</button>`).join('');$('#previewTags').innerHTML=tags.map(v=>`<button class="filter ${v===previewTag?'active':''}" data-preview-tag="${esc(v)}">${esc(v)}</button>`).join('');document.querySelectorAll('[data-preview-category]').forEach(b=>b.onclick=()=>{previewCategory=b.dataset.previewCategory;render()});document.querySelectorAll('[data-preview-tag]').forEach(b=>b.onclick=()=>{previewTag=b.dataset.previewTag;render()})}
render=function(){let items=previewItems();$('#grid').innerHTML=items.map(({p,i})=>`<article class="product" data-i="${i}"><div class="photo"><img src="${esc(previewImageSrc(p.images[p.current||0]||''))}" alt="${esc(p.name)}">${p.images.length>1?'<button class="arrow prev">‹</button><button class="arrow next">›</button><span class="count">'+((p.current||0)+1)+'/'+p.images.length+'</span>':''}</div><h2 class="name">${esc(p.name)}</h2><p class="sale">판매가 ${money(p.sale)}</p><p class="offer">제안가 ${money(p.offer)}</p><label class="pick"><input type="checkbox" ${p.selected?'checked':''}> 상품 선택</label></article>`).join('')||'<p>현재 분류에 표시할 상품이 없습니다.</p>';document.querySelectorAll('.product').forEach(card=>{let p=data.products[+card.dataset.i],prev=card.querySelector('.prev'),next=card.querySelector('.next');if(prev)prev.onclick=()=>{p.current=(p.current-1+p.images.length)%p.images.length;render()};if(next)next.onclick=()=>{p.current=(p.current+1)%p.images.length;render()};card.querySelector('input').onchange=e=>{p.selected=e.target.checked;basket()}});previewFilters();basket()};render();
hydratePreviewImages();</script></body></html>
