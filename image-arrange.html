<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063c2d"><title>상품 이미지 배열 | STARBUCKS HELPER</title><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>
:root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--g:#00754a;--deep:#063c2d;--bg:#f3f5f3;--line:#dce4df;--text:#18201c;--muted:#68756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}header{padding:calc(18px + env(safe-area-inset-top)) 16px 30px;background:var(--deep);color:#fff}.head,main{width:min(100%,860px);margin:auto}.back{color:#cde1d7;text-decoration:none;font-size:13px;font-weight:800}h1{margin:17px 0 6px;font-size:28px;letter-spacing:-.04em}.sub{margin:0;color:#c7d5ce;font-size:13px;line-height:1.5}main{margin-top:-18px;padding:0 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:16px;border:1px solid rgba(9,54,39,.09);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(13,48,35,.06)}h2{margin:0 0 12px;font-size:16px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.label,label{color:var(--muted);font-size:11px;font-weight:800}.text{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;color:var(--text);outline:none}.text:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.1)}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:13px;background:#edf2ef}.seg button{border:0;border-radius:10px;padding:11px;background:transparent;color:var(--muted);font-weight:900}.seg button.active{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(6,60,45,.1)}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--muted);font-size:12px;font-weight:800}.choice.active{border-color:var(--g);background:#edf8f2;color:var(--g)}.drop{display:grid;place-items:center;gap:6px;padding:23px 12px;border:1.5px dashed #9eb9aa;border-radius:16px;background:#f6fbf8;color:var(--g);font-weight:800;font-size:13px;text-align:center;cursor:pointer}.drop input{display:none}.drop small{color:var(--muted);font-weight:600}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.product{position:relative;min-width:0;padding:9px;border:1px solid var(--line);border-radius:14px;background:#fbfcfb}.product.dragging{opacity:.45}.product.dragover{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.1)}.product-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}.handle{border:0;background:transparent;color:var(--deep);font-size:18px;cursor:grab}.select{width:17px;height:17px;accent-color:var(--g)}.product-no{margin-right:auto;color:var(--muted);font-size:11px;font-weight:900}.remove{width:26px;height:26px;border:0;border-radius:50%;background:#e9eeeb;color:var(--deep);font-weight:900}.photo-box{position:relative;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:move}.photo-box img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;pointer-events:none}.photo-tip{position:absolute;left:5px;bottom:5px;padding:3px 6px;border-radius:6px;background:rgba(6,60,45,.72);color:#fff;font-size:9px}.product-fields{display:grid;gap:6px;margin-top:8px}.product-fields .text{padding:8px 9px;font-size:12px}.desc-input{min-height:74px;resize:vertical;line-height:1.45}.image-mode .desc-field{display:none}.scale-line{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:8px}.scale-line input{width:100%;accent-color:var(--g)}.scale-value{min-width:42px;color:var(--deep);font-size:10px;text-align:right}.reset-photo{grid-column:1/-1;border:0;background:transparent;color:var(--g);font-size:10px;font-weight:800;text-align:right}.batch{display:none;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding:9px;border-radius:11px;background:#f3f7f5}.batch.show{display:flex}.batch b{font-size:11px}.batch button{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;font-size:11px;font-weight:800}.preview-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:repeating-conic-gradient(#f0f2f0 0% 25%,#fff 0% 50%) 50%/16px 16px}#canvas{display:block;width:100%;height:auto}.actions{display:grid;gap:9px;margin-top:12px}.btn{border:0;border-radius:14px;padding:14px 10px;font-size:13.5px;font-weight:900}.primary{background:var(--g);color:#fff}.btn:disabled{opacity:.4}.empty{margin:10px 2px 0;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,20px);padding:11px 15px;border-radius:999px;background:#15221c;color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:430px){.card{padding:13px}.products{gap:7px}.product{padding:7px}}
</style></head><body><header><div class="head"><a class="back" href="index.html">← 헬퍼 홈</a><h1>상품 이미지 배열</h1><p class="sub">사진과 상품 정보를 입력하면 정사각형 상품 카드가 자동으로 완성됩니다.</p></div></header><main id="app" class="image-mode">
<section class="card"><h2>1. 출력 형태</h2><div class="seg"><button type="button" class="active" data-mode="image">이미지형</button><button type="button" data-mode="detail">설명형</button></div><div class="field"><label for="title">상단 제목</label><input id="title" class="text" value="DANTE SERIES :" maxlength="80"></div></section>
<section class="card"><h2>2. 상품 추가 및 편집</h2><label class="drop" for="fileInput">+ 상품 사진을 선택하거나 끌어다 놓으세요<small>여러 장을 한 번에 추가할 수 있어요</small><input id="fileInput" type="file" accept="image/*" multiple></label><div id="batch" class="batch"><b id="selectedCount">0개 선택</b><button type="button" id="batchReset">사진 맞춤 초기화</button><button type="button" id="batchDelete">선택 삭제</button></div><div id="products" class="products"></div><p id="empty" class="empty">아직 추가된 상품이 없어요.</p></section>
<section class="card"><h2>3. 배치 설정</h2><div class="field"><span class="label">가로 상품 수</span><div class="choices"><button class="choice active" data-cols="auto">자동</button><button class="choice" data-cols="2">2개</button><button class="choice" data-cols="3">3개</button><button class="choice" data-cols="4">4개</button><button class="choice" data-cols="5">5개</button><button class="choice" data-cols="6">6개</button></div></div><div class="field"><span class="label">상품 사이 간격</span><div class="choices"><button class="choice" data-gap="8">좁게</button><button class="choice active" data-gap="16">보통</button><button class="choice" data-gap="28">넓게</button></div></div></section>
<section class="card"><h2>4. 미리보기</h2><div class="preview-wrap"><canvas id="canvas" width="860" height="240"></canvas></div><div class="actions"><button id="downloadPng" class="btn primary" type="button" disabled>고화질 PNG 저장</button></div></section></main><div id="toast" class="toast"></div>
<style>.handle{touch-action:none}.photo-box img{width:100%!important;height:100%!important;object-fit:contain}</style>
<script>
const $=id=>document.getElementById(id),W=860,KEY='starbucks-helper-image-arrange-v2';let items=[],mode='image',cols='auto',gap=16,uid=0,dragFrom=-1;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function money(v){const s=String(v||'').trim();if(!s)return'';return /^\d[\d,]*$/.test(s)?Number(s.replace(/,/g,'')).toLocaleString('ko-KR')+'원':s}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({mode,cols,gap,title:$('title').value,meta:items.map(({name,price,desc,scale,posX,posY})=>({name,price,desc,scale,posX,posY}))}))}catch{}}function restore(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;mode=s.mode||mode;cols=s.cols||cols;gap=Number(s.gap)||gap;$('title').value=s.title||'DANTE SERIES :'}catch{}}
function loadFile(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>ok({id:++uid,file,img,url,name:'',price:'',desc:'',scale:100,posX:0,posY:0,selected:false});img.onerror=no;img.src=url})}async function addFiles(list){for(const f of [...list].filter(f=>f.type.startsWith('image/'))){try{items.push(await loadFile(f))}catch{toast(f.name+' 파일을 불러오지 못했어요')}}renderProducts();preview()}
function imageStyle(it){const box=220,s=Math.min(box/it.img.naturalWidth,box/it.img.naturalHeight)*it.scale/100;return `width:${it.img.naturalWidth*s}px;height:${it.img.naturalHeight*s}px;transform:translate(calc(-50% + ${it.posX}px),calc(-50% + ${it.posY}px))`}
function renderProducts(){$('empty').style.display=items.length?'none':'block';$('downloadPng').disabled=!items.length;$('products').innerHTML=items.map((it,i)=>`<article class="product" draggable="true" data-i="${i}"><div class="product-top"><button class="handle" type="button" title="끌어서 순서 변경">☷</button><input class="select" type="checkbox" ${it.selected?'checked':''}><span class="product-no">${i+1}번 상품</span><button class="remove" type="button">×</button></div><div class="photo-box"><img src="${it.url}" style="${imageStyle(it)}"><span class="photo-tip">사진을 끌어 위치 조절</span></div><div class="product-fields"><input class="text name" placeholder="상품명" value="${esc(it.name)}"><input class="text price" inputmode="numeric" placeholder="가격 (예: 29000)" value="${esc(it.price)}"><div class="desc-field"><textarea class="text desc-input" placeholder="상품 설명 · 엔터와 자동 줄바꿈 지원">${esc(it.desc)}</textarea></div></div><div class="scale-line"><input class="scale" type="range" min="45" max="250" step="5" value="${it.scale}"><b class="scale-value">${it.scale}%</b><button class="reset-photo" type="button">사진 맞춤 초기화</button></div></article>`).join('');document.querySelectorAll('.product').forEach(c=>bindCard(c,+c.dataset.i));batch();save()}
function bindCard(card,i){const it=items[i];card.querySelector('.remove').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);renderProducts();preview()};card.querySelector('.select').onchange=e=>{it.selected=e.target.checked;batch();save()};[['.name','name'],['.price','price'],['.desc-input','desc']].forEach(([q,k])=>card.querySelector(q).oninput=e=>{it[k]=e.target.value;save();preview()});const r=card.querySelector('.scale');r.oninput=e=>{it.scale=+e.target.value;card.querySelector('.scale-value').textContent=it.scale+'%';card.querySelector('.photo-box img').style.cssText=imageStyle(it);save();preview()};card.querySelector('.reset-photo').onclick=()=>{it.scale=100;it.posX=it.posY=0;renderProducts();preview()};const box=card.querySelector('.photo-box');let start;box.onpointerdown=e=>{start={x:e.clientX,y:e.clientY,px:it.posX,py:it.posY};box.setPointerCapture(e.pointerId)};box.onpointermove=e=>{if(!start)return;it.posX=Math.max(-90,Math.min(90,start.px+e.clientX-start.x));it.posY=Math.max(-90,Math.min(90,start.py+e.clientY-start.y));box.querySelector('img').style.cssText=imageStyle(it);preview()};box.onpointerup=()=>{start=null;save()};card.ondragstart=e=>{if(!e.target.closest('.handle')){e.preventDefault();return}dragFrom=i;card.classList.add('dragging')};card.ondragend=()=>{dragFrom=-1;document.querySelectorAll('.product').forEach(x=>x.classList.remove('dragging','dragover'))};card.ondragover=e=>{e.preventDefault();card.classList.add('dragover')};card.ondragleave=()=>card.classList.remove('dragover');card.ondrop=e=>{e.preventDefault();if(dragFrom<0||dragFrom===i)return;const[m]=items.splice(dragFrom,1);items.splice(i,0,m);renderProducts();preview()}}
imageStyle=function(it){return `transform:translate(calc(-50% + ${it.posX}px),calc(-50% + ${it.posY}px)) scale(${it.scale/100})`};const originalRenderProducts=renderProducts;renderProducts=function(){originalRenderProducts();document.querySelectorAll('.product').forEach(card=>{card.draggable=false;card.querySelector('.handle').draggable=true})};
function batch(){const n=items.filter(x=>x.selected).length;$('batch').classList.toggle('show',n>0);$('selectedCount').textContent=n+'개 선택'}function actualCols(){if(cols!=='auto')return Math.min(+cols,Math.max(1,items.length));return items.length<=5?Math.max(1,items.length):3}
function lines(ctx,text,max,maxLines=99){const out=[];for(const raw of String(text||'').split('\n')){if(!raw){out.push('');continue}let line='';for(const ch of Array.from(raw)){if(line&&ctx.measureText(line+ch).width>max){out.push(line);line=ch}else line+=ch}if(line)out.push(line)}return out.slice(0,maxLines)}function drawPhoto(ctx,it,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const s=Math.min(w/it.img.naturalWidth,h/it.img.naturalHeight)*it.scale/100,dw=it.img.naturalWidth*s,dh=it.img.naturalHeight*s,k=w/220;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(it.img,x+(w-dw)/2+it.posX*k,y+(h-dh)/2+it.posY*k,dw,dh);ctx.restore();ctx.strokeStyle='#dfe4e1';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}function drawTitle(ctx,t,x,y){if(!t)return;ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='800 28px Pretendard,sans-serif';ctx.fillText(t,x,y)}
function preview(){const c=$('canvas'),ctx=c.getContext('2d'),title=$('title').value.trim(),margin=38,titleH=title?70:20;if(!items.length){c.width=W;c.height=240;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,240);ctx.fillStyle='#b7c2bc';ctx.font='600 14px Pretendard,sans-serif';ctx.textAlign='center';ctx.fillText('상품 사진을 추가하면 미리보기가 표시돼요',430,120);return}if(mode==='image'){const n=actualCols(),cw=(W-margin*2-gap*(n-1))/n,photo=cw,textH=82,rows=Math.ceil(items.length/n),rh=photo+textH;c.width=W;c.height=Math.ceil(margin+titleH+rows*rh+gap*(rows-1)+32);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);drawTitle(ctx,title,margin,42);items.forEach((it,i)=>{const row=Math.floor(i/n),col=i%n,x=margin+col*(cw+gap),y=margin+titleH+row*(rh+gap);drawPhoto(ctx,it,x,y,cw,photo);ctx.fillStyle='#222';ctx.textAlign='center';ctx.font=`600 ${Math.max(12,Math.min(18,cw/9))}px Pretendard,sans-serif`;lines(ctx,it.name,cw-8,2).forEach((s,j)=>ctx.fillText(s,x+cw/2,y+photo+24+j*19));ctx.font=`800 ${Math.max(13,Math.min(19,cw/8))}px Pretendard,sans-serif`;ctx.fillText(money(it.price),x+cw/2,y+photo+68)})}else{const photo=245,tw=W-margin*2-photo-28;ctx.font='400 20px Pretendard,sans-serif';const rows=items.map(it=>{const ls=lines(ctx,it.desc,tw);return{it,ls,h:Math.max(photo,96+ls.length*31)}}),total=rows.reduce((s,r)=>s+r.h,0)+gap*(rows.length-1);c.width=W;c.height=Math.ceil(margin+titleH+total+32);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);drawTitle(ctx,title,margin,42);let y=margin+titleH;rows.forEach(r=>{drawPhoto(ctx,r.it,margin,y,photo,photo);const x=margin+photo+28;ctx.textAlign='left';ctx.fillStyle='#1d2420';ctx.font='700 25px Pretendard,sans-serif';lines(ctx,r.it.name,tw,2).forEach((s,j)=>ctx.fillText(s,x,y+29+j*31));ctx.font='400 20px Pretendard,sans-serif';ctx.fillStyle='#424944';r.ls.forEach((s,j)=>ctx.fillText(s,x,y+102+j*31));ctx.font='800 23px Pretendard,sans-serif';ctx.fillStyle='#111';ctx.fillText(money(r.it.price),x,y+r.h-18);y+=r.h+gap})}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('app').classList.toggle('image-mode',mode==='image');renderProducts();preview()});document.querySelectorAll('[data-cols]').forEach(b=>b.onclick=()=>{cols=b.dataset.cols;document.querySelectorAll('[data-cols]').forEach(x=>x.classList.toggle('active',x===b));save();preview()});document.querySelectorAll('[data-gap]').forEach(b=>b.onclick=()=>{gap=+b.dataset.gap;document.querySelectorAll('[data-gap]').forEach(x=>x.classList.toggle('active',x===b));save();preview()});$('title').oninput=()=>{save();preview()};$('fileInput').onchange=e=>addFiles(e.target.files).then(()=>e.target.value='');const drop=document.querySelector('.drop');['dragover','dragenter'].forEach(v=>drop.addEventListener(v,e=>e.preventDefault()));drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};$('batchReset').onclick=()=>{items.filter(x=>x.selected).forEach(x=>{x.scale=100;x.posX=x.posY=0});renderProducts();preview()};$('batchDelete').onclick=()=>{items.filter(x=>x.selected).forEach(x=>URL.revokeObjectURL(x.url));items=items.filter(x=>!x.selected);renderProducts();preview()};$('downloadPng').onclick=()=>{preview();$('canvas').toBlob(blob=>{if(!blob)return toast('PNG 생성에 실패했어요');const a=document.createElement('a'),url=URL.createObjectURL(blob),stamp=new Date().toISOString().slice(0,10).replace(/-/g,''),base=($('title').value.trim()||'상품배열').replace(/[^0-9A-Za-z가-힣_-]+/g,'_').replace(/^_+|_+$/g,'');a.href=url;a.download=`${base}_${mode==='image'?'이미지형':'설명형'}_${stamp}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')};restore();document.querySelector(`[data-mode="${mode}"]`)?.click();document.querySelector(`[data-cols="${cols}"]`)?.click();document.querySelector(`[data-gap="${gap}"]`)?.click();document.fonts.ready.then(preview);
</script><script>
let touchSort=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h||e.pointerType==='mouse')return;const card=h.closest('.product');touchSort={from:+card.dataset.i,to:+card.dataset.i,handle:h};h.setPointerCapture(e.pointerId);card.classList.add('dragging')});
document.addEventListener('pointermove',e=>{if(!touchSort)return;const card=document.elementFromPoint(e.clientX,e.clientY)?.closest('.product');document.querySelectorAll('.product').forEach(x=>x.classList.remove('dragover'));if(card){touchSort.to=+card.dataset.i;card.classList.add('dragover')}});
document.addEventListener('pointerup',()=>{if(!touchSort)return;const{from,to}=touchSort;touchSort=null;if(from!==to){const[moved]=items.splice(from,1);items.splice(to,0,moved)}renderProducts();preview()});
$('downloadPng').addEventListener('click',e=>{const missing=items.findIndex(it=>!it.name.trim()||!it.price.trim()||(mode==='detail'&&!it.desc.trim()));if(missing<0)return;e.preventDefault();e.stopImmediatePropagation();toast(`${missing+1}번 상품의 ${!items[missing].name.trim()?'상품명':!items[missing].price.trim()?'가격':'설명'}을 입력해주세요`)},true);
</script></body></html>
