Purpose : Save one user-supplied Starbucks product page to the Mac via local helper

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063c2d">
<title>스타벅스 MD 추출 | STARBUCKS HELPER</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--green:#00754a;--dark:#063c2d;--pale:#dff2e8;--bg:#f3f5f3;--line:#dfe5e1;--text:#18201c;--muted:#6a766f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 56px}.head,main{width:min(100%,720px);margin:auto}.back{color:#cfe7da;text-decoration:none;font-size:13px;font-weight:750}h1{margin:20px 0 8px;font-size:clamp(28px,8vw,40px);letter-spacing:-.04em}header p{margin:0;color:rgba(255,255,255,.68);font-size:14px;line-height:1.55}main{margin-top:-30px;padding:0 14px calc(30px + env(safe-area-inset-bottom))}.card{padding:20px;border:1px solid rgba(19,51,37,.08);border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(18,46,34,.07)}label{display:block;margin-bottom:9px;font-size:14px;font-weight:850}input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fbfcfb;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,117,74,.11)}button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--green);color:#fff;font:inherit;font-weight:850;cursor:pointer}button:disabled{background:#9aa7a0;cursor:wait}.path{margin:14px 0 0;padding:12px;border-radius:13px;background:var(--pale);color:#25513e;font-size:12px;line-height:1.45;word-break:break-all}.status{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:15px;background:#fbfcfb;font-size:13px;line-height:1.55}.status.wait{color:var(--muted)}.status.ok{border-color:#a9d5bd;background:#f0faf4;color:#075e45}.status.error{border-color:#efc2bd;background:#fff5f4;color:#9d241d}.result{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff}.result[hidden]{display:none}.result h2{margin:0 0 10px;font-size:18px}.result dl{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;margin:0;font-size:13px}.result dt{color:var(--muted);font-weight:750}.result dd{margin:0;word-break:break-all}.notice{margin:16px 2px 0;color:var(--muted);font-size:11px;line-height:1.5}
</style>
</head>
<body>
<header><div class="head"><a class="back" href="index.html">← 헬퍼 홈</a><h1>스타벅스 MD 추출</h1><p>공식 상품 상세 URL 한 건에서 상품명·원본 이미지·하단 설명만 저장합니다.</p></div></header>
<main><section class="card">
<label for="productUrl">스타벅스 상품 상세 URL</label>
<input id="productUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://www.starbucks.co.kr/menu/product_view.do?product_cd=...">
<button id="extractButton" type="button">상품 정보와 이미지 저장</button>
<p class="path">저장 위치<br>/Users/kangsik/Downloads/스타벅스MD/상품명/</p>
<div id="status" class="status wait">Mac 로컬 다운로더 연결을 확인하는 중입니다.</div>
<div id="result" class="result" hidden><h2 id="resultName"></h2><dl><dt>이미지</dt><dd id="resultCount"></dd><dt>저장 폴더</dt><dd id="resultFolder"></dd><dt>하단 설명</dt><dd id="resultDescription"></dd></dl></div>
<p class="notice">상품 목록을 검색하지 않습니다. 입력한 URL 한 건만 처리하며, 기존 상품 폴더가 있으면 새 번호를 붙여 안전하게 저장합니다.</p>
</section></main>
<script>
const HELPER="http://127.0.0.1:17832",urlInput=document.getElementById("productUrl"),button=document.getElementById("extractButton"),statusBox=document.getElementById("status"),result=document.getElementById("result");
function setStatus(message,type="wait"){statusBox.textContent=message;statusBox.className=`status ${type}`}
function validUrl(value){try{const u=new URL(value);return u.protocol==="https:"&&u.hostname==="www.starbucks.co.kr"&&u.pathname==="/menu/product_view.do"&&/^\d+$/.test(u.searchParams.get("product_cd")||"")}catch{return false}}
async function health(){try{const response=await fetch(`${HELPER}/health`,{cache:"no-store"});if(!response.ok)throw 0;setStatus("Mac 로컬 다운로더가 연결되었습니다.","ok")}catch{setStatus("Mac 로컬 다운로더가 실행되지 않았습니다. 먼저 로컬 헬퍼를 실행해주세요.","error")}}
async function extract(){const url=urlInput.value.trim();result.hidden=true;if(!validUrl(url)){setStatus("스타벅스 공식 상품 상세 URL을 정확히 입력해주세요.","error");urlInput.focus();return}button.disabled=true;button.textContent="원본 이미지 저장 중…";setStatus("상품 페이지를 확인하고 원본 이미지를 저장하고 있습니다.","wait");try{const response=await fetch(`${HELPER}/extract`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||"추출하지 못했습니다.");document.getElementById("resultName").textContent=data.productName;document.getElementById("resultCount").textContent=`${data.imageCount}개`;document.getElementById("resultFolder").textContent=data.folder;document.getElementById("resultDescription").textContent=data.description;result.hidden=false;setStatus("저장이 완료되었습니다.","ok")}catch(error){setStatus(error.message==="Failed to fetch"?"Mac 로컬 다운로더에 연결할 수 없습니다. 로컬 헬퍼 실행 상태를 확인해주세요.":error.message,"error")}finally{button.disabled=false;button.textContent="상품 정보와 이미지 저장"}}
button.addEventListener("click",extract);urlInput.addEventListener("keydown",event=>{if(event.key==="Enter")extract()});health();
</script>
</body>
</html>
