name: One-shot mobile share UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-share-ui.yml'

permissions:
  contents: write

jobs:
  patch-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile-only customer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('share.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
      /* Mobile customer UI compact layout · 2026-09-04 */
      @media (max-width: 720px) {
        body { padding-bottom: 72px; }
        header {
          padding: 11px 14px;
          font-size: 16px;
        }
        .wrap { padding: 8px; }
        .filters {
          margin-bottom: 8px;
          padding: 8px;
          border-radius: 12px;
        }
        .filter-line {
          display: grid;
          grid-template-columns: 40px minmax(0, 1fr);
          align-items: center;
          gap: 5px;
          margin: 0 0 6px;
        }
        .filter-line:first-child {
          grid-template-columns: 40px minmax(0, 1fr) auto;
        }
        .filter-line b {
          flex: none;
          padding-top: 0;
          font-size: 10px;
          white-space: nowrap;
        }
        .filter-buttons {
          min-width: 0;
          flex-wrap: nowrap;
          gap: 4px;
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 1px;
        }
        .filter-buttons::-webkit-scrollbar { display: none; }
        .filter-btn {
          flex: 0 0 auto;
          padding: 5px 8px;
          border-radius: 8px;
          font-size: 10px;
          white-space: nowrap;
        }
        .offer-toggle-top {
          margin-left: 0;
          padding-top: 0;
          gap: 3px;
          font-size: 10px;
          font-weight: 700;
        }
        .offer-toggle-top input {
          width: 15px;
          height: 15px;
          margin: 0;
        }
        .selection-tools {
          flex-wrap: nowrap;
          gap: 4px;
          padding-top: 6px;
        }
        .selection-tools .filter-btn { padding: 5px 7px; }
        .selection-count {
          margin-left: auto;
          font-size: 9px;
          white-space: nowrap;
        }
        .category {
          padding: 4px;
          border-radius: 12px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 5px;
        }
        .product {
          padding: 4px;
          border-radius: 10px;
        }
        .meta {
          gap: 5px;
          margin-bottom: 4px;
          font-size: 10px;
        }
        .photo { border-radius: 8px; }
        .photo-arrow {
          width: 26px;
          height: 26px;
        }
        .photo-count {
          right: 4px;
          bottom: 3px;
          font-size: 9px;
        }
        .p-name {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          overflow: hidden;
          min-height: 2.5em;
          margin-top: 5px;
          font-size: 13px;
          line-height: 1.25;
        }
        .p-sale {
          margin-top: 2px;
          font-size: 10px;
          line-height: 1.25;
        }
        .p-offer {
          margin-top: 1px;
          font-size: 12px;
          line-height: 1.25;
        }
        .basket {
          bottom: 6px;
          width: calc(100% - 12px);
          padding: 8px 10px;
          border-radius: 12px;
        }
        .basket-head { gap: 8px; }
        #summary { font-size: 13px; }
        .btn.mini {
          padding: 5px 8px;
          font-size: 10px;
        }
        .basket-body {
          max-height: 31vh;
          margin-top: 7px;
        }
        .basket-row {
          gap: 6px;
          padding: 6px 0;
          font-size: 10px;
        }
        .basket-foot {
          margin-top: 7px;
          padding-top: 7px;
        }
        .scroll-top {
          right: 10px;
          bottom: 62px;
          width: 36px;
          height: 36px;
        }
      }
'''
          marker = '    </style>'
          if 'Mobile customer UI compact layout · 2026-09-04' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          s = s.replace('Version : 1.0', 'Version : 1.1', 1)
          s = s.replace('Updated : 2026-09-03', 'Updated : 2026-09-04', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'starbucks-helper-bot'
          git config user.email 'starbucks-helper-bot@users.noreply.github.com'
          git add share.html
          git diff --cached --quiet && exit 0
          git commit -m 'Compact customer catalog on mobile'
          git push
