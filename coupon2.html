<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f6;color:#151916}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:10;background:rgba(245,247,246,.97);border-bottom:1px solid #d8dfda;padding:12px}.wrap{width:min(980px,calc(100% - 20px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top-actions{display:flex;align-items:center;gap:8px}h1{margin:0;font-size:22px}.home{min-height:38px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #d8dfda;border-radius:8px;background:#fff;color:#151916;text-decoration:none;font-weight:800}.collapse-button{min-width:44px;padding:0 10px;background:#fff;border-color:#d8dfda;color:#151916}header.collapsed .stats,header.collapsed .toolbar{display:none}.stats{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;color:#5f6d64;font-size:13px;font-weight:800}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 130px 110px auto auto auto;gap:8px;align-items:center;margin-top:10px}input,select,button,textarea{font:inherit;border:1px solid #b9c4bd;border-radius:8px;background:#fff;color:#151916}input,select{height:38px;padding:0 10px}button{min-height:44px;padding:0 11px;cursor:pointer;font-weight:650}button:disabled{cursor:not-allowed;opacity:.5}main{padding:14px 0 40px}.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 10px;color:#506158;font-size:14px;flex-wrap:wrap}progress{width:min(320px,45vw);height:12px;accent-color:#006241}.coupon-list{display:grid;gap:12px}.coupon-card{display:grid;gap:10px;padding:12px;background:#fff;border:1px solid #d8dfda;border-radius:10px}.coupon-card.done{background:#eef6f1;color:#68736c}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.card-no,.card-status{font-size:16px;font-weight:800;color:#151916}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;grid-template-col <header><div class="wrap"><div class="top"><h1>쿠폰 2서버</h1><div class="top-actions"><button id="collapseButton" class="collapse-button" type="button">접기</button><a class="home" href="index.html">홈</a></div></div><div id="headerControls"><div class="stats"><span>전체 <b id="totalCount">0</b>개</span><span>완료 <b id="doneCount">0</b>개</span><span>남음 <b id="remainCount">0</b>개</span><span>표시 <b id="shownCount">0</b>개</span></div><div class="toolbar"><input id="searchInput" type="search" placeholder="번호, 쿠폰번호, 등록코드 검색"><select id="filterSelect"><option value="all">전체 보기</option><option value="pending">미완료만</option><option value="done">완료만</option></select><select id="pageSizeSelect"><option value="50">50개씩</option><option value="100" selected>100개씩</option><option value="200">200개씩</option></select><button id="saveButton" type="button">작업 저장</button><button id="loadButton" type="button">작업 불러오기</button><button id="clearButton" type="button">초기화</button></div></div></div></header>
<main class="wrap"><div id="message" class="status"><span>데이터 불러오는 중</span><progress id="progressBar" value="0" max="1"></progress></div><section id="couponRows" class="coupon-list"></section><div class="pager"><button id="prevButton">이전</button><span id="pageInfo">1 / 1</span><button id="nextButton">다음</button><span id="copyStatus" class="copy-ok"></span></div></main>
<input id="loadFileInput" type="file" accept="application/json,.json" hidden>
<script type="module">
const DATA_URL="coupons2.json";
const STORAGE_PREFIX="starbucks-helper-coupon2-work-v5";
const HEADER_STORAGE_KEY="starbucks-helper-coupon2-header-collapsed";
const FIRESTORE_COLLECTION="couponWork";
const RECOVERY_VERSION=1;
const BASELINE_DONE_COUNT=100;
const FIREBASE_CONFIG={apiKey:"AIzaSyAQpr3_koSKTAfihI8E3-kW3PknfMrQdaA",authDomain:"starbucks-helper-f578e.firebaseapp.com",projectId:"starbucks-helper-f578e",storageBucket:"starbucks-helper-f578e.firebasestorage.app",messagingSenderId:"1015231512258",appId:"1:1015231512258:web:25bb0229b5bc90b56a455b",measurementId:"G-8H2H0NCJDF"};
const blankWork=()=>({completed:{},completedAt:{},notes:{},noteAt:{},updatedAt:"",recoveryVersion:0});
const state={coupons:[],filtered:[],page:1,pageSize:100,work:blankWork(),storageKey:"",remoteDocument:"",sync:{ready:false,applyingRemote:false,saveTimer:null,status:"로컬 저장",ref:null,firestore:null}};
const $=id=>document.getElementById(id);const els={search:$("searchInput"),filter:$("filterSelect"),pageSize:$("pageSizeSelect"),rows:$("couponRows"),message:$("message"),progress:$("progressBar"),pageInfo:$("pageInfo"),prev:$("prevButton"),next:$("nextButton"),save:$("saveButton"),load:$("loadButton"),clear:$("clearButton"),loadFile:$("loadFileInput"),copyStatus:$("copyStatus"),header:document.querySelector("header"),collapse:$("collapseButton"),totalCount:$("totalCount"),doneCount:$("doneCount"),remainCount:$("remainCount"),shownCount:$("shownCount")};
function couponKey(c){return c.coupon_number}
function setHeaderCollapsed(v){els.header.classList.toggle("collapsed",v);els.collapse.textContent=v?"펼치기":"접기";localStorage.setItem(HEADER_STORAGE_KEY,v?"1":"0")}
function buildDatasetId(cs){if(!cs.length)return DATA_URL.replace(/[^a-z0-9_-]/gi,"_");return[DATA_URL,cs.length,cs[0].coupon_number,cs[cs.length-1].coupon_number].join("-").replace(/[^a-z0-9_-]/gi,"_")}
function normalizeCoupon(x,i){return{no:Number(x.no||i+1),coupon_number:String(x.coupon_number||""),registration_code:String(x.registration_code||"")}}
function sanitizeWork(w){const out=blankWork();if(!w||typeof w!=="object")return out;out.completed={...(w.completed||{})};out.completedAt={...(w.completedAt||{})};out.notes={...(w.notes||{})};out.noteAt={...(w.noteAt||{})};out.updatedAt=typeof w.updatedAt==="string"?w.updatedAt:"";out.recoveryVersion=Number(w.recoveryVersion||0);return out}
function mergeWork(a,b){const out=sanitizeWork(a),r=sanitizeWork(b);const keys=new Set([...Object.keys(out.completed),...Object.keys(r.completed),...Object.keys(out.completedAt),...Object.keys(r.completedAt)]);for(const k of keys){const la=Number(out.completedAt[k]||0),ra=Number(r.completedAt[k]||0);if(ra>la){out.completed[k]=Boolean(r.completed[k]);out.completedAt[k]=ra}else if(!la&&!ra&&r.completed[k]===true){out.completed[k]=true}}const noteKeys=new Set([...Object.keys(out.notes),...Object.keys(r.notes),...Object.keys(out.noteAt),...Object.keys(r.noteAt)]);for(const k of noteKeys){const la=Number(out.noteAt[k]||0),ra=Number(r.noteAt[k]||0);if(ra>la){out.notes[k]=String(r.notes[k]||"");out.noteAt[k]=ra}else if(!la&&!ra&&r.notes[k]&&!out.notes[k]){out.notes[k]=String(r.notes[k])}}out.updatedAt=[out.updatedAt,r.updatedAt].sort().pop()||"";out.recoveryVersion=Math.max(out.recoveryVersion,r.recoveryVersion);return out}
function applyRecoveryIfNeeded(){if(state.work.recoveryVersion>=RECOVERY_VERSION)return false;const now=Date.now();state.coupons.slice(0,BASELINE_DONE_COUNT).forEach((c,i)=>{const k=couponKey(c);state.work.completed[k]=true;state.work.completedAt[k]=now+i});state.work.recoveryVersion=RECOVERY_VERSION;state.work.updatedAt=new Date().toISOString();return true}
function saveLocal({touch=true,queue=true}={}){if(!state.storageKey)return;if(touch)state.work.updatedAt=new Date().toISOString();localStorage.setItem(state.storageKey,JSON.stringify(state.work));updateStatus();if(queue)queueRemoteSave()}
function setSyncStatus(t){state.sync.status=t;updateStatus()}
async function saveRemote(){if(!state.sync.ready||!state.sync.ref)return;try{setSyncStatus("동기화 중");const f=state.sync.firestore;await f.runTransaction(state.sync.db,async tx=>{const snap=await tx.get(state.sync.ref);const remote=snap.exists()?sanitizeWork(snap.data()):blankWork();const merged=mergeWork(remote,state.work);merged.recoveryVersion=Math.max(merged.recoveryVersion,state.work.recoveryVersion);merged.updatedAt=new Date().toISOString();state.work=merged;tx.set(state.sync.ref,merged)});saveLocal({touch:false,queue:false});setSyncStatus("동기화 완료")}catch(e){console.error(e);setSyncStatus("동기화 실패")}}
function queueRemoteSave(){if(!state.sync.ready||state.sync.applyingRemote)return;clearTimeout(state.sync.saveTimer);state.sync.saveTimer=setTimeout(saveRemote,350)}
async function initFirebaseSync(){try{const[{initializeApp},f]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")]);const app=initializeApp(FIREBASE_CONFIG);const db=f.getFirestore(app);state.sync.db=db;state.sync.firestore=f;state.sync.ref=f.doc(db,FIRESTORE_COLLECTION,state.remoteDocument||"main");state.sync.ready=true;setSyncStatus("Firebase 연결됨");f.onSnapshot(state.sync.ref,snap=>{const remote=snap.exists()?sanitizeWork(snap.data()):blankWork();state.sync.applyingRemote=true;state.work=mergeWork(state.work,remote);const recovered=applyRecoveryIfNeeded();saveLocal({touch:false,queue:false});state.sync.applyingRemote=false;setSyncStatus("실시간 동기화");filterCoupons(false);if(recovered||!snap.exists())queueRemoteSave()},()=>setSyncStatus("동기화 실패"))}catch(e){console.error(e);applyRecoveryIfNeeded();saveLocal({queue:false});setSyncStatus("로컬 저장")}}
function updateStatus(){const total=state.coupons.length,shown=state.filtered.length,done=state.coupons.reduce((n,c)=>n+(state.work.completed[couponKey(c)]===true?1:0),0);els.totalCount.textContent=total;els.doneCount.textContent=done;els.remainCount.textContent=total-done;els.shownCount.textContent=shown;els.message.innerHTML=`<span>전체 ${total}개 · 검색결과 ${shown}개 · 완료 ${done}개</span><progress id="progressBar" value="${done}" max="${total||1}"></progress><span class="sync">${state.sync.status}</span>`;els.progress=$("progressBar")}
function filterCoupons(reset=true){const term=els.search.value.trim(),mode=els.filter.value;state.filtered=state.coupons.filter(c=>{const done=state.work.completed[couponKey(c)]===true;if(mode==="pending"&&done)return false;if(mode==="done"&&!done)return false;return !term||String(c.no).includes(term)||c.coupon_number.includes(term)||c.registration_code.includes(term)});if(reset)state.page=1;render()}
function render(){const pages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));state.page=Math.min(Math.max(1,state.page),pages);const start=(state.page-1)*state.pageSize;const frag=state.filtered.slice(start,start+state.pageSize).map(c=>{const k=couponKey(c),done=state.work.completed[k]===true,card=document.createElement("article");card.className=`coupon-card${done?" done":""}`;card.innerHTML=`<div class="card-head"><div class="card-no">#${c.no}</div><div class="card-status">${done?"완료":"미완료"}</div></div><div class="fields"><div class="field"><label>쿠폰번호<input class="value" value="${c.coupon_number}" readonly></label><button class="copy-button coupon-copy">쿠폰번호 복사</button></div><div class="field"><label>등록코드<input class="value" value="${c.registration_code}" readonly></label><button class="copy-button reg-copy">등록코드 복사</button></div></div><div class="card-actions"><button class="done-button">${done?"완료 취소":"완료 처리"}</button><button class="both-button">두 번호 복사</button></div><textarea class="note" placeholder="사용자 메모"></textarea>`;const note=card.querySelector(".note");note.value=state.work.notes[k]||"";card.querySelector(".coupon-copy").onclick=()=>copyText(c.coupon_number,"쿠폰번호 복사됨");card.querySelector(".reg-copy").onclick=()=>copyText(c.registration_code,"등록코드 복사됨");card.querySelector(".both-button").onclick=()=>copyText(`${c.coupon_number}\t${c.registration_code}`,"두 번호 복사됨");card.querySelector(".done-button").onclick=()=>{state.work.completed[k]=!done;state.work.completedAt[k]=Date.now();saveLocal();filterCoupons(false)};note.oninput=()=>{state.work.notes[k]=note.value;state.work.noteAt[k]=Date.now();saveLocal()};return card});els.rows.replaceChildren(...frag);els.pageInfo.textContent=`${state.page} / ${pages}`;els.prev.disabled=state.page<=1;els.next.disabled=state.page>=pages;updateStatus()}
async function copyText(t,m){try{await navigator.clipboard.writeText(t);els.copyStatus.textContent=m}catch{els.copyStatus.textContent="복사 실패"}setTimeout(()=>els.copyStatus.textContent="",1200)}
function downloadWork(){const blob=new Blob([JSON.stringify(state.work,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="starbucks-helper-coupon2-work.json";a.click();URL.revokeObjectURL(url)}
function importWork(file){const r=new FileReader();r.onload=()=>{try{const incoming=sanitizeWork(JSON.parse(String(r.result||"{}")));const now=Date.now();Object.keys(incoming.completed).forEach((k,i)=>{if(!incoming.completedAt[k])incoming.completedAt[k]=now+i});state.work=mergeWork(state.work,incoming);state.work.recoveryVersion=Math.max(state.work.recoveryVersion,RECOVERY_VERSION);saveLocal();render()}catch{alert("작업 파일을 불러올 수 없습니다.")}};r.readAsText(file)}
async function loadCoupons(){try{const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw 0;state.coupons=(await res.json()).map(normalizeCoupon);state.filtered=state.coupons;state.remoteDocument=buildDatasetId(state.coupons);state.storageKey=`${STORAGE_PREFIX}-${state.remoteDocument}`;try{state.work=sanitizeWork(JSON.parse(localStorage.getItem(state.storageKey)||"{}"))}catch{state.work=blankWork()}render();initFirebaseSync()}catch{els.message.innerHTML='<div class="error">coupons2.json을 불러올 수 없습니다.</div>'}}
els.search.oninput=()=>filterCoupons();els.filter.onchange=()=>filterCoupons();els.pageSize.onchange=()=>{state.pageSize=Number(els.pageSize.value);state.page=1;render()};els.prev.onclick=()=>{state.page--;render()};els.next.onclick=()=>{state.page++;render()};els.collapse.onclick=()=>setHeaderCollapsed(!els.header.classList.contains("collapsed"));els.save.onclick=downloadWork;els.load.onclick=()=>els.loadFile.click();els.loadFile.onchange=()=>{const f=els.loadFile.files?.[0];if(f)importWork(f);els.loadFile.value=""};els.clear.onclick=async()=>{if(!confirm("완료 여부와 메모를 전체 초기화할까요?"))return;if(!confirm("정말 전체 초기화합니다. 모든 기기에 반영됩니다."))return;const now=Date.now();state.coupons.forEach((c,i)=>{const k=couponKey(c);state.work.completed[k]=false;state.work.completedAt[k]=now+i;state.work.notes[k]="";state.work.noteAt[k]=now+i});state.work.recoveryVersion=RECOVERY_VERSION;saveLocal({queue:false});render();await saveRemote()};setHeaderCollapsed(localStorage.getItem(HEADER_STORAGE_KEY)==="1");loadCoupons();
</script>
