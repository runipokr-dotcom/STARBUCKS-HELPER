<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STARBUCKS HELPER - 쿠폰 2서버</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f6;
      color: #151916;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(245, 247, 246, 0.97);
      border-bottom: 1px solid #d8dfda;
      padding: 12px;
    }
    .wrap {
      width: min(980px, calc(100% - 20px));
      margin: auto;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    .home {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 0 11px;
      border: 1px solid #d8dfda;
      border-radius: 8px;
      background: #ffffff;
      color: #151916;
      text-decoration: none;
      font-weight: 800;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 10px;
      color: #5f6d64;
      font-size: 13px;
      font-weight: 800;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 130px 110px auto auto auto;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    input,
    select,
    button,
    textarea {
      font: inherit;
      border: 1px solid #b9c4bd;
      border-radius: 8px;
      background: #ffffff;
      color: #151916;
    }
    input,
    select {
      height: 38px;
      padding: 0 10px;
    }
    button {
      min-height: 44px;
      padding: 0 11px;
      cursor: pointer;
      font-weight: 650;
    }
    button.primary {
      background: #006241;
      border-color: #006241;
      color: #ffffff;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    main {
      padding: 14px 0 40px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0 10px;
      color: #506158;
      font-size: 14px;
    }
    progress {
      width: min(320px, 45vw);
      height: 12px;
      accent-color: #006241;
    }
    .coupon-list {
      display: grid;
      gap: 12px;
    }
    .coupon-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #d8dfda;
      border-radius: 10px;
    }
    .coupon-card.done {
      background: #eef6f1;
      color: #68736c;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .card-no {
      font-size: 16px;
      font-weight: 800;
      color: #151916;
    }
    .card-status {
      font-size: 16px;
      font-weight: 800;
      color: #151916;
    }
    .field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 8px;
      align-items: end;
      min-width: 0;
    }
    .field label {
      color: #5f6f66;
      font-size: 12px;
      font-weight: 800;
    }
    .value {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #d8dfda;
      border-radius: 8px;
      background: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card-actions {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .copy-button {
      min-height: 44px;
      background: #006241;
      border-color: #006241;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
    }
    .done-button,
    .both-button {
      min-height: 44px;
      font-size: 15px;
      font-weight: 800;
      background: #ffffff;
    }
    .coupon-card.done .copy-button {
      background: #5fa087;
      border-color: #5fa087;
    }
    .note {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 36px;
      resize: vertical;
      padding: 7px 8px;
    }
    .pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .copy-ok {
      color: #006241;
      font-size: 13px;
      min-width: 74px;
    }
    .sync {
      color: #69756e;
      white-space: nowrap;
    }
    .error {
      padding: 16px;
      border: 1px solid #e0b4b4;
      background: #fff3f3;
      color: #8a1f1f;
    }
    @media (max-width: 820px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar input {
        grid-column: 1 / -1;
      }
      .coupon-card {
        padding: 10px;
      }
      .fields { grid-template-columns: 1fr; }
      .field { grid-template-columns: minmax(0, 1fr) 126px; }
      .card-actions {
        grid-template-columns: 1fr 1fr;
      }
      .field label,
      .copy-button,
      .done-button,
      .both-button {
        font-size: 16px;
      }
      .note {
        min-width: 120px;
      }
    }
    @media (max-width: 390px) {
      .field { grid-template-columns: minmax(0, 1fr) 116px; }
      .value { font-size: 15px; padding: 9px 8px; }
      .wrap { width: min(100% - 12px, 980px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
    <div class="top">
      <h1>쿠폰 2서버</h1>
      <a class="home" href="index.html">홈</a>
    </div>
    <div class="stats">
      <span>전체 <b id="totalCount">0</b>개</span>
      <span>완료 <b id="doneCount">0</b>개</span>
      <span>남음 <b id="remainCount">0</b>개</span>
      <span>표시 <b id="shownCount">0</b>개</span>
    </div>
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="번호, 쿠폰번호, 등록코드 검색" autocomplete="off" />
      <select id="filterSelect" aria-label="완료 상태 필터">
        <option value="all">전체 보기</option>
        <option value="pending">미완료만</option>
        <option value="done">완료만</option>
      </select>
      <select id="pageSizeSelect" aria-label="페이지당 보기">
        <option value="50">50개씩</option>
        <option value="100" selected>100개씩</option>
        <option value="200">200개씩</option>
      </select>
      <button id="saveButton" type="button">작업 저장</button>
      <button id="loadButton" type="button">작업 불러오기</button>
      <button id="clearButton" type="button">초기화</button>
    </div>
    </div>
  </header>

  <main class="wrap">
    <div id="message" class="status">
      <span>데이터 불러오는 중</span>
      <progress id="progressBar" value="0" max="1"></progress>
    </div>

    <section id="couponRows" class="coupon-list" aria-label="쿠폰번호 등록코드 목록"></section>

    <div class="pager">
      <button id="prevButton" type="button">이전</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextButton" type="button">다음</button>
      <span id="copyStatus" class="copy-ok" aria-live="polite"></span>
    </div>
  </main>

  <input id="loadFileInput" type="file" accept="application/json,.json" hidden />

  <script type="module">
    const DATA_URL = "coupons2.json";
    const STORAGE_PREFIX = "starbucks-helper-coupon2-work-v5";
    const LEGACY_STORAGE_KEYS = ["starbucks-helper-coupon2-v4"];
    const FIRESTORE_COLLECTION = "couponWork";
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAQpr3_koSKTAfihI8E3-kW3PknfMrQdaA",
      authDomain: "starbucks-helper-f578e.firebaseapp.com",
      projectId: "starbucks-helper-f578e",
      storageBucket: "starbucks-helper-f578e.firebasestorage.app",
      messagingSenderId: "1015231512258",
      appId: "1:1015231512258:web:25bb0229b5bc90b56a455b",
      measurementId: "G-8H2H0NCJDF"
    };

    const state = {
      coupons: [],
      filtered: [],
      page: 1,
      pageSize: 100,
      work: {
        completed: {},
        notes: {}
      },
      storageKey: "",
      remoteDocument: "",
      sync: {
        enabled: false,
        ready: false,
        applyingRemote: false,
        saveTimer: null,
        status: "로컬 저장"
      }
    };

    const els = {
      search: document.getElementById("searchInput"),
      filter: document.getElementById("filterSelect"),
      pageSize: document.getElementById("pageSizeSelect"),
      rows: document.getElementById("couponRows"),
      message: document.getElementById("message"),
      progress: document.getElementById("progressBar"),
      pageInfo: document.getElementById("pageInfo"),
      prev: document.getElementById("prevButton"),
      next: document.getElementById("nextButton"),
      save: document.getElementById("saveButton"),
      load: document.getElementById("loadButton"),
      clear: document.getElementById("clearButton"),
      loadFile: document.getElementById("loadFileInput"),
      copyStatus: document.getElementById("copyStatus"),
      totalCount: document.getElementById("totalCount"),
      doneCount: document.getElementById("doneCount"),
      remainCount: document.getElementById("remainCount"),
      shownCount: document.getElementById("shownCount")
    };

    function couponKey(coupon) {
      return coupon.coupon_number;
    }

    function buildDatasetId(coupons) {
      if (!coupons.length) return DATA_URL.replace(/[^a-z0-9_-]/gi, "_");
      const first = coupons[0].coupon_number;
      const last = coupons[coupons.length - 1].coupon_number;
      return [DATA_URL, coupons.length, first, last]
        .join("-")
        .replace(/[^a-z0-9_-]/gi, "_");
    }

    function configureDatasetStorage() {
      const datasetId = buildDatasetId(state.coupons);
      state.storageKey = `${STORAGE_PREFIX}-${datasetId}`;
      state.remoteDocument = datasetId;
    }

    function normalizeCoupon(item, index) {
      return {
        no: Number(item.no || index + 1),
        coupon_number: String(item.coupon_number || ""),
        registration_code: String(item.registration_code || "")
      };
    }

    function couponByLegacyKey(key) {
      return state.coupons.find((coupon) => {
        return String(coupon.no) === String(key)
          || coupon.coupon_number === String(key)
          || coupon.registration_code === String(key);
      });
    }

    function migrateWorkKeys(work) {
      const migrated = { completed: {}, notes: {} };
      const completed = work && typeof work.completed === "object" && work.completed ? work.completed : {};
      const notes = work && typeof work.notes === "object" && work.notes ? work.notes : {};

      Object.entries(completed).forEach(([key, value]) => {
        const coupon = couponByLegacyKey(key);
        migrated.completed[coupon ? couponKey(coupon) : key] = value;
      });

      Object.entries(notes).forEach(([key, value]) => {
        const coupon = couponByLegacyKey(key);
        migrated.notes[coupon ? couponKey(coupon) : key] = value;
      });

      return migrated;
    }

    function mergeWork(base, next) {
      return {
        completed: { ...base.completed, ...next.completed },
        notes: { ...base.notes, ...next.notes }
      };
    }

    function loadWorkFromStorage() {
      if (!state.storageKey) return;
      let restored = { completed: {}, notes: {} };
      const keys = [...new Set([...LEGACY_STORAGE_KEYS, state.storageKey])];

      keys.forEach((key) => {
        const raw = localStorage.getItem(key);
        if (!raw) return;
        try {
          restored = mergeWork(restored, migrateWorkKeys(JSON.parse(raw)));
        } catch {
          if (key === state.storageKey) localStorage.removeItem(key);
        }
      });

      state.work = restored;
      localStorage.setItem(state.storageKey, JSON.stringify(state.work));
    }

    function saveWorkToStorage() {
      if (!state.storageKey) return;
      localStorage.setItem(state.storageKey, JSON.stringify(state.work));
      updateStatus();
      queueRemoteSave();
    }

    function setSyncStatus(text) {
      state.sync.status = text;
      updateStatus();
    }

    function sanitizeWork(work) {
      return migrateWorkKeys({
        completed: work && typeof work.completed === "object" && work.completed ? work.completed : {},
        notes: work && typeof work.notes === "object" && work.notes ? work.notes : {}
      });
    }

    function buildRemotePayload() {
      return {
        completed: state.work.completed,
        notes: state.work.notes,
        updatedAt: new Date().toISOString()
      };
    }

    function queueRemoteSave() {
      if (!state.sync.ready || state.sync.applyingRemote) return;
      window.clearTimeout(state.sync.saveTimer);
      state.sync.saveTimer = window.setTimeout(saveWorkToRemote, 450);
    }

    async function saveWorkToRemote() {
      if (!state.sync.ready || !state.sync.ref) return;
      try {
        setSyncStatus("동기화 중");
        await state.sync.setDoc(state.sync.ref, buildRemotePayload(), { merge: true });
        setSyncStatus("동기화 완료");
      } catch {
        setSyncStatus("동기화 실패");
      }
    }

    async function initFirebaseSync() {
      try {
        const [{ initializeApp }, firestore] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
        ]);
        const app = initializeApp(FIREBASE_CONFIG);
        const db = firestore.getFirestore(app);
        const workRef = firestore.doc(db, FIRESTORE_COLLECTION, state.remoteDocument || "main");
        state.sync.enabled = true;
        state.sync.ready = true;
        state.sync.ref = workRef;
        state.sync.setDoc = firestore.setDoc;
        setSyncStatus("Firebase 연결됨");

        firestore.onSnapshot(workRef, (snapshot) => {
          if (!snapshot.exists()) {
            saveWorkToRemote();
            return;
          }
          state.sync.applyingRemote = true;
          state.work = mergeWork(state.work, sanitizeWork(snapshot.data()));
          if (state.storageKey) {
            localStorage.setItem(state.storageKey, JSON.stringify(state.work));
          }
          state.sync.applyingRemote = false;
          setSyncStatus("실시간 동기화");
          if (state.coupons.length) filterCoupons();
        }, () => {
          setSyncStatus("동기화 실패");
        });
      } catch {
        setSyncStatus("로컬 저장");
      }
    }

    function updateStatus() {
      const total = state.coupons.length;
      const shown = state.filtered.length;
      const completed = state.coupons.reduce((sum, coupon) => {
        return sum + (state.work.completed[couponKey(coupon)] ? 1 : 0);
      }, 0);
      els.progress.max = total || 1;
      els.progress.value = completed;
      els.totalCount.textContent = total.toLocaleString();
      els.doneCount.textContent = completed.toLocaleString();
      els.remainCount.textContent = (total - completed).toLocaleString();
      els.shownCount.textContent = shown.toLocaleString();
      els.message.innerHTML = `<span>전체 ${total}개 · 검색결과 ${shown}개 · 완료 ${completed}개</span><progress id="progressBar" value="${completed}" max="${total || 1}"></progress><span class="sync">${state.sync.status}</span>`;
      els.progress = document.getElementById("progressBar");
    }

    function filterCoupons() {
      const term = els.search.value.trim();
      const mode = els.filter.value;
      state.filtered = state.coupons.filter((coupon) => {
        const isDone = Boolean(state.work.completed[couponKey(coupon)]);
        if (mode === "pending" && isDone) return false;
        if (mode === "done" && !isDone) return false;
        if (!term) return true;
        return String(coupon.no).includes(term)
          || coupon.coupon_number.includes(term)
          || coupon.registration_code.includes(term);
      });
      state.page = 1;
      render();
    }

    function pageCount() {
      return Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    }

    function render() {
      const maxPage = pageCount();
      state.page = Math.min(Math.max(1, state.page), maxPage);

      const start = (state.page - 1) * state.pageSize;
      const pageRows = state.filtered.slice(start, start + state.pageSize);

      els.rows.replaceChildren(...pageRows.map((coupon) => {
        const key = couponKey(coupon);
        const isDone = Boolean(state.work.completed[key]);
        const card = document.createElement("article");
        card.className = `coupon-card${isDone ? " done" : ""}`;

        const head = document.createElement("div");
        head.className = "card-head";
        const no = document.createElement("div");
        no.className = "card-no";
        no.textContent = `#${coupon.no}`;
        const status = document.createElement("div");
        status.className = "card-status";
        status.textContent = isDone ? "완료" : "미완료";
        head.append(no, status);

        const fields = document.createElement("div");
        fields.className = "fields";

        const couponField = document.createElement("div");
        couponField.className = "field";
        const couponLabel = document.createElement("label");
        couponLabel.textContent = "쿠폰번호";
        const couponValue = document.createElement("input");
        couponValue.type = "text";
        couponValue.className = "value";
        couponValue.value = coupon.coupon_number;
        couponValue.readOnly = true;
        couponValue.setAttribute("aria-label", `쿠폰번호 ${coupon.no}`);
        couponLabel.append(couponValue);
        couponField.append(couponLabel);

        const couponCopy = document.createElement("button");
        couponCopy.type = "button";
        couponCopy.className = "copy-button";
        couponCopy.textContent = "쿠폰번호 복사";
        couponCopy.addEventListener("click", () => copyText(coupon.coupon_number, "쿠폰번호 복사됨"));
        couponField.append(couponCopy);

        const registrationField = document.createElement("div");
        registrationField.className = "field";
        const registrationLabel = document.createElement("label");
        registrationLabel.textContent = "등록코드";
        const registrationValue = document.createElement("input");
        registrationValue.type = "text";
        registrationValue.className = "value";
        registrationValue.value = coupon.registration_code;
        registrationValue.readOnly = true;
        registrationValue.setAttribute("aria-label", `등록코드 ${coupon.no}`);
        registrationLabel.append(registrationValue);
        registrationField.append(registrationLabel);

        const registrationCopy = document.createElement("button");
        registrationCopy.type = "button";
        registrationCopy.className = "copy-button";
        registrationCopy.textContent = "등록코드 복사";
        registrationCopy.addEventListener("click", () => copyText(coupon.registration_code, "등록코드 복사됨"));
        registrationField.append(registrationCopy);
        fields.append(couponField, registrationField);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const doneButton = document.createElement("button");
        doneButton.type = "button";
        doneButton.className = "done-button";
        doneButton.textContent = isDone ? "완료 취소" : "완료 처리";
        doneButton.addEventListener("click", () => {
          if (state.work.completed[key]) {
            delete state.work.completed[key];
          } else {
            state.work.completed[key] = true;
          }
          saveWorkToStorage();
          filterCoupons();
        });

        const bothButton = document.createElement("button");
        bothButton.type = "button";
        bothButton.className = "both-button";
        bothButton.textContent = "두 번호 복사";
        bothButton.addEventListener("click", () => {
          copyText(`${coupon.coupon_number}\t${coupon.registration_code}`, "두 번호 복사됨");
        });
        actions.append(doneButton, bothButton);

        const note = document.createElement("textarea");
        note.className = "note";
        note.value = state.work.notes[key] || "";
        note.placeholder = "사용자 메모";
        note.addEventListener("input", () => {
          if (note.value.trim()) {
            state.work.notes[key] = note.value;
          } else {
            delete state.work.notes[key];
          }
          saveWorkToStorage();
        });

        card.append(head, fields, actions, note);
        return card;
      }));

      els.pageInfo.textContent = `${state.page} / ${maxPage}`;
      els.prev.disabled = state.page <= 1;
      els.next.disabled = state.page >= maxPage;
      updateStatus();
    }

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
        els.copyStatus.textContent = successMessage;
      } catch {
        els.copyStatus.textContent = "복사 실패";
      }
      window.setTimeout(() => {
        els.copyStatus.textContent = "";
      }, 1400);
    }

    function downloadWork() {
      const payload = {
        version: 2,
        updated: new Date().toISOString(),
        completed: state.work.completed,
        notes: state.work.notes
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "starbucks-helper-coupon-work.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importWork(file) {
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const parsed = JSON.parse(String(reader.result || "{}"));
          state.work.completed = parsed.completed || {};
          state.work.notes = parsed.notes || {};
          saveWorkToStorage();
          render();
        } catch {
          alert("작업 파일을 불러올 수 없습니다.");
        }
      });
      reader.readAsText(file);
    }

    async function loadCoupons() {
      try {
        const response = await fetch(DATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("coupons.json");
        const data = await response.json();
        state.coupons = data.map(normalizeCoupon);
        state.filtered = state.coupons;
        configureDatasetStorage();
        loadWorkFromStorage();
        initFirebaseSync();
        render();
      } catch {
        els.message.innerHTML = '<div class="error">coupons.json을 불러올 수 없습니다.</div>';
      }
    }

    els.search.addEventListener("input", filterCoupons);
    els.filter.addEventListener("change", filterCoupons);
    els.pageSize.addEventListener("change", () => {
      state.pageSize = Number(els.pageSize.value);
      state.page = 1;
      render();
    });
    els.prev.addEventListener("click", () => {
      state.page -= 1;
      render();
    });
    els.next.addEventListener("click", () => {
      state.page += 1;
      render();
    });
    els.save.addEventListener("click", downloadWork);
    els.load.addEventListener("click", () => els.loadFile.click());
    els.loadFile.addEventListener("change", () => {
      const file = els.loadFile.files && els.loadFile.files[0];
      if (file) importWork(file);
      els.loadFile.value = "";
    });
    els.clear.addEventListener("click", () => {
      if (!confirm("완료 여부와 메모를 초기화할까요?")) return;
      state.work.completed = {};
      state.work.notes = {};
      saveWorkToStorage();
      render();
    });

    loadCoupons();
  </script>
</body>
</html>
