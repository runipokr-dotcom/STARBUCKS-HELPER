<script type="module">
const FIREBASE_CONFIG={apiKey:"AIzaSyAQpr3_koSKTAfihI8E3-kW3PknfMrQdaA",authDomain:"starbucks-helper-f578e.firebaseapp.com",projectId:"starbucks-helper-f578e",storageBucket:"starbucks-helper-f578e.firebasestorage.app",messagingSenderId:"1015231512258",appId:"1:1015231512258:web:25bb0229b5bc90b56a455b",measurementId:"G-8H2H0NCJDF"};
const FIRESTORE_COLLECTION="couponWork";
const servers=[{id:1,dataUrl:"coupons1.json",storagePrefix:"starbucks-helper-coupon-work-v3"},{id:2,dataUrl:"coupons2.json",storagePrefix:"starbucks-helper-coupon2-work-v5"}];
const liveDot=document.getElementById("liveDot"),liveText=document.getElementById("liveText"),lastSync=document.getElementById("lastSync");
const runtime=new Map();
function buildDatasetId(dataUrl,coupons){if(!coupons.length)return dataUrl.replace(/[^a-z0-9_-]/gi,"_");return[dataUrl,coupons.length,String(coupons[0]?.coupon_number||""),String(coupons[coupons.length-1]?.coupon_number||"")].join("-").replace(/[^a-z0-9_-]/gi,"_")}
function safeWork(value){return value&&typeof value==="object"?value:{} }

function renderServer(serverId,coupons,work){const completed=safeWork(work.completed);let done=0;for(const c of coupons){if(completed[String(c.coupon_number)]===true)done++}const total=coupons.length,remain=Math.max(0,total-done),percent=total?Math.round(done/total*100):0;document.getElementById(`server${serverId}Total`).textContent=total.toLocaleString("ko-KR");document.getElementById(`server${serverId}Done`).textContent=done.toLocaleString("ko-KR");document.getElementById(`server${serverId}Remain`).textContent=remain.toLocaleString("ko-KR");document.getElementById(`server${serverId}Percent`).textContent=`${percent}%`;document.getElementById(`server${serverId}Progress`).style.width=`${percent}%`}

function refreshFromLocal(){for(const [id,r] of runtime){r.local=readLocal(r.server,r.datasetId);renderServer(id,r.coupons,mergeWork(r.local,r.remote))}stamp()}
async function initDashboard(){try{const[{initializeApp},firestore,datasets]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"),Promise.all(servers.map(async server=>{const response=await fetch(server.dataUrl,{cache:"no-store"});if(!response.ok)throw new Error(server.dataUrl);return{server,coupons:await response.json()}}))]);const app=initializeApp(FIREBASE_CONFIG),db=firestore.getFirestore(app);let firstSnapshots=0;for(const item of datasets){const {server,coupons}=item,datasetId=buildDatasetId(server.dataUrl,coupons),local=readLocal(server,datasetId);const r={server,coupons,datasetId,local,remote:{}};runtime.set(server.id,r);renderServer(server.id,coupons,local);const ref=firestore.doc(db,FIRESTORE_COLLECTION,datasetId);firestore.onSnapshot(ref,snapshot=>{r.remote=snapshot.exists()?safeWork(snapshot.data()):{};r.local=readLocal(server,datasetId);renderServer(server.id,coupons,mergeWork(r.local,r.remote));firstSnapshots++;if(firstSnapshots>=datasets.length)setConnection("connected","실시간 동기화");stamp()},error=>{console.error(error);setConnection("error","동기화 오류")})}window.addEventListener("storage",refreshFromLocal);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshFromLocal()});window.addEventListener("focus",refreshFromLocal);setInterval(refreshFromLocal,2000)}catch(error){console.error(error);setConnection("error","연결 실패");lastSync.textContent="데이터 확인 필요"}}
