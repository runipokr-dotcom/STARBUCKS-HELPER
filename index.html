<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARBUCKS HELPER</title>
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7f6;
    color: #151916;
    --green: #006241;
    --border: #d8dfda;
    --muted: #5f6d64;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f5f7f6;
  }

  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 20px;
  }

  .header-inner {
    max-width: 980px;
    margin: 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 23px;
  }

  .subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px;
  }

  section {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }

  h2 {
    margin: 0 0 14px;
    font-size: 19px;
  }

  .tools {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .stores {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  a.card {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #ffffff;
    color: #151916;
    text-decoration: none;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    transition: transform .12s ease, border-color .12s ease;
  }

  a.card:hover {
    border-color: var(--green);
    transform: translateY(-1px);
  }

  a.tool {
    background: var(--green);
    border-color: var(--green);
    color: #ffffff;
  }

  @media (max-width: 800px) {
    .tools,
    .stores {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 430px) {
    main { padding: 14px; }
    section { padding: 14px; }
    a.card { min-height: 54px; font-size: 14px; }
  }
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <h1>☕ STARBUCKS HELPER</h1>

  </div>
</header>

<main>

      <a class="card tool" href="price.html">💰 가격 찾기 미로</a>
      <a class="card tool" href="calculate.html">🧮 상품 계산기</a>
    </div>
  </section>

  <section>
    <h2>🛒 판매처 바로가기</h2>
    <div class="stores">
      <a class="card" href="https://www.starbucks.co.kr/index.do" target="_blank" rel="noopener noreferrer">스타벅스 공식</a>
      <a class="card" href="https://brand.naver.com/starbucks" target="_blank" rel="noopener noreferrer">네이버 공식</a>
      <a class="card" href="https://minishop.gmarket.co.kr/starbucks?spm=gmktpc.minishop.0.0.cb8f3defUCyJmM" target="_blank" rel="noopener noreferrer">G마켓</a>
      <a class="card" href="https://www.ssg.com/disp/brandShop.ssg?brandId=2000016468&ctgId=6000174585" target="_blank" rel="noopener noreferrer">SSG</a>
      <a class="card" href="https://www.musinsa.com/brand/starbucks/products?gf=A" target="_blank" rel="noopener noreferrer">무신사</a>
      <a class="card" href="https://display.wconcept.co.kr/rn/brand/116134" target="_blank" rel="noopener noreferrer">W컨셉</a>
      <a class="card" href="https://www.29cm.co.kr/store/brand/104781?brandId=104781&sort=RECOMMENDED&page=1" target="_blank" rel="noopener noreferrer">29CM</a>
    </div>
  </section>
</main>
</body>
</html>
