<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063c2d">
<title>STARBUCKS HELPER</title>
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    --green-950: #063c2d;
    --green-800: #075e45;
    --green-700: #00754a;
    --green-100: #dff2e8;
    --canvas: #f3f5f3;
    --surface: #ffffff;
    --text: #18201c;
    --muted: #6a766f;
    --line: #dfe5e1;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--canvas);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-width: 320px;
    background: var(--canvas);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    overflow: hidden;
    background: var(--green-950);
    color: #fff;
    padding: calc(22px + env(safe-area-inset-top)) 20px 72px;
  }

  .hero::after {
    content: "";
    position: absolute;
    right: -54px;
    bottom: -76px;
    width: 210px;
    height: 210px;
    border: 34px solid rgba(255, 255, 255, .055);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-inner,
  main {
    width: min(100%, 760px);
    margin: 0 auto;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    color: rgba(255,255,255,.7);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
  }

  .brand-dot {
    display: grid;
    place-items: center;
    width: 25px;
    height: 25px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 50%;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0;
  }

  h1 {
    margin: 0;
    max-width: 340px;
    font-size: clamp(31px, 9vw, 44px);
    line-height: 1.06;
    letter-spacing: -.055em;
  }

  .subtitle {
    margin: 14px 0 0;
    color: rgba(255,255,255,.68);
    font-size: 14px;
    line-height: 1.55;
  }

  main {
    position: relative;
    z-index: 1;
    margin-top: -42px;
    padding: 0 14px calc(28px + env(safe-area-inset-bottom));
  }

  .panel {
    margin-bottom: 14px;
    padding: 18px;
    border: 1px solid rgba(19, 51, 37, .08);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: 0 10px 28px rgba(18, 46, 34, .07);
  }

  .section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.025em;
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .quick-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 126px;
    overflow: hidden;
    padding: 15px;
    border: 0;
    border-radius: 17px;
    background: var(--green-700);
    color: #fff;
    text-decoration: none;
    transform: translateZ(0);
    transition: transform .14s ease, background-color .14s ease;
    will-change: transform;
  }

  .quick-card:nth-child(2) { background: var(--green-800); }
  .quick-card:nth-child(3) { background: #1c4437; }

  .quick-card::after {
    content: "→";
    position: absolute;
    right: 14px;
    bottom: 12px;
    color: rgba(255,255,255,.82);
    font-size: 17px;
  }

  .quick-card:active,
  .utility-card:active,
  .store:active {
    transform: scale(.975);
  }

  .quick-card.disabled {
    background: #e7ebe8;
    color: #89938d;
    cursor: default;
    will-change: auto;
  }

  .quick-card.disabled::after { content: ""; }

  .card-number {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    opacity: .68;
  }

  .card-title {
    padding-right: 22px;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -.03em;
  }

  .utility-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
  }

  .utility-card {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 68px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    transform: translateZ(0);
    transition: transform .14s ease, border-color .14s ease;
  }

  .icon-box {
    display: grid;
    flex: 0 0 37px;
    place-items: center;
    width: 37px;
    height: 37px;
    border-radius: 12px;
    background: var(--green-100);
    font-size: 17px;
  }

  .utility-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
  }

  .stores {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .store {
    display: grid;
    place-items: center;
    min-height: 53px;
    padding: 8px 4px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: #fbfcfb;
    color: #39433d;
    text-align: center;
    text-decoration: none;
    font-size: 11px;
    font-weight: 750;
    line-height: 1.2;
    transform: translateZ(0);
    transition: transform .14s ease, border-color .14s ease;
  }

  @media (hover: hover) {
    .quick-card:hover { transform: translateY(-2px); }
    .utility-card:hover,
    .store:hover { border-color: var(--green-700); }
  }

  @media (min-width: 620px) {
    .hero { padding-left: 28px; padding-right: 28px; }
    main { padding-left: 20px; padding-right: 20px; }
    .quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  @media (max-width: 360px) {
    .panel { padding: 15px; border-radius: 19px; }
    .quick-card { min-height: 116px; }
    .stores { gap: 6px; }
    .store { font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .quick-card,
    .utility-card,
    .store { transition: none; }
  }
</style>
</head>

<body>

</main>
</body>
</html>
