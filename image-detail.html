<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><script src="auth-gate.js?v=20260925-1"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063c2d"><title>상품 상세이미지 만들기 | STARBUCKS HELPER</title><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>
:root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--g:#00754a;--deep:#063c2d;--bg:#f3f5f3;--line:#dce4df;--text:#18201c;--muted:#68756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}header{padding:calc(18px + env(safe-area-inset-top)) 16px 30px;background:var(--deep);color:#fff}.head,main{width:min(100%,860px);margin:auto}.back{color:#cde1d7;text-decoration:none;font-size:13px;font-weight:800}h1{margin:17px 0 6px;font-size:28px;letter-spacing:-.04em}.sub{margin:0;color:#c7d5ce;font-size:13px;line-height:1.5}main{margin-top:-18px;padding:0 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:16px;border:1px solid rgba(9,54,39,.09);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(13,48,35,.06)}h2{margin:0 0 12px;font-size:16px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.label,label{color:var(--muted);font-size:11px;font-weight:800}.text{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;color:var(--text);outline:none}.text:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.1)}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--muted);font-size:12px;font-weight:800}.choice.active{border-color:var(--g);background:#edf8f2;color:var(--g)}.switch-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px}.switch-line span{font-size:13px;font-weight:700;color:var(--text)}.switch{position:relative;width:44px;height:26px;border-radius:999px;background:#dbe3de;border:0;flex:none}.switch.on{background:var(--g)}.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}.switch.on::after{left:21px}.footer-note{margin:6px 2px 0;color:var(--muted);font-size:11.5px;line-height:1.5}#photoCard{transition:box-shadow .15s,border-color .15s}#photoCard.drop-active{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.15)}.drop{display:grid;place-items:center;gap:6px;padding:23px 12px;border:1.5px dashed #9eb9aa;border-radius:16px;background:#f6fbf8;color:var(--g);font-weight:800;font-size:13px;text-align:center;cursor:pointer}.drop input{display:none}.drop small{color:var(--muted);font-weight:600}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.shot{position:relative;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;padding:6px;cursor:grab}.shot.dragging{opacity:.4}.shot.dragover{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.1)}.shot img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;pointer-events:none}.shot .no{position:absolute;left:9px;top:9px;background:rgba(6,60,45,.75);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px}.shot .remove{position:absolute;right:6px;top:6px;width:22px;height:22px;border:0;border-radius:50%;background:#fff;color:var(--deep);font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.15)}.empty{margin:10px 2px 0;color:var(--muted);font-size:12px}.preview-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:repeating-conic-gradient(#f0f2f0 0% 25%,#fff 0% 50%) 50%/16px 16px}#canvas{display:block;width:100%;height:auto}.actions{display:grid;gap:9px;margin-top:12px}.btn{border:0;border-radius:14px;padding:14px 10px;font-size:13.5px;font-weight:900}.primary{background:var(--g);color:#fff}.btn:disabled{opacity:.4}.toast{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,20px);padding:11px 15px;border-radius:999px;background:#15221c;color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:430px){.card{padding:13px}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="head"><a class="back" href="index.html">← 헬퍼 홈</a><h1>상품 상세이미지 만들기</h1><p class="sub">한 상품의 사진 여러 장을 순서대로 쌓아 쿠팡용 상세이미지 1장(가로 1000px)으로 만들어줍니다.</p></div></header><main id="app">
<section class="card"><h2>1. 상품명</h2><div class="field"><input id="title" class="text" placeholder="예: 브라운 리프 투 커피 머그 414ml"></div></section>
<section id="photoCard" class="card"><h2>2. 사진 추가 (순서대로)</h2><label class="drop" for="fileInput">+ 사진을 선택하거나 끌어다 놓으세요<small>정보카드 → 정면 → 뒷면 → 앵글 등 올리는 순서가 곧 배치 순서예요 · 이 박스 근처 어디에 놓아도 추가돼요</small><input id="fileInput" type="file" accept="image/*" multiple></label><div id="shots" class="shots"></div><p id="empty" class="empty">아직 추가된 사진이 없어요.</p></section>
<section class="card"><h2>3. 배치 설정</h2><div class="field"><span class="label">사진 사이 간격</span><div class="choices"><button class="choice" data-gap="30">좁게</button><button class="choice active" data-gap="55">보통</button><button class="choice" data-gap="90">넓게</button></div></div><div class="switch-line"><span>맨 마지막에 상품 안내 이미지 자동 첨부</span><button id="footerToggle" type="button" class="switch on"></button></div><p class="footer-note">각인·배송·교환/반품 안내가 담긴 고정 이미지가 자동으로 맨 뒤에 붙어요. 끄면 붙이지 않아요.</p></section>
<section class="card"><h2>4. 미리보기</h2><div class="preview-wrap"><canvas id="canvas" width="1000" height="240"></canvas></div><div class="actions"><button id="downloadPng" class="btn primary" type="button" disabled>고화질 PNG 저장</button></div></section></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),W=1000,KEY='starbucks-helper-image-detail-v1';
const FOOTER_SRC='detail-footer.png';
let items=[],gap=55,useFooter=true,uid=0,dragFrom=-1,footerImg=null,footerReady=false;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({gap,useFooter,title:$('title').value}))}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;gap=Number(s.gap)||gap;useFooter=s.useFooter!==false;$('title').value=s.title||''}catch{}}
function loadFile(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>ok({id:++uid,img,url});img.onerror=no;img.src=url})}
async function addFiles(list){for(const f of [...list].filter(f=>f.type.startsWith('image/'))){try{items.push(await loadFile(f))}catch{toast(f.name+' 파일을 불러오지 못했어요')}}renderShots();preview()}
function renderShots(){$('empty').style.display=items.length?'none':'block';$('downloadPng').disabled=!items.length;$('shots').innerHTML=items.map((it,i)=>`<div class="shot" draggable="true" data-i="${i}"><span class="no">${i+1}</span><button class="remove" type="button" title="삭제">×</button><img src="${it.url}"></div>`).join('');document.querySelectorAll('.shot').forEach(c=>bindShot(c,+c.dataset.i));save()}
function bindShot(card,i){const it=items[i];card.querySelector('.remove').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);renderShots();preview()};card.ondragstart=e=>{dragFrom=i;card.classList.add('dragging')};card.ondragend=()=>{dragFrom=-1;document.querySelectorAll('.shot').forEach(x=>x.classList.remove('dragging','dragover'))};card.ondragover=e=>{e.preventDefault();card.classList.add('dragover')};card.ondragleave=()=>card.classList.remove('dragover');card.ondrop=e=>{if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();e.stopPropagation();card.classList.remove('dragover');addFiles(e.dataTransfer.files);return}e.preventDefault();card.classList.remove('dragover');if(dragFrom<0||dragFrom===i)return;const[m]=items.splice(dragFrom,1);items.splice(i,0,m);renderShots();preview()}}
function loadFooter(){return new Promise(ok=>{const img=new Image();img.onload=()=>{footerImg=img;footerReady=true;ok(true)};img.onerror=()=>{footerReady=true;ok(false)};img.src=FOOTER_SRC})}
function drawScaled(ctx,img,y){const s=W/img.naturalWidth,h=Math.round(img.naturalHeight*s);ctx.drawImage(img,0,y,W,h);return h}
async function preview(){
  if(!footerReady)await loadFooter();
  const c=$('canvas'),ctx=c.getContext('2d');
  if(!items.length){c.height=240;ctx.clearRect(0,0,c.width,c.height);return}
  const heights=items.map(it=>Math.round(it.img.naturalHeight*(W/it.img.naturalWidth)));
  let total=heights.reduce((a,b)=>a+b,0)+gap*(items.length-1);
  const showFooter=useFooter&&footerImg;
  let footerH=0;
  if(showFooter){footerH=Math.round(footerImg.naturalHeight*(W/footerImg.naturalWidth));total+=gap+footerH}
  c.width=W;c.height=Math.max(total,1);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  let y=0;
  items.forEach((it,i)=>{y+=drawScaled(ctx,it.img,y);if(i<items.length-1)y+=gap});
  if(showFooter){y+=gap;drawScaled(ctx,footerImg,y)}
  save();
}
document.querySelectorAll('[data-gap]').forEach(b=>b.onclick=()=>{gap=+b.dataset.gap;document.querySelectorAll('[data-gap]').forEach(x=>x.classList.toggle('active',x===b));preview()});
$('footerToggle').onclick=()=>{useFooter=!useFooter;$('footerToggle').classList.toggle('on',useFooter);preview()};
$('title').oninput=save;
$('fileInput').onchange=e=>addFiles(e.target.files).then(()=>e.target.value='');
const photoCard=$('photoCard');
function hasFiles(e){const t=e.dataTransfer&&e.dataTransfer.types;return t&&[...t].includes('Files')}
['dragover','dragenter'].forEach(v=>photoCard.addEventListener(v,e=>{if(hasFiles(e)){e.preventDefault();photoCard.classList.add('drop-active')}}));
photoCard.addEventListener('dragleave',e=>{if(!photoCard.contains(e.relatedTarget))photoCard.classList.remove('drop-active')});
photoCard.addEventListener('drop',e=>{photoCard.classList.remove('drop-active');if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
$('downloadPng').onclick=async()=>{await preview();$('canvas').toBlob(blob=>{if(!blob)return toast('PNG 생성에 실패했어요');const a=document.createElement('a'),url=URL.createObjectURL(blob),stamp=new Date().toISOString().slice(0,10).replace(/-/g,''),rawBase=$('title').value.trim().replace(/[^0-9A-Za-z가-힣_-]+/g,'_').replace(/^_+|_+$/g,''),name=rawBase?`상세이미지_${rawBase}`:`상세이미지_${stamp}`;a.href=url;a.download=`${name}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')};
restore();document.querySelector(`[data-gap="${gap}"]`)?.click();$('footerToggle').classList.toggle('on',useFooter);
loadFooter().then(ok=>{if(!ok)toast('안내 이미지(detail-footer.png)를 찾지 못했어요');preview()});
document.fonts.ready.then(preview);
</script>
</body></html>
