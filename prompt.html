  </header>

  <section class="panel" aria-labelledby="composerTitle">
    <div class="composerIntro">
      <div>
        <h2 id="composerTitle">클릭해서 프롬프트 조합</h2>
        <p class="sub">원하는 항목을 누르면 선택한 순서대로 이어집니다. 선택된 항목을 다시 누르면 빠집니다.</p>
      </div>
      <span class="adultBadge">성인(25+) 전용</span>
    </div>
    <div class="termGroups" id="termGroups"></div>

    <div class="composerResult">
      <div class="composerResultHead">
        <label for="composerOutput">조합 결과</label>
        <span class="selectedCount" id="selectedCount">선택 0개</span>
      </div>
      <textarea id="composerOutput" readonly aria-describedby="composerHelp"></textarea>
      <p class="note" id="composerHelp">성인 기준 문구는 항상 맨 앞에 들어갑니다. 외부 채팅창에는 자동 전송하지 않아요.</p>
      <div class="composerActions">
        <button type="button" class="secondary" id="undoTermBtn">한 단계 취소</button>
        <button type="button" class="secondary" id="clearTermsBtn">전체 지우기</button>
        <button type="button" class="secondary" id="sendToBodyBtn">저장칸에 넣기</button>
        <button type="button" class="primaryAction" id="copyComposerBtn">조합문 복사</button>
      </div>
      <p class="note" id="composerNote" role="status">항목을 골라 조합해 보세요.</p>
    </div>
  </section>

  <section class="panel">
    <h2>새 프롬프트 추가</h2>
    <form id="promptForm">
      <label for="fTitle">제목</label>
      <input id="fTitle" type="text" maxlength="120" placeholder="예) 하이엔드 패션 캠페인 포스터" required autocomplete="off">

      <div class="row">
        <div>
          <label for="fTags">태그(쉼표로 구분, 선택)</label>
          <input id="fTags" type="text" placeholder="예) 포스터, 타이포, 상품이미지" autocomplete="off">
        </div>
        <div>
          <label for="fSource">출처 URL(선택)</label>
          <input id="fSource" type="url" placeholder="https://..." autocomplete="off">
        </div>
      </div>

      <label for="fBody">프롬프트 원문</label>
      <textarea id="fBody" placeholder="여기에 프롬프트 전체 내용을 붙여넣으세요" required></textarea>

      <div class="formActions">
        <button type="submit" id="submitBtn">저장</button>
      </div>
    </form>
    <p class="note" id="formNote" role="status">서버에 연결 중…</p>
  </section>

  <section class="panel">
    <div class="searchBar">
      <input id="searchInput" type="search" placeholder="제목·태그·내용으로 검색" autocomplete="off">
      <span class="count" id="countText"></span>
    </div>
    <div class="cards" id="cardList"></div>
    <p class="empty" id="emptyText" hidden>저장된 프롬프트가 없어요. 위에서 하나 추가해보세요.</p>
  </section>
</main>

    undoTermBtn.disabled = clearTermsBtn.disabled = selectedTerms.length === 0;
    for (const [value, button] of termButtons) {
      button.setAttribute('aria-pressed', String(selectedTerms.some(term => term.value === value)));
    }
  }

  function toggleTerm(label, value) {
    const index = selectedTerms.findIndex(term => term.value === value);
    if (index >= 0) {
      selectedTerms.splice(index, 1);
      composerNote.textContent = `“${label}” 항목을 뺐어요.`;
    } else {
      selectedTerms.push({label, value});
      composerNote.textContent = `“${label}” 항목을 ${selectedTerms.length}번째로 추가했어요.`;
    }
    renderComposer();
  }

  function buildTermGroups() {

      const wrap = document.createElement('div');
      wrap.className = 'termGroup';

      heading.className = 'termGroupTitle';
      heading.textContent = group.title;
      const count = document.createElement('span');

      heading.appendChild(count);
      wrap.appendChild(heading);
      const chips = document.createElement('div');
      chips.className = 'termChips';
      for (const [label, value] of group.terms) {

        button.type = 'button';
        button.className = 'termChip';
        button.textContent = label;
        button.setAttribute('aria-pressed', 'false');
        button.title = value;
        button.addEventListener('click', () => toggleTerm(label, value));
        termButtons.set(value, button);
        chips.appendChild(button);
      }
      wrap.appendChild(chips);
      termGroups.appendChild(wrap);
    }
  }

    if (bodyInput.value.trim() && bodyInput.value !== next && !confirm('프롬프트 원문에 입력된 내용을 조합 결과로 바꿀까요?')) return;
    bodyInput.value = next;
    bodyInput.scrollIntoView({behavior:'smooth', block:'center'});
    bodyInput.focus();
    composerNote.textContent = '조합 결과를 아래 프롬프트 원문에 넣었어요. 제목을 적고 저장하면 됩니다.';
  });

  copyComposerBtn.addEventListener('click', async () => {
    const text = composerOutput.value;
    try {
      await navigator.clipboard.writeText(text);
      copyComposerBtn.textContent = '복사됨!';
      composerNote.textContent = '조합문을 복사했어요. 원하는 채팅창에 붙여넣으세요.';
    } catch {
      composerOutput.focus();
      composerOutput.select();
      composerNote.textContent = '자동 복사가 제한됐어요. 선택된 조합문을 길게 눌러 복사해 주세요.';
    }
    setTimeout(() => { copyComposerBtn.textContent = '조합문 복사'; }, 1400);
  });

  buildTermGroups();
  renderComposer();

  let items = [], ready = false, busy = false, query = '', expanded = new Set();
  let ref, f, db;

  function validate(data) {
    if (!data || data.version !== 1 || !Array.isArray(data.items) || !data.items.every(row =>
      row && typeof row.id === 'string' && typeof row.title === 'string' && typeof row.body === 'string'
    )) throw new Error('Invalid cloud prompt data');
    return data.items;
  }

  function matches(item, q) {
    if (!q) return true;
    const hay = [item.title, item.body, ...(item.tags || [])].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    try { return new Date(ts).toLocaleDateString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit'}); }
    catch { return ''; }
  }

  function render() {
    const q = query.trim().toLowerCase();
    const filtered = items.filter(item => matches(item, q)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    countText.textContent = ready ? `${filtered.length}개` : '';
    emptyText.hidden = !ready || filtered.length > 0;
    cardList.replaceChildren();

    for (const item of filtered) {
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'cardHead';
      const titleWrap = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'cardTitle';
      title.textContent = item.title;
      titleWrap.appendChild(title);
      if ((item.tags || []).length) {
        const meta = document.createElement('div');
        meta.className = 'cardMeta';
        for (const tag of item.tags) {
          const t = document.createElement('span');
          t.className = 'tag';
          t.textContent = tag;
          meta.appendChild(t);
        }
        titleWrap.appendChild(meta);
      }
      head.appendChild(titleWrap);
      const date = document.createElement('div');
      date.className = 'cardDate';
      date.textContent = fmtDate(item.createdAt);
      head.appendChild(date);
      card.appendChild(head);

      if (item.sourceUrl && /^https?:\/\//i.test(item.sourceUrl)) {
        const link = document.createElement('a');
        link.className = 'sourceLink';
        link.href = item.sourceUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = item.sourceUrl;
        link.style.display = 'block';
        link.style.marginTop = '6px';
        card.appendChild(link);
      }

      const isExpanded = expanded.has(item.id);
      const body = document.createElement('div');
      body.className = 'cardBody' + (isExpanded ? '' : ' clamped');
      body.textContent = item.body;
      card.appendChild(body);

      const actions = document.createElement('div');
      actions.className = 'cardActions';

      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'ghost';
      toggleBtn.textContent = isExpanded ? '접기' : '전체보기';
      toggleBtn.addEventListener('click', () => {
        if (isExpanded) expanded.delete(item.id); else expanded.add(item.id);
        render();
      });
      actions.appendChild(toggleBtn);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'ghost';
      copyBtn.textContent = '복사';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(item.body);
          copyBtn.textContent = '복사됨!';
        } catch {
          expanded.add(item.id);
          render();
          formNote.textContent = '자동 복사가 제한되어 있어요. 펼쳐진 원문을 길게 눌러 복사해 주세요.';
        }
        setTimeout(() => { copyBtn.textContent = '복사'; }, 1400);
      });
      actions.appendChild(copyBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'danger';
      delBtn.textContent = '삭제';
      delBtn.disabled = !ready || busy;
      delBtn.addEventListener('click', async () => {
        if (!confirm(`"${item.title}" 프롬프트를 삭제할까요?`)) return;
        await change(current => current.filter(row => row.id !== item.id));
      });
      actions.appendChild(delBtn);

      card.appendChild(actions);
      cardList.appendChild(card);
    }

    submitBtn.disabled = !ready || busy;
    titleInput.disabled = tagsInput.disabled = sourceInput.disabled = bodyInput.disabled = !ready || busy;
  }

  async function change(transform) {
    if (!ready || busy) return false;
    busy = true; formNote.textContent = '서버에 저장 중…'; render();
    try {
      const next = await f.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error('Missing prompt document');
        const result = transform(validate(snap.data()));
        tx.update(ref, {items: result, updatedAt: f.serverTimestamp()});
        return result;
      });
      items = next;
      formNote.textContent = '서버 저장 완료 · 다른 기기에서도 바로 보여요.';
      return true;
    } catch (error) {
      console.error('prompt save', error);
      formNote.textContent = '서버 저장 실패 · 연결을 확인하고 다시 시도해 주세요.';
      return false;
    } finally { busy = false; render(); }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const title = titleInput.value.trim();
    const body = bodyInput.value;
    if (!title || !body.trim()) return;
    const tags = tagsInput.value.split(',').map(s => s.trim()).filter(Boolean);
    const sourceUrl = sourceInput.value.trim();
    const item = {
      id: crypto.randomUUID(),
      title, body, tags, sourceUrl,
      createdAt: Date.now()
    };
    const ok = await change(current => [...current, item]);
    if (ok) {
      titleInput.value = ''; tagsInput.value = ''; sourceInput.value = ''; bodyInput.value = '';
      titleInput.focus();
    }
  });

  searchInput.addEventListener('input', () => { query = searchInput.value; render(); });

  render();

  try {
    const [{initializeApp, getApps}, firestore] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')
    ]);
    f = firestore;
    const app = getApps().find(a => a.name === '[DEFAULT]') || initializeApp(FIREBASE_CONFIG);
    db = f.getFirestore(app);
    ref = f.doc(db, COLLECTION, DOC_ID);
    await f.runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      if (snap.exists()) { validate(snap.data()); return; }
      tx.set(ref, {version: 1, items: [], updatedAt: f.serverTimestamp()});
    });
    f.onSnapshot(ref, {includeMetadataChanges: true}, snap => {
      try {
        if (!snap.exists()) throw new Error('Missing prompt document');
        items = validate(snap.data());
        ready = !snap.metadata.fromCache;
        if (!busy) formNote.textContent = ready ? '서버 연결 완료 · 여기 저장하면 다른 기기에서도 보여요.' : '서버 연결 확인 중…';
        render();
      } catch (error) {
        console.error('prompt snapshot', error);
        ready = false; render();
        formNote.textContent = '서버 목록을 읽지 못했어요. 새로고침 후 다시 시도해 주세요.';
      }
    }, error => {
      console.error('prompt sync', error);
      ready = false; render();
      formNote.textContent = '서버 연결 실패 · 새로고침 후 다시 시도해 주세요.';
    });
  } catch (error) {
    console.error('prompt init', error);
    formNote.textContent = '서버 연결 실패 · 새로고침 후 다시 시도해 주세요.';
  }
})();
</script>
</body>
</html>
