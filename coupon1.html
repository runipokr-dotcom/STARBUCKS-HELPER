<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARBUCKS HELPER - 쿠폰 1서버</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--g:#006241;--b:#f5f7f6;--c:#fff;--l:#d8dfda;--t:#151916;--m:#5f6d64;--d:#edf3ef}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t)}header{position:sticky;top:0;z-index:10;background:rgba(245,247,246,.97);border-bottom:1px solid var(--l);padding:12px}.wrap{width:min(980px,calc(100% - 20px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:22px}.home{text-decoration:none;color:var(--t);background:#fff;border:1px solid var(--l);border-radius:8px;padding:9px 12px;font-weight:800}.stats{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;color:var(--m);font-size:13px;font-weight:800}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px;gap:8px;margin-top:10px}input,select,button{min-height:44px;border-radius:8px;font-size:15px}input,select{border:1px solid var(--l);background:#fff;padding:0 11px}button{border:1px solid var(--g);background:var(--g);color:#fff;font-weight:900;padding:0 10px;white-space:nowrap;word-break:keep-all}.secondary{background:#fff;color:var(--t);border-color:var(--l)}button:disabled{opacity:.45}.status{margin-top:8px;min-height:20px;color:var(--m);font-size:13px;font-weight:800}main{padding:14px 0 40px}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:12px;display:grid;gap:10px}.done{background:var(--d);opacity:.62}.head{display:flex;justify-content:space-between}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px;align-items:end;min-width:0}label{font-size:12px;color:var(--m);font-weight:900}.value{width:100%;min-width:0;margin-top:5px;border:1px solid var(--l);border-radius:8px;padding:10px;font-size:18px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:clip;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px}.empty,.error{background:#fff;border:1px solid var(--l);border-radius:10px;padding:24px;text-align:center;color:var(--m)}.error{color:#a33}@media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.fields{grid-template-columns:1fr}.field{grid-template-columns:minmax(0,1fr) 126px}.value{font-size:16px;padding:9px 8px}.card{padding:10px}.actions{grid-template-columns:1fr 1fr}button{font-size:14px;padding:0 8px}}@media(max-width:390px){.field{grid-template-columns:minmax(0,1fr) 116px}.value{font-size:15px}.wrap{width:min(100% - 12px,980px)}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><h1>쿠폰 1서버</h1><a class="home" href="index.html">🏠 홈</a></div>
<div class="stats"><span>전체 <b id="total">0</b>개</span><span>완료 <b id="done">0</b>개</span><span>남음 <b id="remain">0</b>개</span><span>표시 <b id="shown">0</b>개</span></div>
<div class="toolbar"><input id="search" type="search" placeholder="번호·쿠폰번호·등록코드 검색"><select id="filter"><option value="all">전체 보기</option><option value="pending">미완료만</option><option value="done">완료만</option></select><select id="pageSize"><option value="50">50개씩</option><option value="100" selected>100개씩</option><option value="200">200개씩</option></select></div>
<div id="status" class="status">이 휴대폰에 자동 저장됩니다.</div>
</div></header>
<main class="wrap"><section id="list" class="list"><div class="empty">쿠폰 데이터를 불러오는 중...</div></section><div id="pager" class="pager"></div></main>
<script>
(()=>{const DATA_URL="coupons1.json",STORAGE_KEY="starbucks-helper-coupon1-v4",SCROLL_KEY=STORAGE_KEY+"-scroll";let coupons=[],filtered=[],page=1;const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{state={}}state.completed=state.completed&&typeof state.completed==="object"?state.completed:{};const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state));const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function cp(t,l){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}$("status").textContent=l+" 복사됨 · 자동 저장 중"}function toggle(no){const k=String(no);state.completed[k]=!state.completed[k];save();apply(false)}function apply(reset=true){const q=$("search").value.trim().toLowerCase(),m=$("filter").value;filtered=coupons.filter(x=>{const d=!!state.completed[String(x.no)];if(m==="pending"&&d)return false;if(m==="done"&&!d)return false;if(!q)return true;return [x.no,x.coupon_number,x.registration_code].some(v=>String(v).toLowerCase().includes(q))});if(reset)page=1;render()}function render(){const size=Number($("pageSize").value)||100,pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);const items=filtered.slice((page-1)*size,page*size);$("list").innerHTML=items.length?items.map(x=>{const d=!!state.completed[String(x.no)];return `<article class="card ${d?"done":""}"><div class="head"><strong>#${esc(x.no)}</strong><b>${d?"완료":"미완료"}</b></div><div class="fields"><div class="field"><label>쿠폰번호<input class="value" id="c-${x.no}" value="${esc(x.coupon_number)}" readonly></label><button onclick="copyCoupon('${x.no}')">쿠폰번호 복사</button></div><div class="field"><label>등록코드<input class="value" id="r-${x.no}" value="${esc(x.registration_code)}" readonly></label><button onclick="copyCode('${x.no}')">등록번호 복사</button></div></div><div class="actions"><button class="secondary" onclick="toggleCoupon('${x.no}')">${d?"완료 취소":"완료 처리"}</button><button class="secondary" onclick="copyBoth('${x.no}')">두 번호 복사</button></div></article>`}).join(""):'<div class="empty">조건에 맞는 쿠폰이 없습니다.</div>';const dc=coupons.filter(x=>state.completed[String(x.no)]).length;$("total").textContent=coupons.length.toLocaleString();$("done").textContent=dc.toLocaleString();$("remain").textContent=(coupons.length-dc).toLocaleString();$("shown").textContent=filtered.length.toLocaleString();$("pager").innerHTML=pages>1?`<button class="secondary" ${page===1?"disabled":""} onclick="goPage(${page-1})">이전</button><span>${page} / ${pages}</span><button class="secondary" ${page===pages?"disabled":""} onclick="goPage(${page+1})">다음</button>`:""}window.copyCoupon=no=>cp($("c-"+no).value,"쿠폰번호");window.copyCode=no=>cp($("r-"+no).value,"등록코드");window.copyBoth=no=>cp($("c-"+no).value+"\t"+$("r-"+no).value,"두 번호");window.toggleCoupon=toggle;window.goPage=p=>{page=p;render();window.scrollTo({top:0,behavior:"smooth"})};$("search").addEventListener("input",()=>apply());$("filter").addEventListener("change",()=>apply());$("pageSize").addEventListener("change",()=>apply());window.addEventListener("beforeunload",()=>localStorage.setItem(SCROLL_KEY,String(window.scrollY)));fetch(DATA_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(DATA_URL);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error("JSON 배열 형식 오류");coupons=data.map((x,i)=>({no:Number(x.no)||i+1,coupon_number:String(x.coupon_number||""),registration_code:String(x.registration_code||"")}));apply();$("status").textContent=coupons.length.toLocaleString()+"개 불러옴 · 이 휴대폰에 자동 저장";const y=Number(localStorage.getItem(SCROLL_KEY)||0);if(y>0)setTimeout(()=>scrollTo(0,y),100)}).catch(e=>{$("list").innerHTML='<div class="error"><b>coupons1.json</b>을 불러오지 못했습니다.<br>GitHub에 <b>coupon1.html</b>과 <b>coupons1.json</b>이 같은 위치에 있는지 확인하세요.</div>';$("status").textContent="JSON 불러오기 실패";console.error(e)})})();
</script>
</body></html>
