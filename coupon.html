<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠폰 복붙 도우미</title>
<!--
STARBUCKS HELPER
File: coupon.html
Version: 2.0
Updated: 2026-07-15
Data file: coupons.json
-->
<style>
:root{
  --green:#006241; --green2:#00754a; --bg:#f4f7f5; --card:#fff;
  --line:#d8e0dc; --text:#14211d; --muted:#65756f; --warn:#9a6700;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(980px,calc(100% - 20px));margin:0 auto 50px}
header{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.97);border-bottom:1px solid var(--line);padding:12px 0}
.headRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0}
.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:800}
.meta{color:var(--muted);font-size:13px;margin-top:5px}
.progress{height:10px;background:#dfe7e3;border-radius:999px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;width:0;background:var(--green)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px;font-weight:800}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px;gap:8px;margin-top:10px}
input,select,button{min-height:42px;border-radius:8px;font-size:15px}
input,select{width:100%;border:1px solid var(--line);background:#fff;padding:0 11px;color:var(--text)}
button{border:1px solid var(--green);background:var(--green);color:#fff;font-weight:900;padding:0 12px;cursor:pointer}
button.secondary{background:#fff;color:var(--text);border-color:#b9c7c1}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.toast{min-height:22px;color:var(--green);font-weight:900;margin-top:7px;font-size:13px}
.list{display:grid;gap:10px;padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.card.done{opacity:.55;background:#eef3f0}
.cardTop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
.cardTop strong{font-size:16px;color:var(--text)}
.badge{padding:4px 8px;border-radius:999px;background:#fff5d6;color:var(--warn);font-weight:900}
.card.done .badge{background:#e6ece8;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:end}
label{font-size:12px;color:var(--muted);font-weight:900}
.value{margin-top:5px;width:100%;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
.cardActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty,.error{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.error{color:#a33}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}
.pager span{font-size:13px;color:var(--muted);font-weight:800}
@media(max-width:720px){
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar input{grid-column:1/-1}
  .fields{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr 1fr}
  .actions button:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<main>
<header>
  <div class="headRow">
    <div>
      <h1>쿠폰 복붙 도우미</h1>
      <div class="meta">데이터는 <b>coupons.json</b>에서 자동으로 불러옵니다.</div>
    </div>
    <a class="home" href="index.html">🏠 홈</a>
  </div>
  <div class="progress"><span id="progressBar"></span></div>
  <div class="stats">
    <span>전체 <b id="totalCount">0</b>개</span>
    <span>완료 <b id="doneCount">0</b>개</span>
    <span>남음 <b id="remainCount">0</b>개</span>
    <span>표시 <b id="shownCount">0</b>개</span>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="번호·쿠폰번호·등록코드 검색" autocomplete="off">
    <select id="filter">
      <option value="all">전체 보기</option>
      <option value="pending">미완료만</option>
      <option value="done">완료만</option>
    </select>
    <select id="pageSize">
      <option value="50">50개씩</option>
      <option value="100" selected>100개씩</option>
      <option value="200">200개씩</option>
    </select>
  </div>
  <div class="actions">
    <button class="secondary" id="saveWork">작업 저장</button>
    <button class="secondary" id="loadWork">작업 불러오기</button>
    <button class="secondary" id="resetWork">완료 초기화</button>
  </div>
  <input id="workFile" type="file" accept=".json,application/json" hidden>
  <div class="toast" id="toast"></div>
</header>

<section class="list" id="list">
  <div class="empty">쿠폰 데이터를 불러오는 중...</div>
</section>
<div class="pager" id="pager"></div>
</main>

<script>
const DATA_URL='coupons.json';
let coupons=[];
let filtered=[];
let currentPage=1;
let state={done:new Set(), edits:{}};
let stateKey='';

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function datasetId(items){
  if(!items.length)return 'empty';
  const first=items[0], last=items[items.length-1];
  return [items.length,first.coupon_number,last.coupon_number].join('-');
}
function toast(msg){
  $('toast').textContent=msg;
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>$('toast').textContent='',1800);
}
function saveState(){
  localStorage.setItem(stateKey,JSON.stringify({done:[...state.done],edits:state.edits}));
}
function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(stateKey)||'{}');
    state={done:new Set((raw.done||[]).map(String)),edits:raw.edits||{}};
  }catch(e){state={done:new Set(),edits:{}}}
}
function keyFor(item){return String(item.no)}
function valueFor(item,key){return state.edits[keyFor(item)]?.[key] ?? item[key]}
function setEdit(no,key,value){
  state.edits[String(no)]={...(state.edits[String(no)]||{}),[key]:value};
  saveState();
}
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text)}
  catch(e){
    const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();
    document.execCommand('copy');t.remove();
  }
  toast(label+' 복사됨');
}
function toggleDone(no){
  const k=String(no);
  state.done.has(k)?state.done.delete(k):state.done.add(k);
  saveState(); applyFilters(false);
}
function applyFilters(resetPage=true){
  const q=$('search').value.trim().toLowerCase();
  const mode=$('filter').value;
  filtered=coupons.filter(item=>{
    const k=keyFor(item);
    const done=state.done.has(k);
    if(mode==='pending'&&done)return false;
    if(mode==='done'&&!done)return false;
    if(!q)return true;
    return [item.no,valueFor(item,'coupon_number'),valueFor(item,'registration_code')]
      .some(v=>String(v).toLowerCase().includes(q));
  });
  if(resetPage)currentPage=1;
  render();
}
function render(){
  const size=Number($('pageSize').value)||100;
  const pages=Math.max(1,Math.ceil(filtered.length/size));
  currentPage=Math.min(currentPage,pages);
  const start=(currentPage-1)*size;
  const pageItems=filtered.slice(start,start+size);

  $('list').innerHTML=pageItems.length?pageItems.map(item=>{
    const k=keyFor(item),done=state.done.has(k);
    const coupon=esc(valueFor(item,'coupon_number'));
    const code=esc(valueFor(item,'registration_code'));
    return `<article class="card ${done?'done':''}">
      <div class="cardTop"><strong>#${esc(item.no)}</strong><span class="badge">${done?'완료':'미완료'}</span></div>
      <div class="fields">
        <div class="field">
          <label>쿠폰번호
            <input class="value" id="coupon-${esc(item.no)}" value="${coupon}" inputmode="numeric"
              oninput="setEdit('${esc(item.no)}','coupon_number',this.value)">
          </label>
          <button onclick="copyText(document.getElementById('coupon-${esc(item.no)}').value,'쿠폰번호')">복사</button>
        </div>
        <div class="field">
          <label>등록코드
            <input class="value" id="code-${esc(item.no)}" value="${code}" inputmode="numeric"
              oninput="setEdit('${esc(item.no)}','registration_code',this.value)">
          </label>
          <button onclick="copyText(document.getElementById('code-${esc(item.no)}').value,'등록코드')">복사</button>
        </div>
      </div>
      <div class="cardActions">
        <button class="secondary" onclick="toggleDone('${esc(item.no)}')">${done?'완료 취소':'완료 처리'}</button>
        <button class="secondary" onclick="copyText(document.getElementById('coupon-${esc(item.no)}').value+'\\t'+document.getElementById('code-${esc(item.no)}').value,'두 번호')">두 번호 복사</button>
      </div>
    </article>`;
  }).join(''):'<div class="empty">조건에 맞는 쿠폰이 없습니다.</div>';

  const done=state.done.size,total=coupons.length;
  $('totalCount').textContent=total.toLocaleString('ko-KR');
  $('doneCount').textContent=done.toLocaleString('ko-KR');
  $('remainCount').textContent=Math.max(0,total-done).toLocaleString('ko-KR');
  $('shownCount').textContent=filtered.length.toLocaleString('ko-KR');
  $('progressBar').style.width=(total?done/total*100:0)+'%';

  $('pager').innerHTML=pages>1
    ? `<button class="secondary" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">이전</button>
       <span>${currentPage} / ${pages} 페이지</span>
       <button class="secondary" ${currentPage===pages?'disabled':''} onclick="goPage(${currentPage+1})">다음</button>`
    :'';
}
function goPage(p){currentPage=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function exportWork(){
  const payload={
    app:'starbucks-coupon-helper',version:2,savedAt:new Date().toISOString(),
    dataset:datasetId(coupons),total:coupons.length,
    done:[...state.done],edits:state.edits
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`쿠폰_작업저장_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);toast('작업 저장 파일 생성됨');
}
function importWork(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      state={done:new Set((p.done||[]).map(String)),edits:p.edits||{}};
      saveState();applyFilters();toast('작업 불러오기 완료');
    }catch(e){alert('작업 저장 파일을 읽지 못했습니다.')}
    $('workFile').value='';
  };
  r.readAsText(file);
}
async function init(){
  try{
    const res=await fetch(DATA_URL,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data))throw new Error('JSON 형식 오류');
    coupons=data.map((x,i)=>({
      no:Number(x.no)||i+1,
      coupon_number:String(x.coupon_number??''),
      registration_code:String(x.registration_code??'')
    }));
    stateKey='starbucks-coupon-work-'+datasetId(coupons);
    loadState();applyFilters();
  }catch(e){
    $('list').innerHTML=`<div class="error"><b>coupons.json을 불러오지 못했습니다.</b><br>
    coupon.html과 coupons.json을 GitHub의 같은 폴더에 올렸는지 확인하세요.</div>`;
  }
}
$('search').addEventListener('input',()=>applyFilters());
$('filter').addEventListener('change',()=>applyFilters());
$('pageSize').addEventListener('change',()=>applyFilters());
$('saveWork').addEventListener('click',exportWork);
$('loadWork').addEventListener('click',()=>$('workFile').click());
$('workFile').addEventListener('change',e=>importWork(e.target.files[0]));
$('resetWork').addEventListener('click',()=>{
  if(confirm('완료 표시와 수정값을 모두 초기화할까요?')){
    state={done:new Set(),edits:{}};saveState();applyFilters();toast('초기화 완료');
  }
});
init();
</script>
</body>
</html>
