function setEdit(no,key,value){state.edits[no]={...(state.edits[no]||{}),[key]:value};save();updateProgress();}
function copyText(text,label){navigator.clipboard?.writeText(text).then(()=>toast(label+' 복사됨')).catch(()=>{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(label+' 복사됨');})}
function toast(msg){el('toast').textContent=msg;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el('toast').textContent='',1800);}
function selectField(input){input.select();input.setSelectionRange(0,99999);}
function toggleDone(no){state.done.has(no)?state.done.delete(no):state.done.add(no);save();render();}
function jumpToNo(){const n=Math.max(1,Math.min(baseItems.length,Number(el('jumpNo').value)||1));document.querySelector(`[data-index="${n}"]`)?.scrollIntoView({behavior:'smooth',block:'start'});state.index=n;save();}
function updateProgress(){const done=state.done.size;el('bar').style.width=(done/baseItems.length*100)+'%';el('toast').dataset.progress=done+' / '+baseItems.length;}
function render(){
  updateProgress();
  el('cards').innerHTML=baseItems.map(item=>{
    const no=item.no;
    const coupon=itemValue(no,'coupon',item.coupon);
    const code=itemValue(no,'code',item.code);
    const done=state.done.has(no);
    return `<article class="card ${done?'done-card':''}" data-index="${no}">
      <div class="top"><strong>#${no}</strong><span>${item.file}</span><span class="status">${item.status}</span></div>
      <img class="preview" src="확인필요_이미지/${item.file}" loading="lazy" alt="${item.file}">
      <div class="grid">
        <div class="small">쿠폰자리수: ${item.couponLen || '-'} · 등록코드자리수: ${item.codeLen || '-'}</div>
        <div class="hint"><b>재추출값</b><br>쿠폰 ${item.coupon || '없음'} / 등록코드 ${item.code || '없음'}</div>
        <div class="fieldRow"><label>쿠폰번호<input class="valueInput" id="coupon-${no}" value="${coupon}" placeholder="쿠폰번호" inputmode="numeric" onclick="selectField(this)" oninput="setEdit(${no},'coupon',this.value)"></label><button onclick="copyText(document.getElementById('coupon-${no}').value,'쿠폰번호')">복사</button></div>
        <div class="fieldRow"><label>등록코드<input class="valueInput" id="code-${no}" value="${code}" placeholder="등록코드" inputmode="numeric" onclick="selectField(this)" oninput="setEdit(${no},'code',this.value)"></label><button onclick="copyText(document.getElementById('code-${no}').value,'등록코드')">복사</button></div>
        <div class="nav"><button class="secondary" onclick="document.querySelector('[data-index=\'${Math.max(1,no-1)}\']')?.scrollIntoView({behavior:'smooth'})">이전</button><button class="done" onclick="toggleDone(${no})">${done?'완료취소':'완료'}</button><button class="secondary" onclick="document.querySelector('[data-index=\'${Math.min(baseItems.length,no+1)}\']')?.scrollIntoView({behavior:'smooth'})">다음</button></div>
      </div>
    </article>`;
  }).join('');
  updateProgress();
}
function exportCsv(){
  const header=['번호','파일명','쿠폰번호','등록코드','원래상태','완료'];
  const rows=baseItems.map(item=>[item.no,item.file,itemValue(item.no,'coupon',item.coupon),itemValue(item.no,'code',item.code),item.status,state.done.has(item.no)?'완료':'미완료']);
  const csv=[header,...rows].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');
  copyText(csv,'수정 CSV');
}
function exportWork(){
  const payload={
    app:'starbucks-coupon-helper',
    version:3,
    savedAt:new Date().toISOString(),
    total:baseItems.length,
    done:[...state.done],
    edits:state.edits,
    index:state.index
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`스타벅스_쿠폰_작업저장_${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('작업 저장 파일 생성됨');
}
function importWork(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      const done=Array.isArray(payload.done)?payload.done.map(Number).filter(n=>n>=1&&n<=baseItems.length):[];
      const edits=payload.edits&&typeof payload.edits==='object'?payload.edits:{};
      state={
        done:new Set(done),
        edits,
        index:Number(payload.index)||1
      };
      save();
      render();
      toast('작업 불러오기 완료');
    }catch(e){
      alert('작업 저장 파일을 읽지 못했습니다.');
    }finally{
      el('workFile').value='';
    }
  };
  reader.readAsText(file);
}
function resetAll(){if(confirm('수정값과 완료 표시를 초기화할까요?')){state={done:new Set(),edits:{},index:1};save();render();}}
render();
</script>
