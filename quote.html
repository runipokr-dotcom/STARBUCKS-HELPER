function cellText(cell){let value=cell.value;if(value&&typeof value==="object"&&"result"in value)value=value.result;if(value&&typeof value==="object"&&Array.isArray(value.richText))value=value.richText.map(x=>x.text).join("");if(value instanceof Date)return`${value.getMonth()+1}/${value.getDate()}/${String(value.getFullYear()).slice(-2)}`;if(typeof value==="number"){const fmt=String(cell.numFmt||"");if(cell.address==="A10"){const d=new Date(Date.UTC(1899,11,30)+value*86400000);return`${d.getUTCMonth()+1}/${d.getUTCDate()}/${String(d.getUTCFullYear()).slice(-2)}`}if(fmt.includes("₩"))return"₩"+Math.round(value).toLocaleString("ko-KR");if(fmt.includes("#,##0"))return Math.round(value).toLocaleString("ko-KR")}return String(value??"")}
function cellStyle(cell,edges){const f=cell.font||{},a=cell.alignment||{},fill=cell.fill||{},b=cell.border||{},e=edges||{},style=[`font-family:${f.name||"Arial"}`,`font-size:${f.size||11}pt`,`font-weight:${f.bold?700:400}`,`font-style:${f.italic?"italic":"normal"}`,`color:${cssColor(f.color)||"#111"}`,`text-align:${a.horizontal==="centerContinuous"?"center":a.horizontal||"left"}`,`vertical-align:${a.vertical==="middle"?"middle":a.vertical||"bottom"}`,`white-space:${a.wrapText?"pre-wrap":"nowrap"}`,`border-top:${borderCss(e.top||b.top)}`,`border-right:${borderCss(e.right||b.right)}`,`border-bottom:${borderCss(e.bottom||b.bottom)}`,`border-left:${borderCss(e.left||b.left)}`];const bg=cssColor(fill.fgColor);if(bg)style.push(`background:${bg}`);return style.join(";")}
async function renderWorkbookPreview(buffer,fileName){if(!window.ExcelJS)throw new Error("원본 엑셀 미리보기 모듈을 불러오지 못했습니다.");const workbook=new ExcelJS.Workbook();await workbook.xlsx.load(buffer.slice(0));const sheet=workbook.worksheets[0];if(!sheet)throw new Error("견적서 시트를 찾지 못했습니다.");const maxRow=Math.max(28,sheet.actualRowCount),maxCol=Math.max(19,sheet.actualColumnCount),groups=new Map(),colWidths=[],rowHeights=[];for(let c=1;c<=maxCol;c++)colWidths.push(Math.max(24,Math.round((sheet.getColumn(c).width||8.43)*7)));for(let r=1;r<=maxRow;r++)rowHeights.push(Math.max(18,Math.round((sheet.getRow(r).height||15)*96/72)));for(let r=1;r<=maxRow;r++)for(let c=1;c<=maxCol;c++){const cell=sheet.getCell(r,c),master=cell.isMerged?cell.master.address:cell.address;if(!groups.has(master))groups.set(master,{minR:r,maxR:r,minC:c,maxC:c});else{const g=groups.get(master);g.minR=Math.min(g.minR,r);g.maxR=Math.max(g.maxR,r);g.minC=Math.min(g.minC,c);g.maxC=Math.max(g.maxC,c)}}let html='<div class="sheet-canvas"><table class="sheet-table"><colgroup>';for(const width of colWidths)html+=`<col style="width:${width}px">`;html+='</colgroup><tbody>';for(let r=1;r<=maxRow;r++){html+=`<tr style="height:${rowHeights[r-1]}px">`;for(let c=1;c<=maxCol;c++){const cell=sheet.getCell(r,c),master=cell.isMerged?cell.master.address:cell.address;if(cell.isMerged&&cell.address!==master)continue;const g=groups.get(master),rs=g.maxR-g.minR+1,cs=g.maxC-g.minC+1,edges={top:sheet.getCell(g.minR,g.minC).border?.top,right:sheet.getCell(g.minR,g.maxC).border?.right,bottom:sheet.getCell(g.maxR,g.minC).border?.bottom,left:sheet.getCell(g.minR,g.minC).border?.left};html+=`<td${rs>1?` rowspan="${rs}"`:""}${cs>1?` colspan="${cs}"`:""} style="${cellStyle(cell,edges)}">${xmlEscape(cellText(cell))}</td>`}html+='</tr>'}html+='</tbody></table>';const axis=(values,pos)=>{const whole=Math.floor(pos);let total=values.slice(0,whole).reduce((a,b)=>a+b,0);return total+(values[whole]||0)*(pos-whole)};for(const placed of sheet.getImages()){const image=workbook.getImage(placed.imageId),tl=placed.range.tl,br=placed.range.br;if(!image?.buffer||!tl||!br)continue;const left=axis(colWidths,tl.col),top=axis(rowHeights,tl.row),right=axis(colWidths,br.col),bottom=axis(rowHeights,br.row),bytes=image.buffer,b64=arrayBufferToB64(bytes.buffer?bytes.buffer.slice(bytes.byteOffset||0,(bytes.byteOffset||0)+bytes.byteLength):bytes);html+=`<img class="sheet-image" alt="원본 엑셀 도장" src="data:image/${image.extension||"png"};base64,${b64}" style="left:${left}px;top:${top}px;width:${Math.max(1,right-left)}px;height:${Math.max(1,bottom-top)}px">`}html+='</div>';$("#previewFile").textContent=fileName||"";$("#previewSheet").innerHTML=html;$("#preview").classList.add("show");$("#preview").scrollIntoView({behavior:"smooth",block:"start"})}
async function saveCurrent(){try{$("#message").textContent="견적서 생성 및 저장 중…";const c=calc(),made=await createWorkbook(c),payload={version:2,status:"ready",savedAt:Date.now(),recipient:c.recipient,email:c.email,quoteDate:c.quoteDate,items:c.items.filter(i=>String(i.name||"").trim()),shipping:c.shipping,paymentMethod:c.paymentMethod,cardFee:c.cardFee,totals:{supply:c.supply,vat:c.vat,cash:c.cash,card:c.card},attachments:{business:c.includeBusiness?ASSETS.business:null,bank:c.includeBank?ASSETS.bank:null},generated:{name:made.name,mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",size:made.buffer.byteLength,base64:arrayBufferToB64(made.buffer)}};await firebase.setDoc(firebase.doc(db,COLLECTION,WORK_ID),payload);lastSaved=payload;dirty=false;localStorage.setItem(LOCAL_KEY,JSON.stringify(c));$("#message").innerHTML='<span class="oktext">최신 견적서로 덮어쓰기 완료 · '+xmlEscape(made.name)+'</span>';await renderWorkbookPreview(made.buffer,made.name)}catch(e){console.error(e);$("#message").innerHTML='<span class="danger">'+xmlEscape(e.message||e)+'</span>'}}
function instruction(){if(!lastSaved||dirty)throw new Error("먼저 저장하기를 눌러 최신 견적서를 저장해 주세요.");const a=lastSaved.attachments||{},lines=(lastSaved.items||[]).map((i,n)=>`${n+1}. ${i.name} / ${i.spec||"규격 없음"} / ${i.qty}개 / 단가 ${money(i.unit)} / 비고 ${i.note||"없음"}`).join("\n");return`STARBUCKS HELPER 견적 작업을 진행해 주세요.\n\nFirestore 프로젝트: ${FIREBASE_CONFIG.projectId}\n컬렉션/현재 작업 문서: ${COLLECTION}/${WORK_ID}\n생성된 견적 파일: ${lastSaved.generated.name}\n수신인: ${lastSaved.recipient}\n수신 이메일: ${lastSaved.email||"미입력"}\n견적일: ${lastSaved.quoteDate}\n\n품목\n${lines}\n\n첨부할 서류\n- 사업자등록증: ${a.business?`${COLLECTION}/${a.business}`:"첨부 안 함"}\n- 통장사본: ${a.bank?`${COLLECTION}/${a.bank}`:"첨부 안 함"}\n\n위 Firestore 문서에서 생성된 XLSX와 선택된 서류 원본을 불러와 파일 상태와 수신 정보를 확인한 뒤, 실제 발송 전 필요한 내용이 있으면 나에게 알려 주세요.`}
async function copyInstruction(){try{await navigator.clipboard.writeText(instruction());$("#message").innerHTML='<span class="oktext">GPT 작업지시서 복사 완료</span>'}catch(e){$("#message").innerHTML='<span class="danger">'+xmlEscape(e.message||e)+'</span>'}}
async function uploadAsset(kind,file){if(!file)return;const allowed=kind==="template"?/\.xlsx$/i.test(file.name):/^image\/(jpeg|png)$/i.test(file.type);if(!allowed)throw new Error(kind==="template"?"XLSX 파일을 선택해 주세요.":"JPG 또는 PNG 파일을 선택해 주세요.");if(file.size>700000)throw new Error("파일은 700KB 이하만 등록할 수 있습니다.");const data={name:file.name,mimeType:file.type||"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",size:file.size,base64:arrayBufferToB64(await file.arrayBuffer()),updatedAt:Date.now()};await firebase.setDoc(firebase.doc(db,COLLECTION,ASSETS[kind]),data);assets[kind]=data;setStatus()}
async function init(){const draft=readLocal();$("#quoteDate").value=draft?.quoteDate||localDate();$("#recipient").value=draft?.recipient||"";$("#email").value=draft?.email||"";$("#shipping").value=Number(draft?.shipping||0);$("#paymentMethod").value=draft?.paymentMethod==="card"?"card":"cash";$("#cardFee").value=Number(draft?.cardFee??4);$("#includeBusiness").checked=!!draft?.includeBusiness;$("#includeBank").checked=!!draft?.includeBank;items=Array.isArray(draft?.items)&&draft.items.length?draft.items.slice(0,MAX_ITEMS):[itemBlank(),itemBlank(),itemBlank()];renderItems();try{const[{initializeApp},firestore]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")]);firebase=firestore;db=firebase.getFirestore(initializeApp(FIREBASE_CONFIG,"quote-helper-v2"));const refs=[firebase.doc(db,COLLECTION,CATALOG_ID),...Object.values(ASSETS).map(id=>firebase.doc(db,COLLECTION,id)),firebase.doc(db,COLLECTION,WORK_ID)],snaps=await Promise.all(refs.map(r=>firebase.getDoc(r))),catalog=snaps[0].exists()?snaps[0].data():{};products=Array.isArray(catalog?.catalogData?.products)?catalog.catalogData.products:[];$("#productOptions").innerHTML=products.map(p=>`<option value="${escapeAttr(p.name)}"></option>`).join("");assets.template=snaps[1].exists()?snaps[1].data():(catalog.quoteTemplate||null);assets.business=snaps[2].exists()?snaps[2].data():null;assets.bank=snaps[3].exists()?snaps[3].data():null;lastSaved=snaps[4].exists()?snaps[4].data():null;setStatus()}catch(e){console.error(e);$("#readyDot").className="dot err";$("#readyText").textContent="Firestore 연결 실패"}}
$("#addItem").onclick=()=>{if(items.length>=MAX_ITEMS)return;items.push(itemBlank());persist();renderItems()};for(const id of["recipient","email","quoteDate","shipping","paymentMethod","cardFee","includeBusiness","includeBank"])$("#"+id).addEventListener("input",()=>{persist();calc()});document.querySelectorAll("[data-upload]").forEach(b=>b.onclick=()=>$("#"+b.dataset.upload+"File").click());for(const kind of Object.keys(ASSETS))$("#"+kind+"File").onchange=async e=>{try{await uploadAsset(kind,e.target.files[0]);$("#message").textContent="원본 파일 등록 완료"}catch(err){$("#message").innerHTML='<span class="danger">'+xmlEscape(err.message||err)+'</span>'}};$("#saveBtn").onclick=saveCurrent;$("#copyBtn").onclick=copyInstruction;init();
</script>
