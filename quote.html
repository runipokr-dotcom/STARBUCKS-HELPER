function arrayBufferToB64(buf){let bytes=new Uint8Array(buf),out="",chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(out)}function b64ToArrayBuffer(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer}

function koreanNumber(n){n=Math.round(Number(n||0));if(!n)return"영";const nums=["","일","이","삼","사","오","육","칠","팔","구"],small=["","십","백","천"],big=["","만","억","조"];let result="",group=0;while(n>0){let part=n%10000,p="";for(let i=0;i<4;i++){const digit=part%10;if(digit)p=nums[digit]+small[i]+p;part=Math.floor(part/10)}if(p)result=p+big[group]+result;n=Math.floor(n/10000);group++}return result}
function findCell(doc,refName){const cells=[...doc.getElementsByTagNameNS("*","c")];let cell=cells.find(c=>c.getAttribute("r")===refName);if(cell)return cell;const sheetData=[...doc.getElementsByTagNameNS("*","sheetData")][0],rowNum=String(refName.match(/\d+/)[0]);let row=[...sheetData.children].find(r=>r.localName==="row"&&r.getAttribute("r")===rowNum);if(!row){row=doc.createElementNS(sheetData.namespaceURI,"row");row.setAttribute("r",rowNum);sheetData.appendChild(row)}cell=doc.createElementNS(sheetData.namespaceURI,"c");cell.setAttribute("r",refName);row.appendChild(cell);return cell}

async function createWorkbook(c){const filled=c.items.filter(i=>String(i.name||"").trim());if(!c.recipient||!c.quoteDate||!filled.length)throw new Error("수신인, 견적일, 품목을 확인해 주세요.");if(c.includeBusiness&&!assets.business)throw new Error("사업자등록증 원본을 먼저 등록해 주세요.");if(c.includeBank&&!assets.bank)throw new Error("통장사본 원본을 먼저 등록해 주세요.");const lineCount=filled.length+filled.filter(i=>i.engrave>0).length+(c.shipping>0?1:0);if(lineCount>12)throw new Error("현재 양식에는 상품·각인·배송비를 합쳐 12줄까지 넣을 수 있습니다.");const zip=await JSZip.loadAsync(b64ToArrayBuffer(assets.template.base64)),path="xl/worksheets/sheet1.xml",text=await zip.file(path).async("text"),doc=new DOMParser().parseFromString(text,"application/xml");if(doc.querySelector("parsererror"))throw new Error("견적서 원본을 읽지 못했습니다.");clearQuoteRows(doc);setInline(doc,"A2","견 적 서");setInline(doc,"A5",c.recipient+" 님");setNumber(doc,"A10",excelSerial(c.quoteDate));setInline(doc,"F11",koreanNumber(c.cash)+" 원");setNumber(doc,"N11",c.cash);setNumber(doc,"A13",excelSerial(c.quoteDate));let row=14,totalSupply=0,totalVat=0;const addLine=(name,spec,qty,unit)=>{const gross=qty*unit,supply=gross/1.1,vat=gross-supply;setInline(doc,"B"+row,name);setInline(doc,"F"+row,spec);setNumber(doc,"H"+row,qty);setNumber(doc,"I"+row,unit);setFormula(doc,"K"+row,`I${row}*H${row}/1.1`,supply);setFormula(doc,"O"+row,`I${row}*H${row}-K${row}`,vat);totalSupply+=supply;totalVat+=vat;row++};for(const i of filled){addLine(i.name,i.spec,i.qty,i.unit);if(i.engrave>0)addLine("레이저 각인","",i.qty,i.engrave)}if(c.shipping>0)addLine("배송비","",1,c.shipping);setInline(doc,"R14","현금 "+money(c.cash));setInline(doc,"R15","카드 "+money(c.card)+` (${c.cardFee}% 포함)`);setFormula(doc,"K28","SUM(K13:N27)",totalSupply);setFormula(doc,"O28","SUM(O13:Q27)",totalVat);zip.file(path,new XMLSerializer().serializeToString(doc));const out=await zip.generateAsync({type:"arraybuffer",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});return{buffer:out,name:`스타벅스 대량구매 견적서 - ${c function renderPreview(c,fileName){const rows=[];for(const i of(c.items||[]).filter(i=>String(i.name||"").trim())){rows.push({name:i.name,spec:i.spec||"",qty:Number(i.qty)||0,unit:Number(i.unit)||0});if(Number(i.engrave)>0)rows.push({name:"레이저 각인",spec:"",qty:Number(i.qty)||0,unit:Number(i.engrave)||0})}if(Number(c.shipping)>0)rows.push({name:"배송비",spec:"",qty:1,unit:Number(c.shipping)});const totals=c.totals||c,attachments=c.attachments||{};$("#previewFile").textContent=fileName||"";$("#previewSheet").innerHTML=`<div class="sheet-title">견 적 서</div><div class="sheet-meta"><div><b>수신:</b> ${xmlEscape(c.recipient)} 님</div><div><b>견적일:</b> ${xmlEscape(c.quoteDate)}</div><div><b>이메일:</b> ${xmlEscape(c.email||"미입력")}</div><div><b>첨부:</b> ${[attachments.business&&"사업자등록증",attachments.bank&&"통장사본"].filter(Boolean).join(", ")||"없음"}</div></div><table><thead><tr><th>품목</th><th>규격</th><th>수량</th><th>단가</th><th>금액</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${xmlEscape(r.name)}</td><td>${xmlEscape(r.spec)}</td><td>${r.qty.toLocaleString("ko-KR")}</td><td>${money(r.unit)}</td><td>${money(r.qty*r.unit)}</td></tr>`).join("")}</tbody></table><div class="sheet-summary"><div><span>공급가액</span><b>${money(totals.supply)}</b></div><div><span>부가가치세</span><b>${money(totals.vat)}</b></div><div><span>현금 결제</span><b>${money(totals.cash)}</b></div><div><span>카드 결제</span><b>${money(totals.card)}</b></div></div>`;$("#preview").classList.add("show");$("#preview").scrollIntoView({behavior:"smooth",block:"start"})}
async function saveCurrent(){try{$("#message").textContent="견적서 생성 및 저장 중…";const c=calc(),made=await createWorkbook(c),payload={version:2,status:"ready",savedAt:Date.now(),recipient:c.recipient,email:c.email,quoteDate:c.quoteDate,items:c.items.filter(i=>String(i.name||"").trim()),shipping:c.shipping,cardFee:c.cardFee,totals:{supply:c.supply,vat:c.vat,cash:c.cash,card:c.card},attachments:{business:c.includeBusiness?ASSETS.business:null,bank:c.includeBank?ASSETS.bank:null},generated:{name:made.name,mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",size:made.buffer.byteLength,base64:arrayBufferToB64(made.buffer)}};await firebase.setDoc(firebase.doc(db,COLLECTION,WORK_ID),payload);lastSaved=payload;dirty=false;localStorage.setItem(LOCAL_KEY,JSON.stringify(c));$("#message").innerHTML='<span class="oktext">최신 견적서로 덮어쓰기 완료 · '+xmlEscape(made.name)+'</span>';renderPreview(payload,made.name)}catch(e){console.error(e);$("#message").innerHTML='<span class="danger">'+xmlEscape(e.message||e)+'</span>'}}
function instruction(){if(!lastSaved||dirty)throw new Error("먼저 저장하기를 눌러 최신 견적서를 저장해 주세요.");const a=lastSaved.attachments||{},lines=(lastSaved.items||[]).map((i,n)=>`${n+1}. ${i.name} / ${i.spec||"규격 없음"} / ${i.qty}개 / 상품 단가 ${money(i.unit)} / 각인 단가 ${money(i.engrave)}`).join("\n");return`STARBUCKS HELPER 견적 작업을 진행해 주세요.\n\nFirestore 프로젝트: ${FIREBASE_CONFIG.projectId}\n컬렉션/현재 작업 문서: ${COLLECTION}/${WORK_ID}\n생성된 견적 파일: ${lastSaved.generated.name}\n수신인: ${lastSaved.recipient}\n수신 이메일: ${lastSaved.email||"미입력"}\n견적일: ${lastSaved.quoteDate}\n\n품목\n${lines}\n\n첨부할 서류\n- 사업자등록증: ${a.business?`${COLLECTION}/${a.business}`:"첨부 안 함"}\n- 통장사본: ${a.bank?`${COLLECTION}/${a.bank}`:"첨부 안 함"}\n\n위 Firestore 문서에서 생성된 XLSX와 선택된 서류 원본을 불러와 파일 상태와 수신 정보를 확인한 뒤, 실제 발송 전 필요한 내용이 있으면 나에게 알려 주세요.`}
async function copyInstruction(){try{await navigator.clipboard.writeText(instruction());$("#message").innerHTML='<span class="oktext">GPT 작업지시서 복사 완료</span>'}catch(e){$("#message").innerHTML='<span class="danger">'+xmlEscape(e.message||e)+'</span>'}}
async function uploadAsset(kind,file){if(!file)return;const allowed=kind==="template"?/\.xlsx$/i.test(file.name):/^image\/(jpeg|png)$/i.test(file.type);if(!allowed)throw new Error(kind==="template"?"XLSX 파일을 선택해 주세요.":"JPG 또는 PNG 파일을 선택해 주세요.");if(file.size>700000)throw new Error("파일은 700KB 이하만 등록할 수 있습니다.");const data={name:file.name,mimeType:file.type||"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",size:file.size,base64:arrayBufferToB64(await file.arrayBuffer()),updatedAt:Date.now()};await firebase.setDoc(firebase.doc(db,COLLECTION,ASSETS[kind]),data);assets[kind]=data;setStatus()}
async function init(){const draft=readLocal();$("#quoteDate").value=draft?.quoteDate||localDate();$("#recipient").value=draft?.recipient||"";$("#email").value=draft?.email||"";$("#shipping").value=Number(draft?.shipping||0);$("#cardFee").value=Number(draft?.cardFee??4);$("#includeBusiness").checked=!!draft?.includeBusiness;$("#includeBank").checked=!!draft?.includeBank;items=Array.isArray(draft?.items)&&draft.items.length?draft.items.slice(0,MAX_ITEMS):[itemBlank(),itemBlank(),itemBlank()];renderItems();try{const[{initializeApp},firestore]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")]);firebase=firestore;db=firebase.getFirestore(initializeApp(FIREBASE_CONFIG,"quote-helper-v2"));const refs=[firebase.doc(db,COLLECTION,CATALOG_ID),...Object.values(ASSETS).map(id=>firebase.doc(db,COLLECTION,id)),firebase.doc(db,COLLECTION,WORK_ID)],snaps=await Promise.all(refs.map(r=>firebase.getDoc(r))),catalog=snaps[0].exists()?snaps[0].data():{};products=Array.isArray(catalog?.catalogData?.products)?catalog.catalogData.products:[];$("#productOptions").innerHTML=products.map(p=>`<option value="${escapeAttr(p.name)}"></option>`).join("");assets.template=snaps[1].exists()?snaps[1].data():(catalog.quoteTemplate||null);assets.business=snaps[2].exists()?snaps[2].data():null;assets.bank=snaps[3].exists()?snaps[3].data():null;lastSaved=snaps[4].exists()?snaps[4].data():null;setStatus()}catch(e){console.error(e);$("#readyDot").className="dot err";$("#readyText").textContent="Firestore 연결 실패"}}
$("#addItem").onclick=()=>{if(items.length>=MAX_ITEMS)return;items.push(itemBlank());persist();renderItems()};for(const id of["recipient","email","quoteDate","shipping","cardFee","includeBusiness","includeBank"])$("#"+id).addEventListener("input",()=>{persist();calc()});document.querySelectorAll("[data-upload]").forEach(b=>b.onclick=()=>$("#"+b.dataset.upload+"File").click());for(const kind of Object.keys(ASSETS))$("#"+kind+"File").onchange=async e=>{try{await uploadAsset(kind,e.target.files[0]);$("#message").textContent="원본 파일 등록 완료"}catch(err){$("#message").innerHTML='<span class="danger">'+xmlEscape(err.message||err)+'</span>'}};$("#saveBtn").onclick=saveCurrent;$("#copyBtn").onclick=copyInstruction;init();
</script>
</body>
