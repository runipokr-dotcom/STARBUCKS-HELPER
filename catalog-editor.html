<!--
STARBUCKS HELPER
File : catalog-editor.html
Version : 1.1
Updated : 2026-09-03
Added : Musinsa OneLink support through local helper / clearer mobile errors
Fixed : mobile two-column cards / autosave after product edits
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>웹 카탈로그 편집 | STARBUCKS HELPER</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        font-family: Pretendard, sans-serif;
        --g: #00754a;
        --d: #063c2d;
        --bg: #f3f5f3;
        --line: #dfe5e1;
        --mut: #6a766f;
        --ink: #18201c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      button,
      input,
      select {
        font: inherit;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      header a {
        color: var(--d);
        text-decoration: none;
        font-weight: 800;
      }
      .actions {
        display: flex;
        gap: 7px;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        background: #fff;
        color: var(--ink);
        font-weight: 750;
        cursor: pointer;
      }
      .btn.primary {
        border-color: var(--g);
        background: var(--g);
        color: #fff;
      }
      .wrap {
        width: min(1500px, 100%);
        margin: auto;
        padding: 18px;
      }
      .import,
      .settings,
      .category,
      .basket {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .import {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 9px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .import input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px;
      }
      .import small {
        grid-column: 1/-1;
        color: var(--mut);
      }
      .settings {
        position: relative;
        padding: 14px 50px 14px 14px;
        margin-bottom: 16px;
      }
      .settings.collapsed .setting-grid {
        display: none;
      }
      .setting-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .setting-grid label {
        font-size: 12px;
        color: var(--mut);
      }
      .setting-grid input {
        width: 100%;
      }
      .fold {
        position: absolute;
        right: 9px;
        top: 9px;
        width: 32px;
        height: 32px;
        padding: 0;
      }
      .category {
        padding: 16px;
        margin-bottom: 150px;
      }
      .cat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .cat-head h1 {
        font-size: 23px;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      .product {
        min-width: 0;
        padding: 9px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: #fff;
      }
      .product:has(.pick:checked) {
        border-color: var(--g);
        background: #f2faf6;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 7px;
        color: var(--mut);
        font-size: 12px;
      }
      .drag {
        cursor: grab;
      }
      .photo {
        aspect-ratio: 5/6;
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f7f7f5;
        border-radius: 10px;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 27px;
        height: 27px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.82);
        cursor: pointer;
      }
      .prev {
        left: 3px;
      }
      .next {
        right: 3px;
      }
      .count {
        position: absolute;
        right: 5px;
        bottom: 4px;
        padding: 2px 4px;
        background: rgba(255, 255, 255, 0.76);
        font-size: 9px;
      }
      .field {
        width: 100%;
        margin-top: 5px;
        padding: 5px 1px;
        border: 0;
        border-bottom: 1px dashed var(--line);
        background: transparent;
      }
      .name {
        font-size: var(--name, 16px);
        font-weight: 750;
      }
      .sale {
        font-size: var(--sale, 13px);
        color: var(--mut);
      }
      .cost {
        font-size: 11px;
        color: #b5522e;
      }
      .offer {
        font-size: var(--offer, 14px);
        font-weight: 800;
      }
      .web-price {
        margin-top: 3px;
        font-size: 10px;
        color: #d0392c;
      }
      .row-actions {
        display: flex;
        gap: 4px;
        margin-top: 7px;
      }
      .mini {
        padding: 5px 7px;
        font-size: 10px;
      }
      .add {
        display: grid;
        place-items: center;
        min-height: 240px;
        border: 1px dashed var(--line);
        border-radius: 13px;
      }
      .basket {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(920px, calc(100% - 24px));
        padding: 12px 14px;
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.18);
      }
      .basket-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .basket-body {
        max-height: 190px;
        overflow: auto;
      }
      .basket.closed .basket-body,
      .basket.closed .basket-foot {
        display: none;
      }
      .basket-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .qty button {
        width: 28px;
        height: 28px;
        padding: 0;
      }
      .basket-foot {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .notice {
        position: fixed;
        right: 16px;
        top: 70px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--d);
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
      }
      .notice.show {
        opacity: 1;
      }
      @media (max-width: 1050px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        header {
          align-items: flex-start;
        }
        .wrap {
          padding: 10px;
        }
        .import {
          grid-template-columns: 1fr;
        }
        .import small {
          grid-column: auto;
        }
        .setting-grid {
          grid-template-columns: 1fr;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }
        .product {
          padding: 4px;
        }
        .name {
          font-size: 13px;
        }
        .sale,
        .offer {
          font-size: 11px;
        }
        .row-actions {
          display: none;
        }
        .arrow {
          width: 24px;
          height: 24px;
        }
        .basket-row {
          grid-template-columns: 1fr auto;
        }
        .basket-row > strong {
          grid-column: 1/-1;
          text-align: right;
        }
      }
      .actions {
        position: relative;
      }
      .settings {
        position: fixed;
        z-index: 60;
        top: 62px;
        right: 112px;
        width: 230px;
        margin: 0;
        padding: 13px;
        border-radius: 13px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.14);
      }
      .settings[hidden] {
        display: none;
      }
      .settings .setting-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .settings .fold {
        display: none;
      }
      .tag-settings {
        right: 262px;
      }
      .category-settings {
        right: 412px;
      }
      .policy-settings {
        right: 562px;
        width: 300px;
      }
      .policy-cats {
        margin: 10px 0;
      }
      .policy-grid {
        grid-template-columns: 1fr 1fr;
      }
      .policy-grid label {
        display: block;
      }
      .policy-grid input {
        margin-top: 4px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      #policyApply {
        width: 100%;
        margin-top: 12px;
      }
      .tag-manager-add {
        display: flex;
        gap: 5px;
      }
      .tag-manager-add input {
        min-width: 0;
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .tag-manager-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
      }
      .managed-tag {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 10px;
      }
      .managed-tag button {
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }
      @media (max-width: 720px) {
        .settings {
          top: 58px;
          right: 96px;
          width: 210px;
        }
        .tag-settings,
        .category-settings,
        .policy-settings {
          right: 12px;
          width: calc(100% - 24px);
        }
        .policy-grid {
          grid-template-columns: 1fr;
        }
        .row-actions {
          display: flex;
        }
        .row-actions .mini {
          flex: 1;
          padding: 5px 2px;
          font-size: 9px;
        }
      }
      .filters {
        position: relative;
        margin-bottom: 16px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .filter-line {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 9px;
      }
      .filter-line b {
        flex: 0 0 48px;
        padding-top: 7px;
        font-size: 12px;
      }
      .filter-buttons,
      .selection-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .filter-btn {
        padding: 7px 10px;
        font-size: 11px;
      }
      .filter-btn.active {
        border-color: var(--g);
        background: #e8f5ee;
        color: var(--g);
      }
      .selection-tools {
        align-items: center;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .selection-count {
        margin-left: auto;
        color: var(--mut);
        font-size: 12px;
      }
      .category-select,
      .tag-input {
        width: 100%;
        margin-top: 5px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 10px;
      }
      .tag-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 5px;
      }
      .tag-chip {
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        font-size: 9px;
        cursor: pointer;
      }
      .tag-chip.active {
        border-color: var(--g);
        background: #e8f5ee;
        color: var(--g);
      }
      .empty-result {
        grid-column: 1/-1;
        padding: 50px;
        text-align: center;
        color: var(--mut);
      }
      .image-modal[hidden] {
        display: none;
      }
      .image-modal {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.48);
      }
      .image-dialog {
        width: min(720px, 100%);
        max-height: 90vh;
        overflow: auto;
        padding: 18px;
        background: #fff;
        border-radius: 18px;
      }
      .image-dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .image-dialog-head h2 {
        margin: 0;
        font-size: 18px;
      }
      .image-slots {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 9px;
        margin: 16px 0;
      }
      .image-slot {
        position: relative;
        min-width: 0;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fafafa;
      }
      .image-slot.main {
        border: 2px solid var(--g);
      }
      .image-slot img {
        display: block;
        width: 100%;
        aspect-ratio: 5/6;
        object-fit: contain;
        background: #fff;
      }
      .image-slot-tools {
        display: flex;
        justify-content: center;
        gap: 3px;
        margin-top: 5px;
      }
      .image-slot-tools button {
        padding: 5px;
        font-size: 9px;
      }
      .image-drop {
        display: grid;
        place-items: center;
        min-height: 110px;
        padding: 15px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        color: var(--mut);
        text-align: center;
        cursor: pointer;
      }
      .image-drop.dragging {
        border-color: var(--g);
        background: #eef8f2;
      }
      .image-drop input {
        display: none;
      }
      .image-dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      @media (max-width: 600px) {
        .image-slots {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html">← STARBUCKS HELPER</a>
      <div class="actions">
        <button
          class="btn"
          id="fontToggle"
          type="button"
          aria-expanded="false"
          aria-controls="fontSettings"
        >
          폰트</button
        ><button
          class="btn"
          id="categoryManageToggle"
          type="button"
          aria-expanded="false"
          aria-controls="categorySettings"
        >
          대분류</button
        ><button
          class="btn"
          id="tagManageToggle"
          type="button"
          aria-expanded="false"
          aria-controls="tagSettings"
        >
          소분류</button
        ><button
          class="btn"
          id="policyManageToggle"
          type="button"
          aria-expanded="false"
          aria-controls="policySettings"
        >
          정책</button
        ><a class="btn" href="catalog-preview.html" target="_blank">미리보기</a
        ><button class="btn primary" id="save">저장</button>
      </div>
    </header>
    <main class="wrap">
      <section class="import">
        <input
          id="url"
          type="url"
          inputmode="url"
          autocapitalize="off"
          autocomplete="off"
          placeholder="스타벅스 공식 또는 무신사 상품/공유 링크"
        /><button class="btn primary" id="import">다운로드＋상품 추가</button
        ><small
          >무신사 앱의 onelink.me 공유링크도 지원합니다. 다운로드 저장은
          추출기가 설치된 컴퓨터에서 실행하세요.</small
        >
      </section>
      <section class="filters">
        <div class="filter-line">
          <b>대분류</b>
          <div class="filter-buttons" id="categoryFilters"></div>
        </div>
        <div class="filter-line">
          <b>소분류</b>
          <div class="filter-buttons" id="tagFilters"></div>
        </div>
        <div class="filter-line">
          <b>정렬</b>
          <div class="filter-buttons" id="sortButtons">
            <button class="btn filter-btn" type="button" data-sort="price">
              가격높은순
            </button>
            <button class="btn filter-btn" type="button" data-sort="added">
              최근추가순
            </button>
            <button class="btn filter-btn" type="button" data-sort="updated">
              최근수정순
            </button>
          </div>
        </div>
        <div class="selection-tools">
          <button class="btn filter-btn" id="selectVisible">전체 선택</button
          ><button class="btn filter-btn" id="clearVisible">
            전체 선택 해제</button
          ><span class="selection-count" id="filterCount"></span>
        </div>
      </section>
      <section class="settings" id="fontSettings" hidden>
        <button class="btn fold" id="fold" aria-label="글자 설정 접기">
          ⌃
        </button>
        <div class="setting-grid">
          <label
            >상품명 크기 <output id="nv">16px</output
            ><input id="ns" type="range" min="11" max="22" value="16" /></label
          ><label
            >판매가 크기 <output id="sv">13px</output
            ><input id="ss" type="range" min="10" max="20" value="13" /></label
          ><label
            >제안가 크기 <output id="ov">14px</output
            ><input id="os" type="range" min="10" max="22" value="14"
          /></label>
        </div>
      </section>
      <section class="settings tag-settings" id="tagSettings" hidden>
        <div class="tag-manager-add">
          <input id="newTag" placeholder="새 소분류" /><button
            class="btn primary"
            id="addTag"
            type="button"
          >
            추가
          </button>
        </div>
        <div class="tag-manager-list" id="tagManagerList"></div>
      </section>
      <section class="settings category-settings" id="categorySettings" hidden>
        <div class="tag-manager-add">
          <input id="newCategory" placeholder="새 대분류" /><button
            class="btn primary"
            id="addCategory"
            type="button"
          >
            추가
          </button>
        </div>
        <div class="tag-manager-list" id="categoryManagerList"></div>
      </section>
      <section class="settings policy-settings" id="policySettings" hidden>
        <small style="color:var(--mut);">
          클릭된 대분류만 텀블러쿠폰이 적용됩니다.
        </small>
        <div class="filter-buttons policy-cats" id="policyCats"></div>
        <div class="setting-grid policy-grid">
          <label
            >할인권(%)
            <input id="policyDiscount" type="text" inputmode="decimal"
          /></label>
          <label
            >별쿠폰(원)
            <input id="policyStar" type="text" inputmode="decimal"
          /></label>
          <label
            >텀블러쿠폰(원)
            <input id="policyTumbler" type="text" inputmode="decimal"
          /></label>
          <label
            >마진 (예: 11% 또는 5000)
            <input id="policyMargin" type="text"
          /></label>
          <label
            >웹마진 (예: 5% 또는 500)
            <input id="policyWebMargin" type="text"
          /></label>
          <label
            >수수료(%)
            <input id="policyWebFee" type="text" inputmode="decimal"
          /></label>
        </div>
        <button class="btn primary" id="policyApply" type="button">
          전체 상품에 적용
        </button>
      </section>
      <section class="category">
        <div class="cat-head">
          <h1 contenteditable="true">텀블러 · MD</h1>
          <button class="btn" id="add">＋ 상품 추가</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </main>
    <section class="image-modal" id="imageModal" hidden>
      <div
        class="image-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="imageDialogTitle"
      >
        <div class="image-dialog-head">
          <h2 id="imageDialogTitle">상품 이미지 관리</h2>
          <button class="btn" id="imageClose" aria-label="닫기">✕</button>
        </div>
        <div class="image-slots" id="imageSlots"></div>
        <label class="image-drop" id="imageDrop"
          ><span
            ><b>이미지 1~5장 추가</b><br /><small
              >클릭해서 선택하거나 여기에 끌어놓으세요.</small
            ></span
          ><input id="manualImages" type="file" accept="image/*" multiple
        /></label>
        <div class="image-dialog-foot">
          <button class="btn" id="imageCancel">닫기</button
          ><button class="btn primary" id="imageApply">적용</button>
        </div>
      </div>
    </section>
    <aside class="basket closed" id="basket">
      <div class="basket-head">
        <b id="summary">선택 상품 0개 · 합계 0원</b
        ><button class="btn mini" id="basketFold">펼치기⌃</button>
      </div>
      <div class="basket-body" id="basketRows"></div>
      <div class="basket-foot">
        <span id="shareStatus">고객 링크: 저장하면 자동 발행됩니다</span
        ><button class="btn primary" id="quote">고객 링크 복사</button>
      </div>
    </aside>
    <div class="notice" id="notice"></div>
    <script>
      const KEY = "starbucks-helper-web-catalog-v1";
      const DEFAULT_CATEGORIES = [

        } finally {
          $("#imageDrop span").innerHTML =
            "<b>이미지 1~5장 추가</b><br><small>클릭해서 선택하거나 여기에 끌어놓으세요.</small>";
        }
      }
      function add() {
        data.products.push({
          id: Date.now(),
          updatedAt: Date.now(),
          name: "새 상품",
          sale: 0,
          cost: 0,
          offer: 0,
          images: [],
          remoteImages: [],
          current: 0,
          qty: 1,
          selected: false,
          source: "직접",
          category:
            activeCategory === "전체"
              ? data.categories[0] || ""
              : activeCategory,
          tags: activeTag === "전체" ? [] : [activeTag],
        });
        autosave();
        render();
      }
      function basket() {
        let selected = data.products.filter((p) => p.selected),
          total = selected.reduce((s, p) => s + p.offer * p.qty, 0);
        $("#summary").textContent =
          `선택 상품 ${selected.length}개 · 합계 ${money(total)}`;
        $("#basketRows").innerHTML =
          selected
            .map(
              (p) =>
                `<div class="basket-row" data-id="${p.id}"><span>${esc(p.name)}<small> · ${money(p.offer)}</small></span><span class="qty"><button class="btn minus">−</button><b>${p.qty}개</b><button class="btn plus">＋</button></span><strong>${money(p.offer * p.qty)}</strong></div>`,
            )
            .join("") || "<p>상품 체크박스를 선택하세요.</p>";
        document.querySelectorAll(".basket-row").forEach((r) => {
          let p = data.products.find((x) => x.id == r.dataset.id);
          r.querySelector(".minus").onclick = () => {
            p.qty = Math.max(1, p.qty - 1);
            autosave();
            basket();
          };
          r.querySelector(".plus").onclick = () => {
            p.qty++;
            autosave();
            basket();
          };
        });
      }
      $("#imageClose").onclick = $("#imageCancel").onclick = closeImageManager;
      $("#imageApply").onclick = () => {
        if (imageEditIndex < 0) return;
        data.products[imageEditIndex].images = [...imageDraft];
        data.products[imageEditIndex].current = 0;
        touch(data.products[imageEditIndex]);
        autosave();
        closeImageManager();
        render();
        toast("상품 이미지를 적용했습니다");
      };
      $("#manualImages").onchange = (e) => addManualFiles(e.target.files);
      ["dragenter", "dragover"].forEach((type) =>
        $("#imageDrop").addEventListener(type, (e) => {
          e.preventDefault();
          $("#imageDrop").classList.add("dragging");
        }),
      );
      ["dragleave", "drop"].forEach((type) =>
        $("#imageDrop").addEventListener(type, (e) => {
          e.preventDefault();
          $("#imageDrop").classList.remove("dragging");
        }),
      );
      $("#imageDrop").addEventListener("drop", (e) =>
        addManualFiles(e.dataTransfer.files),
      );
      $("#imageModal").onclick = (e) => {
        if (e.target === $("#imageModal")) closeImageManager();
      };
      $(".cat-head h1").onblur = autosave;
      ["name", "sale", "offer"].forEach((k, i) => {
        let input = $(["#ns", "#ss", "#os"][i]),
          out = $(["#nv", "#sv", "#ov"][i]);
        input.value = data.sizes[k];
        out.value = data.sizes[k] + "px";
        input.oninput = () => {
          data.sizes[k] = +input.value;
          out.value = input.value + "px";
          autosave();
          render();
        };
      });
      async function extractFromHelper(url) {
        let lastNetworkError;
        for (const port of [17833, 17832]) {
          let response;
          try {
            response = await fetch(`http://127.0.0.1:${port}/extract`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url }),
            });
          } catch (error) {
            lastNetworkError = error;
            continue;
          }
          let result;
          try {
            result = await response.json();
          } catch {
            throw new Error("로컬 추출기의 응답을 읽을 수 없습니다");
          }
          if (!response.ok || !result.ok)
            throw new Error(result.error || "상품을 가져오지 못했습니다");
          if (!result.imageUrls?.length)
            throw new Error(
              "실행 중인 추출기가 구버전입니다. 설치 파일을 다시 실행해주세요",
            );
          return result;
        }
        throw (
          lastNetworkError || new Error("로컬 MD 추출기를 찾을 수 없습니다")
        );
      }
      const PANELS = [
        { toggle: "#fontToggle", panel: "#fontSettings" },
        { toggle: "#tagManageToggle", panel: "#tagSettings" },
        { toggle: "#categoryManageToggle", panel: "#categorySettings" },
        { toggle: "#policyManageToggle", panel: "#policySettings" },
      ];
      function closeAllPanels() {
        PANELS.forEach(({ toggle, panel }) => {
          $(panel).hidden = true;
          $(toggle).setAttribute("aria-expanded", "false");
        });
      }
      function openPanel(toggleSel, panelSel, onOpen) {
        $(toggleSel).onclick = (e) => {
          e.stopPropagation();
          let panel = $(panelSel),
            open = panel.hidden;
          closeAllPanels();
          panel.hidden = !open;
          $(toggleSel).setAttribute("aria-expanded", String(open));
          if (open && onOpen) onOpen();
        };
        $(panelSel).onclick = (e) => e.stopPropagation();
      }
      openPanel("#fontToggle", "#fontSettings");
      openPanel("#tagManageToggle", "#tagSettings", () => {
        renderTagManager();
        setTimeout(() => $("#newTag").focus(), 0);
      });
      openPanel("#categoryManageToggle", "#categorySettings", () => {
        renderCategoryManager();
        setTimeout(() => $("#newCategory").focus(), 0);
      });
      openPanel("#policyManageToggle", "#policySettings", () => {
        renderPolicyCats();
        loadPolicyInputs();
      });
      document.addEventListener("click", closeAllPanels);
      $("#addTag").onclick = () => {
        let tag = $("#newTag").value.trim();
        if (!tag) return toast("소분류 이름을 입력해주세요");
        if (tagOptions().includes(tag)) return toast("이미 있는 소분류입니다");
        data.tagOptions.push(tag);
        $("#newTag").value = "";
        autosave();
        renderTagManager();
        render();
      };
      $("#newTag").onkeydown = (e) => {
        if (e.key === "Enter") $("#addTag").click();
      };
      renderTagManager();
      $("#addCategory").onclick = () => {
        let cat = $("#newCategory").value.trim();
        if (!cat) return toast("대분류 이름을 입력해주세요");
        if (data.categories.includes(cat)) return toast("이미 있는 대분류입니다");
        data.categories.push(cat);
        $("#newCategory").value = "";
        autosave();
        renderCategoryManager();
        renderPolicyCats();
        render();
      };
      $("#newCategory").onkeydown = (e) => {
        if (e.key === "Enter") $("#addCategory").click();
      };
      [
        "policyDiscount",
        "policyStar",
        "policyTumbler",
        "policyMargin",
        "policyWebMargin",
        "policyWebFee",
      ].forEach((id) => {
        $("#" + id).onchange = () => {
          let key = {
            policyDiscount: "discount",
            policyStar: "star",
            policyTumbler: "tumbler",
            policyMargin: "margin",
            policyWebMargin: "webMargin",
            policyWebFee: "webFee",
          }[id];
          data.policy[key] = $("#" + id).value.trim();
          autosave();
          render();
        };
      });
      $("#policyApply").onclick = () => {
        data.products.forEach((p) => {
          p.cost = calcCost(p.sale, p.category);
          p.offer = calcOffer(p.cost);
          p.updatedAt = Date.now();
        });
        autosave();
        render();
        toast("전체 상품에 정책을 적용했습니다");
      };
      document.querySelectorAll("[data-sort]").forEach(
        (button) => (button.onclick = () => sortProducts(button.dataset.sort)),
      );
      $("#fold").onclick = () => {};
      $("#basketFold").onclick = () => {
        let c = $("#basket").classList.toggle("closed");
        $("#basketFold").textContent = c ? "펼치기⌃" : "접기⌄";
      };
      $("#selectVisible").onclick = () => {
        visible().forEach(({ p }) => (p.selected = true));
        render();
      };
      $("#clearVisible").onclick = () => {
        visible().forEach(({ p }) => (p.selected = false));
        render();
      };
      $("#save").onclick = save;
      $("#add").onclick = add;
      $("#quote").onclick = copyShareLink;
      $("#import").onclick = async () => {
        let u = $("#url").value.trim(),
          button = $("#import");
        if (!u) return toast("상품 링크를 입력해주세요");
        button.disabled = true;
        button.textContent = "다운로드 중…";
        try {
          let result = await extractFromHelper(u);
          let category =
              activeCategory === "전체"
                ? data.categories[0] || ""
                : activeCategory,
            sale = Number(result.price || 0),
            cost = calcCost(sale, category),
            offer = calcOffer(cost);
          data.products.push({
            id: Date.now(),
            updatedAt: Date.now(),
            name: cleanProductName(result.productName),
            sale,
            cost,
            offer,
            images: (
              result.mediaUrls?.length ? result.mediaUrls : result.imageUrls || []
            ).slice(0, 5),
            remoteImages: (result.imageUrls || []).slice(0, 5),
            current: 0,
            qty: 1,
            selected: false,
            source: result.source === "musinsa" ? "무신사" : "스타벅스 공식",
            downloadFolder: result.folder,
            category,
            tags: activeTag === "전체" ? [] : [activeTag],
          });
          autosave();
          render();
          toast(`이미지 ${result.imageCount}장 다운로드＋상품 추가 완료`);
        } catch (error) {
          const helperUnavailable =
            error instanceof TypeError ||
            /fetch|찾을 수 없습니다/i.test(error.message);
          const mobile = /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent,
          );
          toast(
            helperUnavailable
              ? mobile
                ? "휴대폰에서는 컴퓨터의 로컬 추출기에 연결할 수 없습니다. 컴퓨터에서 실행해주세요"
                : "로컬 MD 추출기를 먼저 실행해주세요"
              : error.message,
          );
        } finally {
          button.disabled = false;
          button.textContent = "다운로드＋상품 추가";
        }
      };
      render();
    </script>
  </body>
</html>
