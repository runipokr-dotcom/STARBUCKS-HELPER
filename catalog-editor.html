<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹 카탈로그 편집 | STARBUCKS HELPER</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>
:root{font-family:Pretendard,sans-serif;--g:#00754a;--d:#063c2d;--bg:#f3f5f3;--line:#dfe5e1;--mut:#6a766f;--ink:#18201c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;background:#fff;border-bottom:1px solid var(--line)}header a{color:var(--d);text-decoration:none;font-weight:800}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);font-weight:750;cursor:pointer}.btn.primary{border-color:var(--g);background:var(--g);color:#fff}.wrap{width:min(1500px,100%);margin:auto;padding:18px}.import,.settings,.category,.basket{background:#fff;border:1px solid var(--line);border-radius:16px}.import{display:grid;grid-template-columns:1fr auto;gap:9px;padding:14px;margin-bottom:12px}.import input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px}.import small{grid-column:1/-1;color:var(--mut)}.settings{position:relative;padding:14px 50px 14px 14px;margin-bottom:16px}.settings.collapsed .setting-grid{display:none}.setting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.setting-grid label{font-size:12px;color:var(--mut)}.setting-grid input{width:100%}.fold{position:absolute;right:9px;top:9px;width:32px;height:32px;padding:0}.category{padding:16px;margin-bottom:150px}.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cat-head h1{font-size:23px;margin:0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.product{min-width:0;padding:9px;border:1px solid transparent;border-radius:13px;background:#fff}.product:has(.pick:checked){border-color:var(--g);background:#f2faf6}.meta{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:var(--mut);font-size:12px}.drag{cursor:grab}.photo{aspect-ratio:5/6;position:relative;display:grid;place-items:center;overflow:hidden;background:#f7f7f5;border-radius:10px}.photo img{width:100%;height:100%;object-fit:contain}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:27px;height:27px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.82);cursor:pointer}.prev{left:3px}.next{right:3px}.count{position:absolute;right:5px;bottom:4px;padding:2px 4px;background:rgba(255,255,255,.76);font-size:9px}.field{width:100%;margin-top:5px;padding:5px 1px;border:0;border-bottom:1px dashed var(--line);background:transparent}.name{font-size:var(--name,16px);font-weight:750}.sale{font-size:var(--sale,13px);color:var(--mut)}.offer{font-size:var(--offer,14px);font-weight:800}.row-actions{display:flex;gap:4px;margin-top:7px}.mini{padding:5px 7px;font-size:10px}.add{display:grid;place-items:center;min-height:240px;border:1px dashed var(--line);border-radius:13px}.basket{position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));padding:12px 14px;box-shadow:0 14px 50px rgba(0,0,0,.18)}.basket-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.basket-body{max-height:190px;overflow:auto}.basket.closed .basket-body,.basket.closed .basket-foot{display:none}.basket-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{width:28px;height:28px;padding:0}.basket-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--line)}.notice{position:fixed;right:16px;top:70px;padding:10px 12px;border-radius:10px;background:var(--d);color:#fff;opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:720px){header{align-items:flex-start}.wrap{padding:10px}.import{grid-template-columns:1fr}.import small{grid-column:auto}.setting-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.product{padding:4px}.name{font-size:13px}.sale,.offer{font-size:11px}.row-actions{display:none}.arrow{width:24px;height:24px}.basket-row{grid-template-columns:1fr auto}.basket-row>strong{grid-column:1/-1;text-align:right}}
.actions{position:relative}.settings{position:fixed;z-index:60;top:62px;right:112px;width:230px;margin:0;padding:13px;border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.14)}.settings[hidden]{display:none}.settings .setting-grid{grid-template-columns:1fr;gap:10px}.settings .fold{display:none}@media(max-width:720px){.settings{top:58px;right:96px;width:210px}.row-actions{display:flex}.row-actions .mini{flex:1;padding:5px 2px;font-size:9px}}
.filters{position:relative;margin-bottom:16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px}.filter-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}.filter-line b{flex:0 0 48px;padding-top:7px;font-size:12px}.filter-buttons,.selection-tools{display:flex;flex-wrap:wrap;gap:6px}.filter-btn{padding:7px 10px;font-size:11px}.filter-btn.active{border-color:var(--g);background:#e8f5ee;color:var(--g)}.selection-tools{align-items:center;padding-top:10px;border-top:1px solid var(--line)}.selection-count{margin-left:auto;color:var(--mut);font-size:12px}.download-pop{position:absolute;z-index:20;right:14px;top:100%;width:250px;margin-top:7px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.14)}.download-pop[hidden]{display:none}.download-pop label{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:12px}.download-pop p{margin:0 0 10px;color:var(--mut);font-size:11px;line-height:1.45}.category-select,.tag-input{width:100%;margin-top:5px;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px}.empty-result{grid-column:1/-1;padding:50px;text-align:center;color:var(--mut)}
.image-modal[hidden]{display:none}.image-modal{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.48)}.image-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;padding:18px;background:#fff;border-radius:18px}.image-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.image-dialog-head h2{margin:0;font-size:18px}.image-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:16px 0}.image-slot{position:relative;min-width:0;padding:5px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.image-slot.main{border:2px solid var(--g)}.image-slot img{display:block;width:100%;aspect-ratio:5/6;object-fit:contain;background:#fff}.image-slot-tools{display:flex;justify-content:center;gap:3px;margin-top:5px}.image-slot-tools button{padding:5px;font-size:9px}.image-drop{display:grid;place-items:center;min-height:110px;padding:15px;border:2px dashed var(--line);border-radius:12px;color:var(--mut);text-align:center;cursor:pointer}.image-drop.dragging{border-color:var(--g);background:#eef8f2}.image-drop input{display:none}.image-dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:600px){.image-slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><header><a href="index.html">← STARBUCKS HELPER</a><div class="actions"><button class="btn" id="fontToggle" type="button" aria-expanded="false" aria-controls="fontSettings">폰트</button><a class="btn" href="catalog-preview.html" target="_blank">미리보기</a><button class="btn primary" id="save">저장</button></div></header><main class="wrap">
<section class="import"><input id="url" type="url" placeholder="스타벅스 공식 또는 무신사 상품 링크"><button class="btn primary" id="import">다운로드＋상품 추가</button><small>상품명·판매가·원본 이미지(최대 5장)를 가져와 다운로드/스타벅스MD/상품명 폴더에 저장하고 카탈로그에도 추가합니다.</small></section>
<section class="filters"><div class="filter-line"><b>대분류</b><div class="filter-buttons" id="categoryFilters"></div></div><div class="filter-line"><b>소분류</b><div class="filter-buttons" id="tagFilters"></div></div><div class="selection-tools"><button class="btn filter-btn" id="selectVisible">전체 선택</button><button class="btn filter-btn" id="clearVisible">전체 선택 해제</button><button class="btn primary filter-btn" id="downloadToggle">선택 상품 JPG</button><span class="selection-count" id="filterCount"></span></div><div class="download-pop" id="downloadPop" hidden><p>선택 상품을 5열 × 3줄, 페이지당 최대 15개로 나누어 저장합니다.</p><label><input type="checkbox" id="showOffer" checked> 제안가 표시</label><button class="btn primary" id="downloadJpg">JPG 다운로드</button></div></section>
<section class="settings" id="fontSettings" hidden><button class="btn fold" id="fold" aria-label="글자 설정 접기">⌃</button><div class="setting-grid"><label>상품명 크기 <output id="nv">16px</output><input id="ns" type="range" min="11" max="22" value="16"></label><label>판매가 크기 <output id="sv">13px</output><input id="ss" type="range" min="10" max="20" value="13"></label><label>제안가 크기 <output id="ov">14px</output><input id="os" type="range" min="10" max="22" value="14"></label></div></section>
<section class="category"><div class="cat-head"><h1 contenteditable="true">텀블러 · MD</h1><button class="btn" id="add">＋ 상품 추가</button></div><div class="grid" id="grid"></div></section></main>
<section class="image-modal" id="imageModal" hidden><div class="image-dialog" role="dialog" aria-modal="true" aria-labelledby="imageDialogTitle"><div class="image-dialog-head"><h2 id="imageDialogTitle">상품 이미지 관리</h2><button class="btn" id="imageClose" aria-label="닫기">✕</button></div><div class="image-slots" id="imageSlots"></div><label class="image-drop" id="imageDrop"><span><b>이미지 1~5장 추가</b><br><small>클릭해서 선택하거나 여기에 끌어놓으세요.</small></span><input id="manualImages" type="file" accept="image/*" multiple></label><div class="image-dialog-foot"><button class="btn" id="imageCancel">닫기</button><button class="btn primary" id="imageApply">적용</button></div></div></section>
<aside class="basket closed" id="basket"><div class="basket-head"><b id="summary">선택 상품 0개 · 합계 0원</b><button class="btn mini" id="basketFold">펼치기⌃</button></div><div class="basket-body" id="basketRows"></div><div class="basket-foot"><span>VAT 포함 · 견적서에서 공급가액/부가세 분리</span><button class="btn primary" id="quote">견적서 만들기</button></div></aside><div class="notice" id="notice"></div>
<script>
const KEY='starbucks-helper-web-catalog-v1';
const CATEGORIES=['텀블러','머그','우산','티바나(차)','비아','원두','액세서리','리유저블'],TAGS=['스탠리','시그니처','리유저블'];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{category:'스타벅스 MD',sizes:{name:16,sale:13,offer:14},products:[]};
data.products.forEach(p=>{p.category=p.category||'텀블러';p.tags=Array.isArray(p.tags)?p.tags:[]});let activeCategory='전체',activeTag='전체';
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const IMAGE_DB='starbucks-helper-catalog-images-v1',IMAGE_STORE='images',imageCache=new Map();let imageEditIndex=-1,imageDraft=[];
function openImageDb(){return new Promise((resolve,reject)=>{let request=indexedDB.open(IMAGE_DB,1);request.onupgradeneeded=()=>request.result.createObjectStore(IMAGE_STORE);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function storeImage(file){let key=`${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}`,db=await openImageDb();await new Promise((resolve,reject)=>{let tx=db.transaction(IMAGE_STORE,'readwrite');tx.objectStore(IMAGE_STORE).put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();let ref='idb:'+key;imageCache.set(ref,URL.createObjectURL(file));return ref}
async function hydrateImage(ref){if(!ref||!ref.startsWith('idb:')||imageCache.has(ref))return;let db=await openImageDb(),blob=await new Promise((resolve,reject)=>{let request=db.transaction(IMAGE_STORE).objectStore(IMAGE_STORE).get(ref.slice(4));request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();if(blob)imageCache.set(ref,URL.createObjectURL(blob))}
function imageSrc(ref){return imageCache.get(ref)||ref||''}
async function hydrateAll(){await Promise.all(data.products.flatMap(p=>(p.images||[]).map(hydrateImage)));render()}
function toast(t){$('#notice').textContent=t;$('#notice').classList.add('show');setTimeout(()=>$('#notice').classList.remove('show'),1400)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function autosave(){data.category=$('.cat-head h1').textContent.trim()||'상품';localStorage.setItem(KEY,JSON.stringify(data))}function save(){autosave();toast('저장했습니다')}
function visible(){return data.products.map((p,i)=>({p,i})).filter(({p})=>(activeCategory==='전체'||p.category===activeCategory)&&(activeTag==='전체'||p.tags.includes(activeTag)))}
function renderFilters(){let cats=['전체',...CATEGORIES],tags=['전체',...new Set([...TAGS,...data.products.flatMap(p=>p.tags||[])])];$('#categoryFilters').innerHTML=cats.map(v=>`<button class="btn filter-btn ${v===activeCategory?'active':''}" data-cat="${esc(v)}">${esc(v)}</button>`).join('');$('#tagFilters').innerHTML=tags.map(v=>`<button class="btn filter-btn ${v===activeTag?'active':''}" data-tag="${esc(v)}">${esc(v)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{activeTag=b.dataset.tag;render()});$('#filterCount').textContent=`표시 ${visible().length}개 · 선택 ${data.products.filter(p=>p.selected).length}개`}
function render(){document.documentElement.style.setProperty('--name',data.sizes.name+'px');document.documentElement.style.setProperty('--sale',data.sizes.sale+'px');document.documentElement.style.setProperty('--offer',data.sizes.offer+'px');let items=visible();$('#grid').innerHTML=items.map(({p,i})=>`<article class="product" draggable="true" data-i="${i}"><div class="meta"><span class="drag">☷</span><input class="pick" type="checkbox" ${p.selected?'checked':''} aria-label="${i+1}번 선택"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(p.source||'직접')}</span></div><div class="photo" title="클릭하여 이미지 관리"><img crossorigin="anonymous" src="${esc(imageSrc(p.images[p.current||0]||''))}" alt="${esc(p.name)}">${p.images.length>1?`<button class="arrow prev" aria-label="이전 이미지">‹</button><button class="arrow next" aria-label="다음 이미지">›</button><span class="count">${(p.current||0)+1}/${p.images.length}</span>`:''}</div><input class="field name" data-k="name" value="${esc(p.name)}"><input class="field sale" data-k="sale" value="판매가 ${money(p.sale)}"><input class="field offer" data-k="offer" value="제안가 ${money(p.offer)}"><select class="category-select">${CATEGORIES.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select><input class="tag-input" value="${esc((p.tags||[]).join(', '))}" placeholder="소분류: 스탠리, 시그니처"><div class="row-actions"><button class="btn mini clone">복사</button><button class="btn mini remove">삭제</button></div></article>`).join('')+(items.length?'':'<div class="empty-result">현재 분류에 해당하는 상품이 없습니다.</div>')+`<div class="add"><button class="btn" id="inlineAdd">＋ 상품</button></div>`;bind();renderFilters();basket()}
function bind(){document.querySelectorAll('.product').forEach(card=>{let i=+card.dataset.i,p=data.products[i];card.querySelector('.photo').onclick=e=>{if(!e.target.closest('button'))openImageManager(i)};card.querySelector('.pick').onchange=e=>{p.selected=e.target.checked;renderFilters();basket()};let prev=card.querySelector('.prev'),next=card.querySelector('.next');if(prev)prev.onclick=()=>{p.current=(p.current-1+p.images.length)%p.images.length;render()};if(next)next.onclick=()=>{p.current=(p.current+1)%p.images.length;render()};card.querySelectorAll('.field').forEach(f=>f.onchange=()=>{if(f.dataset.k==='name')p.name=f.value;else p[f.dataset.k]=Number(f.value.replace(/\D/g,''));basket()});card.querySelector('.category-select').onchange=e=>{p.category=e.target.value;render()};card.querySelector('.tag-input').onchange=e=>{p.tags=[...new Set(e.target.value.split(',').map(v=>v.trim()).filter(Boolean))];render()};card.querySelector('.clone').onclick=()=>{data.products.splice(i+1,0,{...p,tags:[...p.tags],id:Date.now(),selected:false});render()};card.querySelector('.remove').onclick=()=>{if(!confirm(`${p.name}\n상품을 삭제할까요?`))return;data.products.splice(i,1);autosave();render();toast('상품을 삭제했습니다')};card.ondragstart=e=>e.dataTransfer.setData('text/plain',i);card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();let from=+e.dataTransfer.getData('text/plain');let [m]=data.products.splice(from,1);data.products.splice(i,0,m);render()}});$('#inlineAdd').onclick=add}
function openImageManager(i){imageEditIndex=i;imageDraft=[...(data.products[i].images||[])];$('#imageDialogTitle').textContent=`${data.products[i].name} · 이미지 관리`;renderImageSlots();$('#imageModal').hidden=false}
function closeImageManager(){$('#imageModal').hidden=true;imageEditIndex=-1;imageDraft=[];$('#manualImages').value=''}
function renderImageSlots(){$('#imageSlots').innerHTML=imageDraft.map((ref,i)=>`<div class="image-slot ${i===0?'main':''}" draggable="true" data-slot="${i}"><img src="${esc(imageSrc(ref))}" alt="${i+1}번 이미지"><div class="image-slot-tools">${i?'<button class="btn main-image">대표</button>':'<button class="btn" disabled>대표</button>'}<button class="btn move-left" ${i===0?'disabled':''}>←</button><button class="btn move-right" ${i===imageDraft.length-1?'disabled':''}>→</button><button class="btn delete-image">삭제</button></div></div>`).join('');document.querySelectorAll('[data-slot]').forEach(slot=>{let i=+slot.dataset.slot;slot.querySelector('.main-image')?.addEventListener('click',()=>{let [ref]=imageDraft.splice(i,1);imageDraft.unshift(ref);renderImageSlots()});slot.querySelector('.move-left').onclick=()=>{[imageDraft[i-1],imageDraft[i]]=[imageDraft[i],imageDraft[i-1]];renderImageSlots()};slot.querySelector('.move-right').onclick=()=>{[imageDraft[i+1],imageDraft[i]]=[imageDraft[i],imageDraft[i+1]];renderImageSlots()};slot.querySelector('.delete-image').onclick=()=>{imageDraft.splice(i,1);renderImageSlots()};slot.ondragstart=e=>e.dataTransfer.setData('text/plain',i);slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();let from=+e.dataTransfer.getData('text/plain'),[ref]=imageDraft.splice(from,1);imageDraft.splice(i,0,ref);renderImageSlots()}})}
async function addManualFiles(files){let incoming=[...files].filter(f=>f.type.startsWith('image/')),room=5-imageDraft.length;if(!incoming.length)return;if(room<=0)return toast('이미지는 최대 5장입니다');incoming=incoming.slice(0,room);$('#imageDrop span').textContent='이미지 저장 중…';try{imageDraft.push(...await Promise.all(incoming.map(storeImage)));renderImageSlots()}catch(error){toast('이미지를 저장하지 못했습니다')}finally{$('#imageDrop span').innerHTML='<b>이미지 1~5장 추가</b><br><small>클릭해서 선택하거나 여기에 끌어놓으세요.</small>'}}
function add(){data.products.push({id:Date.now(),name:'새 상품',sale:0,offer:0,images:[],current:0,qty:1,selected:false,source:'직접',category:activeCategory==='전체'?'텀블러':activeCategory,tags:activeTag==='전체'?[]:[activeTag]});autosave();render()}
function basket(){let selected=data.products.filter(p=>p.selected),total=selected.reduce((s,p)=>s+p.offer*p.qty,0);$('#summary').textContent=`선택 상품 ${selected.length}개 · 합계 ${money(total)}`;$('#basketRows').innerHTML=selected.map(p=>`<div class="basket-row" data-id="${p.id}"><span>${esc(p.name)}<small> · ${money(p.offer)}</small></span><span class="qty"><button class="btn minus">−</button><b>${p.qty}개</b><button class="btn plus">＋</button></span><strong>${money(p.offer*p.qty)}</strong></div>`).join('')||'<p>상품 체크박스를 선택하세요.</p>';document.querySelectorAll('.basket-row').forEach(r=>{let p=data.products.find(x=>x.id==r.dataset.id);r.querySelector('.minus').onclick=()=>{p.qty=Math.max(1,p.qty-1);basket()};r.querySelector('.plus').onclick=()=>{p.qty++;basket()}})}
function loadImage(src){return new Promise(resolve=>{if(!src)return resolve(null);let img=new Image;img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src})}
function drawFit(ctx,img,x,y,w,h){if(!img){ctx.fillStyle='#f2f3f2';ctx.fillRect(x,y,w,h);return}let s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){let line='',lines=[];for(const ch of String(text)){let next=line+ch;if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=ch}else line=next}if(line)lines.push(line);lines.slice(0,maxLines).forEach((v,i)=>ctx.fillText(v,x,y+i*lineHeight))}
async function downloadSelected(){let products=data.products.filter(p=>p.selected);if(!products.length)return toast('다운로드할 상품을 선택해주세요');let showOffer=$('#showOffer').checked,pages=Math.ceil(products.length/15);$('#downloadJpg').disabled=true;$('#downloadJpg').textContent='JPG 만드는 중…';try{for(let page=0;page<pages;page++){let pageItems=products.slice(page*15,(page+1)*15),canvas=document.createElement('canvas');canvas.width=2000;canvas.height=2400;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#171b18';ctx.font='700 54px Pretendard, sans-serif';ctx.fillText(activeCategory==='전체'?'STARBUCKS MD':activeCategory,70,90);ctx.fillStyle='#66706a';ctx.font='400 22px Pretendard, sans-serif';ctx.fillText('전 상품 VAT 포함',70,130);let images=await Promise.all(pageItems.map(p=>loadImage(imageSrc(p.images[0]))));pageItems.forEach((p,i)=>{let col=i%5,row=Math.floor(i/5),x=55+col*390,y=175+row*720;drawFit(ctx,images[i],x,y,350,430);ctx.fillStyle='#171b18';ctx.font='700 27px Pretendard, sans-serif';drawWrapped(ctx,p.name,x,y+475,350,34,2);ctx.fillStyle='#777';ctx.font='400 22px Pretendard, sans-serif';ctx.fillText(`판매가 ${money(p.sale)}`,x,y+555);if(showOffer){ctx.fillStyle='#171b18';ctx.font='700 25px Pretendard, sans-serif';ctx.fillText(`제안가 ${money(p.offer)}`,x,y+595)}});let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw new Error('JPG 파일을 만들지 못했습니다');let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`스타벅스MD_${String(page+1).padStart(2,'0')}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}toast(`JPG ${pages}장 다운로드 완료`);$('#downloadPop').hidden=true}catch(error){toast(error.message)}finally{$('#downloadJpg').disabled=false;$('#downloadJpg').textContent='JPG 다운로드'}}
$('#imageClose').onclick=$('#imageCancel').onclick=closeImageManager;$('#imageApply').onclick=()=>{if(imageEditIndex<0)return;data.products[imageEditIndex].images=[...imageDraft];data.products[imageEditIndex].current=0;autosave();closeImageManager();render();toast('상품 이미지를 적용했습니다')};$('#manualImages').onchange=e=>addManualFiles(e.target.files);['dragenter','dragover'].forEach(type=>$('#imageDrop').addEventListener(type,e=>{e.preventDefault();$('#imageDrop').classList.add('dragging')}));['dragleave','drop'].forEach(type=>$('#imageDrop').addEventListener(type,e=>{e.preventDefault();$('#imageDrop').classList.remove('dragging')}));$('#imageDrop').addEventListener('drop',e=>addManualFiles(e.dataTransfer.files));$('#imageModal').onclick=e=>{if(e.target===$('#imageModal'))closeImageManager()};$('.cat-head h1').onblur=autosave;
['name','sale','offer'].forEach((k,i)=>{let input=$(['#ns','#ss','#os'][i]),out=$(['#nv','#sv','#ov'][i]);input.value=data.sizes[k];out.value=data.sizes[k]+'px';input.oninput=()=>{data.sizes[k]=+input.value;out.value=input.value+'px';render()}});
async function extractFromHelper(url){let lastError;for(const port of [17833,17832]){try{let response=await fetch(`http://127.0.0.1:${port}/extract`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'상품을 가져오지 못했습니다');if(!result.imageUrls?.length)throw new Error('실행 중인 추출기가 구버전입니다');return result}catch(error){lastError=error}}throw lastError}
$('#fontToggle').onclick=e=>{e.stopPropagation();let panel=$('#fontSettings'),open=panel.hidden;panel.hidden=!open;$('#fontToggle').setAttribute('aria-expanded',String(open))};$('#fontSettings').onclick=e=>e.stopPropagation();$('#downloadPop').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>{$('#fontSettings').hidden=true;$('#downloadPop').hidden=true;$('#fontToggle').setAttribute('aria-expanded','false')});$('#fold').onclick=()=>{};$('#basketFold').onclick=()=>{let c=$('#basket').classList.toggle('closed');$('#basketFold').textContent=c?'펼치기⌃':'접기⌄'};$('#selectVisible').onclick=()=>{visible().forEach(({p})=>p.selected=true);render()};$('#clearVisible').onclick=()=>{visible().forEach(({p})=>p.selected=false);render()};$('#downloadToggle').onclick=e=>{e.stopPropagation();$('#downloadPop').hidden=!$('#downloadPop').hidden};$('#downloadJpg').onclick=downloadSelected;$('#save').onclick=save;$('#add').onclick=add;$('#quote').onclick=()=>toast('서류 만들기 연결부만 준비된 상태입니다');$('#import').onclick=async()=>{let u=$('#url').value.trim(),button=$('#import');if(!u)return toast('상품 링크를 입력해주세요');button.disabled=true;button.textContent='다운로드 중…';try{let result=await extractFromHelper(u);data.products.push({id:Date.now(),name:result.productName,sale:Number(result.price||0),offer:Number(result.price||0),images:(result.imageUrls||[]).slice(0,5),current:0,qty:1,selected:false,source:result.source==='musinsa'?'무신사':'스타벅스 공식',downloadFolder:result.folder,category:activeCategory==='전체'?'텀블러':activeCategory,tags:activeTag==='전체'?[]:[activeTag]});autosave();render();toast(`이미지 ${result.imageCount}장 다운로드＋상품 추가 완료`)}catch(error){toast(error.message.includes('fetch')?'로컬 MD 추출기를 먼저 실행해주세요':error.message)}finally{button.disabled=false;button.textContent='다운로드＋상품 추가'}};render();
</script></body></html>
