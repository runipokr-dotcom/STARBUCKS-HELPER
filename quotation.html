<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063c2d">
<title>서류 만들기 | STARBUCKS HELPER</title>
<script src="exceljs.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--green:#00754a;--deep:#063c2d;--pale:#e3f2ea;--bg:#f3f5f3;--line:#dce4df;--text:#18201c;--muted:#68756d;--red:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{padding:calc(18px + env(safe-area-inset-top)) 16px 36px;background:var(--deep);color:#fff}.head,main{width:min(100%,760px);margin:auto}.back{color:#cde1d7;text-decoration:none;font-size:13px;font-weight:800}h1{margin:17px 0 6px;font-size:30px;letter-spacing:-.045em}.sub{margin:0;color:#c7d5ce;font-size:13px;line-height:1.5}main{margin-top:-20px;padding:0 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:17px;border:1px solid rgba(9,54,39,.09);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(13,48,35,.06)}h2{margin:0 0 13px;font-size:17px}.type-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.type-option{position:relative}.type-option input{position:absolute;opacity:0;pointer-events:none}.type-option span{display:grid;place-items:center;min-height:58px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fbfcfb;color:var(--muted);text-align:center;font-size:14px;font-weight:900}.type-option input:checked+span{border-color:var(--green);background:var(--pale);color:var(--deep);box-shadow:inset 0 0 0 1px var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}label{color:var(--muted);font-size:11px;font-weight:800}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;color:var(--text);font:inherit;font-size:14px;padding:12px}input:focus,textarea:focus{outline:2px solid rgba(0,117,74,.15);border-color:var(--green)}textarea{min-height:112px;resize:vertical}.item{position:relative;margin-bottom:10px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fbfcfb}.item-grid{display:grid;grid-template-columns:1fr 92px 120px;gap:8px}.remove{position:absolute;right:9px;top:8px;border:0;background:transparent;color:#89948e;font-size:18px}.item .name{padding-right:28px}.add{width:100%;border:1px dashed #9eb9aa;border-radius:13px;background:#f6fbf8;color:var(--green);font-weight:850;padding:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{padding:12px 8px;border-radius:14px;background:#f4f7f5;text-align:center}.sum b{display:block;margin-top:5px;font-size:16px}.sum.total{background:var(--pale);color:var(--deep)}.filename{margin-top:12px;padding:12px;border-radius:13px;background:#f5f7f5;font-size:12px;font-weight:800;word-break:break-all}.check{display:flex;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}.check.ok{color:var(--green)}.check.bad{color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:14px;padding:14px 10px;font:inherit;font-size:14px;font-weight:900}.primary{background:var(--green);color:#fff}.secondary{background:var(--deep);color:#fff}.ghost{grid-column:1/-1;background:#eef2ef;color:#344039}.notice{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.toast{position:fixed;left:50%;bottom:24px;z-index:3;transform:translate(-50%,20px);padding:11px 15px;border-radius:999px;background:#15221c;color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.grid,.actions{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr 82px 105px}.item-grid .name{grid-column:1/-1}.ghost{grid-column:auto}.summary{grid-template-columns:1fr}.sum{display:flex;justify-content:space-between;text-align:left}.sum b{margin:0}.type-picker{grid-template-columns:1fr}.type-option span{min-height:50px}}
</style>
</head>
<body>
<header><div class="head"><a class="back" href="index.html">← 헬퍼 홈</a><h1>서류 만들기</h1><p class="sub">견적서 또는 거래명세서를 골라 엑셀과 메일을 준비합니다.</p></div></header>
<main>
<section class="card"><h2>1. 서류 종류</h2><div class="type-picker"><label class="type-option"><input type="radio" name="docType" value="견적서" checked><span>견적서</span></label><label class="type-option"><input type="radio" name="docType" value="거래명세서"><span>거래명세서</span></label><label class="type-option"><input type="radio" name="docType" value="견적서+거래명세서"><span>견적서 + 거래명세서</span></label></div></section>
<section class="card"><h2>2. 거래처</h2><div class="grid"><div class="field"><label for="company">회사명</label><input id="company" placeholder="회사명 입력"></div><div class="field"><label for="email">받는 이메일</label><input id="email" type="email" placeholder="이메일 주소 입력"></div></div></section>
<section class="card"><h2>3. 품목</h2><div id="items"></div><button id="addItem" class="add" type="button">＋ 품목 추가</button></section>
<section class="card"><h2>4. 배송 품목</h2><div class="grid"><div class="field"><label for="shippingQty">배송 수량</label><input id="shippingQty" inputmode="numeric" value="1"></div><div class="field"><label for="shipping">배송 단가 (부가세 포함)</label><input id="shipping" inputmode="numeric" value="4000"></div><div class="field wide"><label for="shippingNote">배송비 비고</label><input id="shippingNote" value="" placeholder="필요할 때만 입력"></div></div></section>
<section class="card"><h2>5. 메일 설정</h2><div class="grid"><div class="field wide"><label for="subject">메일 제목</label><input id="subject"></div><div class="field wide"><label for="body">메일 내용</label><textarea id="body"></textarea><span class="notice">/n을 입력하면 줄바꿈으로 바뀝니다. /n/n은 빈 줄 하나입니다.</span></div></div></section>
<section class="card"><h2>6. 최종 확인</h2><div class="summary"><div class="sum">공급가액<b id="supply">0원</b></div><div class="sum">부가세<b id="vat">0원</b></div><div class="sum total">합계<b id="grand">0원</b></div></div><div class="filename" id="filename"></div><div id="recipientCheck" class="check"></div><div id="amountCheck" class="check"></div></section>
<section class="card"><div class="actions"><button id="download" class="btn primary" type="button">엑셀 만들기</button><button id="mail" class="btn secondary" type="button">작성창 열기</button><button id="copy" class="btn ghost" type="button">메일 복사</button></div></section>
</main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString("ko-KR")+"원",digits=v=>Number(String(v??"").replace(/[^0-9.-]/g,""))||0;
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}`};
const cleanCompany=v=>(v.trim().replace(/^\s*(?:\(주\)|㈜|주식회사)\s*/," ").trim()||"회사명").replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ");
const itemTemplate=(name="",qty="",price="")=>`<div class="item"><button class="remove" type="button" aria-label="품목 삭제">×</button><div class="item-grid"><div class="field name"><label>품목명</label><input data-k="name" value="${name}" placeholder="품목명 입력"></div><div class="field"><label>수량</label><input data-k="qty" inputmode="numeric" value="${qty}"></div><div class="field"><label>개당 단가(포함)</label><input data-k="price" inputmode="numeric" value="${price}"></div></div></div>`;
function addItem(name="",qty="",price=""){$("items").insertAdjacentHTML("beforeend",itemTemplate(name,qty,price));bind();calc()}
function bind(){document.querySelectorAll(".item input").forEach(x=>x.oninput=calc);document.querySelectorAll(".remove").forEach(x=>x.onclick=()=>{if(document.querySelectorAll(".item").length>1){x.closest(".item").remove();calc()}})}
function rows(){return [...document.querySelectorAll(".item")].map(x=>({name:x.querySelector('[data-k="name"]').value.trim(),qty:digits(x.querySelector('[data-k="qty"]').value),price:digits(x.querySelector('[data-k="price"]').value)})).filter(x=>x.name||x.qty||x.price)}
function docType(){return document.querySelector('[name="docType"]:checked').value}
function selectedDocs(){return docType()==="견적서+거래명세서"?["견적서","거래명세서"]:[docType()]}
function fileName(type,company){return `스타벅스 대량구매 ${type} - ${cleanCompany(company)} ${today()}.xlsx`}
function values(){const items=rows(),shippingQty=digits($("shippingQty").value),shipping=digits($("shipping").value),shippingTotal=shippingQty*shipping,total=items.reduce((s,x)=>s+x.qty*x.price,0)+shippingTotal,supply=Math.round(total/1.1),vat=total-supply,company=$("company").value.trim(),email=$("email").value.trim(),type=docType();return{items,shippingQty,shipping,shippingTotal,total,supply,vat,company,email,type}}
function calc(){const v=values(),files=selectedDocs().map(type=>fileName(type,v.company));$("supply").textContent=money(v.supply);$("vat").textContent=money(v.vat);$("grand").textContent=money(v.total);$("filename").innerHTML="파일명:<br>"+files.join("<br>");$("recipientCheck").className="check "+(v.company&&/^\S+@\S+\.\S+$/.test(v.email)?"ok":"bad");$("recipientCheck").textContent=v.company&&/^\S+@\S+\.\S+$/.test(v.email)?`✓ 수신자 확인: ${v.company} · ${v.email}`:"! 회사명과 이메일을 확인하세요.";$("amountCheck").className="check "+(v.items.length&&v.total>0?"ok":"bad");$("amountCheck").textContent=v.items.length&&v.total>0?`✓ 품목 ${v.items.length}개 · 총 ${money(v.total)}`:"! 품목·수량·단가를 확인하세요."}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function validate(){const v=values();if(!v.company)return toast("회사명을 입력하세요"),null;if(!v.items.length||v.items.some(x=>!x.name||x.qty<=0||x.price<0))return toast("품목·수량·단가를 확인하세요"),null;return v}
function addDocumentSheet(wb,v,type){const isQuote=type==="견적서",title=isQuote?"견 적 서":"거 래 명 세 서",dateLabel=isQuote?"견적일":"거래일",intro=isQuote?"아래와 같이 견적합니다. (단위: 원 / 부가세 포함)":"아래와 같이 거래 내역을 확인합니다. (단위: 원 / 부가세 포함)",ws=wb.addWorksheet(type,{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:1,margins:{left:.3,right:.3,top:.45,bottom:.45,header:.15,footer:.15}}});ws.columns=[{width:7},{width:36},{width:12},{width:16},{width:18},{width:22}];ws.mergeCells("A1:F2");ws.getCell("A1").value=title;ws.getCell("A1").font={name:"맑은 고딕",size:24,bold:true};ws.getCell("A1").alignment={horizontal:"center",vertical:"middle"};ws.getCell("A4").value=isQuote?"수신":"공급받는자";ws.getCell("B4").value=v.company;ws.getCell("D4").value=dateLabel;ws.mergeCells("E4:F4");ws.getCell("E4").value=new Date();ws.getCell("E4").numFmt="yyyy년 mm월 dd일";ws.getCell("A5").value="공급자";ws.getCell("B5").value="디스이스마인";ws.getCell("D5").value="연락처";ws.mergeCells("E5:F5");ws.getCell("E5").value="010-5711-3730";ws.mergeCells("A7:F7");ws.getCell("A7").value=intro;ws.getCell("A7").font={name:"맑은 고딕",size:11,bold:true};ws.addRow([]);const hr=ws.addRow(["번호","품목명","수량","단가","금액","비고"]);hr.eachCell(c=>{c.font={name:"맑은 고딕",bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF006241"}};c.alignment={horizontal:"center",vertical:"middle"}});let no=1;for(const x of v.items){const r=ws.addRow([no++,x.name,x.qty,x.price,x.qty*x.price,""]);r.height=25;r.eachCell(c=>c.font={name:"맑은 고딕",size:10});r.getCell(1).alignment={horizontal:"center"};r.getCell(3).alignment={horizontal:"center"};r.getCell(4).numFmt="#,##0";r.getCell(5).numFmt="#,##0"}if(v.shippingQty&&v.shipping){const r=ws.addRow([no,"배송비",v.shippingQty,v.shipping,v.shippingTotal,$("shippingNote").value.trim()]);r.height=25;r.eachCell(c=>c.font={name:"맑은 고딕",size:10});r.getCell(1).alignment={horizontal:"center"};r.getCell(3).alignment={horizontal:"center"};r.getCell(4).numFmt="#,##0";r.getCell(5).numFmt="#,##0"}const sr=ws.addRow(["","공급가액","","",v.supply,""]),vr=ws.addRow(["","부가세","","",v.vat,""]),tr=ws.addRow(["","합계금액","","",v.total,""]);[sr,vr,tr].forEach(r=>{ws.mergeCells(`B${r.number}:D${r.number}`);r.getCell(2).font={name:"맑은 고딕",bold:true};r.getCell(2).alignment={horizontal:"right"};r.getCell(5).font={name:"맑은 고딕",bold:true};r.getCell(5).numFmt="#,##0"});tr.eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE3F2EA"}});for(let r=4;r<=tr.number;r++)for(let c=1;c<=6;c++){const cell=ws.getCell(r,c);cell.border={top:{style:"thin",color:{argb:"FFD9E0DC"}},left:{style:"thin",color:{argb:"FFD9E0DC"}},bottom:{style:"thin",color:{argb:"FFD9E0DC"}},right:{style:"thin",color:{argb:"FFD9E0DC"}}};cell.alignment={...cell.alignment,vertical:"middle"}}}
async function makeSelectedExcel(){const v=validate();if(!v)return;if(!window.ExcelJS)return toast("엑셀 기능을 불러오지 못했습니다");for(const type of selectedDocs()){const wb=new ExcelJS.Workbook();addDocumentSheet(wb,v,type);const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a"),url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.href=url;a.download=fileName(type,v.company);a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);await new Promise(resolve=>setTimeout(resolve,250))}toast(`${v.type} 파일을 만들었습니다`)}
function syncDocText(){const type=docType(),both=type==="견적서+거래명세서",label=both?"견적서와 거래명세서":type,attachments=both?"견적서와 거래명세서, 당사의 사업자등록증 및 통장 사본":`${label}와 당사의 사업자등록증, 통장 사본`;$("subject").value=`[디스이스마인] 스타벅스 대량구매 ${label} 전달드립니다 , ${today()}`;$("body").value=`안녕하십니까, 디스이스마인입니다.\n\n문의하신 상품에 대한 ${attachments}을 함께 전달드립니다.\n\n감사합니다.`;$("download").textContent=`${label} 엑셀 만들기`;calc()}
function mailBody(){return $("body").value.replace(/\\n|\/n/gi,"\n")}
function mail(){const v=validate();if(!v)return;if(!/^\S+@\S+\.\S+$/.test(v.email))return toast("받는 이메일을 확인하세요");const url=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(v.email)}&su=${encodeURIComponent($("subject").value)}&body=${encodeURIComponent(mailBody())}`;window.open(url,"_blank","noopener")}
$("addItem").onclick=()=>addItem();$("download").onclick=makeSelectedExcel;$("mail").onclick=mail;$("copy").onclick=async()=>{await navigator.clipboard.writeText(`받는사람: ${$("email").value}\n제목: ${$("subject").value}\n\n${mailBody()}`);toast("메일 내용을 복사했습니다")};["company","email","shippingQty","shipping","shippingNote"].forEach(id=>$(id).oninput=calc);document.querySelectorAll('[name="docType"]').forEach(x=>x.onchange=syncDocText);addItem();syncDocText();
// SECRET ENTRY: tap the page title 5 times within 2.4 seconds.
(()=>{const title=document.querySelector('h1');let taps=0,timer=null;if(!title)return;title.addEventListener('click',()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,2400);if(taps>=5){taps=0;location.href='territory-game.html'}})})();
</script>
</body>
</html>
