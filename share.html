<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>상품 안내 | 디스이스마인</title>
    <meta name="description" content="디스이스마인 제공" />
    <meta property="og:title" content="상품 안내 | 디스이스마인" />
    <meta property="og:description" content="디스이스마인 제공" />
    <meta property="og:type" content="website" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        font-family: Pretendard, sans-serif;
        --g: #00754a;
        --d: #063c2d;
        --bg: #f3f5f3;
        --line: #dfe5e1;
        --mut: #6a766f;
        --ink: #18201c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        padding-bottom: 90px;
      }
      button,
      input {
        font: inherit;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 15px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-weight: 800;
        color: var(--d);
      }
      .wrap {
        width: min(1200px, 100%);
        margin: auto;
        padding: 18px;
      }
      .state {
        padding: 60px 20px;
        text-align: center;
        color: var(--mut);
      }
      .filters {
        margin-bottom: 16px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .filter-line {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
      }
      .filter-line b {
        flex: 0 0 48px;
        padding-top: 7px;
        font-size: 12px;
      }
      .offer-toggle-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        padding-top: 7px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        cursor: pointer;
      }
      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .filter-btn {
        padding: 7px 10px;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
      }
      .filter-btn.active {
        border-color: var(--g);
        background: #e8f5ee;
        color: var(--g);
      }
      .category {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 1050px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .wrap {
          padding: 10px;
        }
      }
      .product {
        min-width: 0;
        padding: 9px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: #fff;
      }
      .product:has(.pick:checked) {
        border-color: var(--g);
        background: #f2faf6;
      }
      .photo {
        position: relative;
        aspect-ratio: 5/6;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f7f7f5;
        border-radius: 10px;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .photo.empty {
        color: var(--mut);
        font-size: 11px;
      }
      .photo-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
        cursor: pointer;
      }
      .photo-arrow.prev { left: 5px; }
      .photo-arrow.next { right: 5px; }
      .photo-count {
        position: absolute;
        right: 6px;
        bottom: 5px;
        padding: 2px 5px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.8);
        font-size: 10px;
      }
      .p-name {
        margin-top: 7px;
        font-size: 15px;
        font-weight: 750;
      }
      .p-sale {
        font-size: 12px;
        color: var(--mut);
      }
      .p-offer {
        font-size: 14px;
        font-weight: 800;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 7px;
        color: var(--mut);
        font-size: 12px;
      }
      .drag {
        cursor: grab;
      }
      .selection-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .selection-count {
        margin-left: auto;
        color: var(--mut);
        font-size: 12px;
      }
      .empty-result {
        grid-column: 1/-1;
        padding: 50px;
        text-align: center;
        color: var(--mut);
      }
      .basket {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(560px, calc(100% - 24px));
        padding: 12px 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.18);
      }
      .basket-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .basket-body {
        max-height: 34vh;
        overflow: auto;
        margin-top: 10px;
      }
      .basket.closed .basket-body,
      .basket.closed .basket-foot {
        display: none;
      }
      .basket-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .qty button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .basket-foot {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .totals {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--mut);
        margin-bottom: 3px;
      }
      .totals.grand {
        font-size: 15px;
        font-weight: 800;
        color: var(--ink);
      }
      .contact-fields {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-bottom: 10px;
        opacity: 0.6;
        font-size: 11px;
      }
      .contact-fields label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .contact-fields input {
        width: auto;
        min-width: 40px;
        max-width: 220px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 11px;
      }
      .contact-fields input:disabled {
        background: transparent;
        border-color: transparent;
        color: var(--ink);
      }
      #editableHint {
        color: #d0392c;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        background: #fff;
        color: var(--ink);
        font-weight: 750;
        cursor: pointer;
      }
      .btn.primary {
        width: 100%;
        border-color: var(--g);
        background: var(--g);
        color: #fff;
      }
      .btn.primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn.mini {
        padding: 5px 9px;
        font-size: 11px;
      }
      .notice {
        position: fixed;
        right: 16px;
        top: 70px;
        z-index: 90;
        max-width: min(300px, calc(100vw - 32px));
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--d);
        color: #fff;
        font-size: 12px;
        line-height: 1.5;
        white-space: normal;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
      }
      .notice.show {
        opacity: 1;
      }
      .scroll-top {
        position: fixed;
        right: 16px;
        bottom: 76px;
        z-index: 50;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        color: var(--d);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.14);
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>STARBUCKS MD 안내</header>
    <main class="wrap">
      <div class="state" id="loading">불러오는 중…</div>
      <div class="state" id="notFound" hidden>
        링크를 찾을 수 없습니다. 링크를 다시 확인해주세요.
      </div>
      <section class="filters" id="filtersSection" hidden>
        <div class="filter-line">
          <b>대분류</b>
          <div class="filter-buttons" id="categoryFilters"></div>
          <label class="offer-toggle-top"
            ><input type="checkbox" id="includeOffer" checked /> 제안가
            표기</label
          >
        </div>
        <div class="filter-line">
          <b>소분류</b>
          <div class="filter-buttons" id="tagFilters"></div>
        </div>
        <div class="filter-line">
          <b>정렬</b>
          <div class="filter-buttons" id="sortButtons">
            <button type="button" class="filter-btn" data-sort="price">
              가격높은순
            </button>
            <button type="button" class="filter-btn" data-sort="added">
              최근추가순
            </button>
            <button type="button" class="filter-btn" data-sort="updated">
              최근수정순
            </button>
          </div>
        </div>
        <div class="selection-tools">
          <button type="button" class="filter-btn" id="selectVisible">
            전체 선택
          </button>
          <button type="button" class="filter-btn" id="clearVisible">
            전체 선택 해제
          </button>
          <span class="selection-count" id="filterCount"></span>
        </div>
      </section>
      <section class="category" id="gridSection" hidden>
        <div class="grid" id="grid"></div>
      </section>
    </main>
    <aside class="basket closed" id="basket" hidden>
      <div class="basket-head">
        <b id="summary">선택 상품 0개</b
        ><button class="btn mini" id="basketFold">펼치기⌃</button>
      </div>
      <div class="basket-body" id="basketRows"></div>
      <div class="basket-foot">
        <div class="totals"><span>공급가액</span><b id="supply">0원</b></div>
        <div class="totals"><span>부가세</span><b id="vat">0원</b></div>
        <div class="totals grand"><span>합계</span><b id="grand">0원</b></div>
        <div class="contact-fields" id="contactFields">
          <label>상호명 <input id="ctCompany" /></label>
          <label>이메일 <input id="ctEmail" /></label>
          <label>연락처 <input id="ctPhone" /></label>
          <small id="editableHint">*수정가능</small>
        </div>
        <button class="btn primary" id="saveBtn">저장하기</button>
      </div>
    </aside>
    <button class="scroll-top" id="scrollTop" type="button" aria-label="화면 최상단으로 이동">↑</button>
    <div class="notice" id="notice"></div>
    <script>
      const FIREBASE_CONFIG = {
          apiKey: "AIzaSyAQpr3_koSKTAfihI8E3-kW3PknfMrQdaA",
          authDomain: "starbucks-helper-f578e.firebaseapp.com",
          projectId: "starbucks-helper-f578e",
          storageBucket: "starbucks-helper-f578e.firebasestorage.app",
          messagingSenderId: "1015231512258",
          appId: "1:1015231512258:web:25bb0229b5bc90b56a455b",
          measurementId: "G-8H2H0NCJDF",
        },
        SHARE_COLLECTION = "catalogShares",
        DEFAULT_CONTACT = {
          company: "디스이스마인",
          email: "runipo.kr@gmail.com",
          phone: "010-5711-3730",
        };
      const $ = (s) => document.querySelector(s),
        money = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      let toastTimer;
      function toast(t) {
        $("#notice").textContent = t;
        $("#notice").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => $("#notice").classList.remove("show"),
          3600,
        );
      }
      const params = new URLSearchParams(location.search);
      const shareId = params.get("id");
      let shareData = { categories: [], products: [] };
      let activeCategory = "전체";
      let activeTag = "전체";
      let customOrder = null; // ids, once the viewer drags/sorts locally
      let saved = false;

      function tagOptions() {
        return [...new Set(shareData.products.flatMap((p) => p.tags || []))];
      }
      function applyCustomOrder(products) {
        if (!customOrder) return products;
        let byId = new Map(products.map((p) => [p.id, p])),
          ordered = customOrder.map((id) => byId.get(id)).filter(Boolean),
          extra = products.filter((p) => !customOrder.includes(p.id));
        return [...ordered, ...extra];
      }
      function visible() {
        return shareData.products
          .map((p, i) => ({ p, i }))
          .filter(
            ({ p }) =>
              (activeCategory === "전체" || p.category === activeCategory) &&
              (activeTag === "전체" || (p.tags || []).includes(activeTag)),
          );
      }
      function renderFilters() {
        let cats = ["전체", ...shareData.categories],
          tags = ["전체", ...tagOptions()];
        $("#categoryFilters").innerHTML = cats
          .map(
            (v) =>
              `<button type="button" class="filter-btn ${v === activeCategory ? "active" : ""}" data-cat="${esc(v)}">${esc(v)}</button>`,
          )
          .join("");
        $("#tagFilters").innerHTML = tags
          .map(
            (v) =>
              `<button type="button" class="filter-btn ${v === activeTag ? "active" : ""}" data-tag="${esc(v)}">${esc(v)}</button>`,
          )
          .join("");
        document.querySelectorAll("[data-cat]").forEach(
          (b) =>
            (b.onclick = () => {
              activeCategory = b.dataset.cat;
              render();
            }),
        );
        document.querySelectorAll("[data-tag]").forEach(
          (b) =>
            (b.onclick = () => {
              activeTag = b.dataset.tag;
              render();
            }),
        );
        $("#filterCount").textContent =
          `표시 ${visible().length}개 · 선택 ${shareData.products.filter((p) => p.selected).length}개`;
      }
      function sortProducts(mode) {
        let includeOffer = $("#includeOffer").checked,
          items = visible();
        if (items.length < 2) return;
        let keyFn =
          mode === "price"
            ? (p) => (includeOffer ? p.offer : p.sale)
            : mode === "added"
              ? (p) => p.id
              : (p) => p.updatedAt || p.id;
        let sorted = [...items].sort((a, b) => keyFn(b.p) - keyFn(a.p));
        let slots = items.map((v) => v.i).sort((a, b) => a - b);
        sorted.forEach((item, idx) => {
          shareData.products[slots[idx]] = item.p;
        });
        customOrder = shareData.products.map((p) => p.id);
        render();
        toast("정렬했습니다");
      }
      function render() {
        let includeOffer = $("#includeOffer").checked,
          items = visible();
        $("#grid").innerHTML =
          items
            .map(
              ({ p, i }) =>
                `<article class="product" draggable="true" data-i="${i}"><div class="meta"><span class="drag">☷</span><input type="checkbox" class="pick" ${p.selected ? "checked" : ""} aria-label="${i + 1}번 선택"><span>${String(i + 1).padStart(2, "0")}</span></div><div class="photo ${p.images?.length ? "" : "empty"}">${p.images?.length ? `<img src="${esc(p.images[p.current || 0] || p.images[0])}" alt="${esc(p.name)}">${p.images.length > 1 ? `<button type="button" class="photo-arrow prev" aria-label="이전 이미지">‹</button><button type="button" class="photo-arrow next" aria-label="다음 이미지">›</button><span class="photo-count">${(p.current || 0) + 1}/${p.images.length}</span>` : ""}` : "이미지 없음"}</div><div class="p-name">${esc(p.name)}</div><div class="p-sale">판매가 ${money(p.sale)}</div>${includeOffer ? `<div class="p-offer">제안가 ${money(p.offer)}</div>` : ""}</article>`,
            )
            .join("") +
          (items.length
            ? ""
            : '<div class="empty-result">해당 분류에 상품이 없습니다.</div>');
        document.querySelectorAll(".product").forEach((card) => {
          let i = +card.dataset.i,
            p = shareData.products[i];
          card.querySelector(".pick").onchange = (e) => {
            p.selected = e.target.checked;
            if (p.selected && !p.qty) p.qty = 1;
            renderFilters();
            renderBasket();
          };
          const prev = card.querySelector(".photo-arrow.prev");
          const next = card.querySelector(".photo-arrow.next");
          if (prev) prev.onclick = () => {
            p.current = ((p.current || 0) - 1 + p.images.length) % p.images.length;
            render();
          };
          if (next) next.onclick = () => {
            p.current = ((p.current || 0) + 1) % p.images.length;
            render();
          };
          card.ondragstart = (e) => e.dataTransfer.setData("text/plain", i);
          card.ondragover = (e) => e.preventDefault();
          card.ondrop = (e) => {
            e.preventDefault();
            let from = +e.dataTransfer.getData("text/plain");
            let [m] = shareData.products.splice(from, 1);
            shareData.products.splice(i, 0, m);
            customOrder = shareData.products.map((x) => x.id);
            render();
          };
        });
        renderFilters();
        renderBasket();
      }
      function renderBasket() {
        let includeOffer = $("#includeOffer").checked,
          selected = shareData.products.filter((p) => p.selected),
          unit = (p) => (includeOffer ? p.offer : p.sale),
          total = selected.reduce((s, p) => s + unit(p) * (p.qty || 1), 0),
          supply = Math.round(total / 1.1),
          vat = total - supply;
        $("#basket").hidden = false;
        $("#summary").textContent = `선택 상품 ${selected.length}개 · 합계 ${money(total)}`;
        $("#supply").textContent = money(supply);
        $("#vat").textContent = money(vat);
        $("#grand").textContent = money(total);
        $("#basketRows").innerHTML =
          selected
            .map(
              (p) =>
                `<div class="basket-row" data-id="${p.id}"><span>${esc(p.name)}</span><span class="qty"><button type="button" class="minus">−</button><b>${p.qty || 1}개</b><button type="button" class="plus">＋</button></span><strong>${money(unit(p) * (p.qty || 1))}</strong></div>`,
            )
            .join("") || "<p>상품을 선택해주세요.</p>";
        document.querySelectorAll(".basket-row").forEach((r) => {
          let p = shareData.products.find((x) => x.id == r.dataset.id);
          r.querySelector(".minus").onclick = () => {
            p.qty = Math.max(1, (p.qty || 1) - 1);
            renderBasket();
          };
          r.querySelector(".plus").onclick = () => {
            p.qty = (p.qty || 1) + 1;
            renderBasket();
          };
        });
        $("#saveBtn").disabled = !selected.length || saved;
      }
      $("#includeOffer").onchange = render;
      document.querySelectorAll("[data-sort]").forEach(
        (button) => (button.onclick = () => sortProducts(button.dataset.sort)),
      );
      $("#selectVisible").onclick = () => {
        visible().forEach(({ p }) => (p.selected = true));
        render();
      };
      $("#clearVisible").onclick = () => {
        visible().forEach(({ p }) => (p.selected = false));
        render();
      };
      $("#basketFold").onclick = () => {
        let c = $("#basket").classList.toggle("closed");
        $("#basketFold").textContent = c ? "펼치기⌃" : "접기⌄";
      };
      ["ctCompany", "ctEmail", "ctPhone"].forEach((id, i) => {
        let key = ["company", "email", "phone"][i];
        $("#" + id).value = DEFAULT_CONTACT[key];
      });
      let shareState = { db: null, firestore: null, ready: false };
      async function initShareSync() {
        if (shareState.ready) return shareState;
        const [{ initializeApp }, f] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
          import(
            "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
          ),
        ]);
        const app = initializeApp(FIREBASE_CONFIG);
        shareState.db = f.getFirestore(app);
        shareState.firestore = f;
        shareState.ready = true;
        return shareState;
      }
      function shortId(len = 10) {
        let chars = "abcdefghijkmnpqrstuvwxyz23456789ABCDEFGHJKMNPQRSTUVWXYZ",
          id = "";
        for (let i = 0; i < len; i++)
          id += chars[Math.floor(Math.random() * chars.length)];
        return id;
      }
      // Draws ONLY the basket panel itself (product names, qty, line totals,
      // totals, contact fields) onto a canvas and downloads it as a JPG.
      // No product photos are involved, so this never touches CORS/canvas-taint.
      function wrapCanvasText(ctx, text, maxWidth, maxLines) {
        let words = String(text).split(/\s+/).filter(Boolean),
          allLines = [],
          line = "";
        for (let w of words) {
          let test = line ? line + " " + w : w;
          if (line && ctx.measureText(test).width > maxWidth) {
            allLines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) allLines.push(line);
        if (allLines.length <= maxLines) return allLines;
        let lines = allLines.slice(0, maxLines),
          last = lines[maxLines - 1];
        while (last.length > 1 && ctx.measureText(last + "…").width > maxWidth)
          last = last.slice(0, -1);
        lines[maxLines - 1] = last + "…";
        return lines;
      }
      async function buildBasketImage() {
        let includeOffer = $("#includeOffer").checked,
          selected = shareData.products.filter((p) => p.selected),
          unit = (p) => (includeOffer ? p.offer : p.sale),
          rows = selected.map((p) => ({
            name: p.name,
            qty: p.qty || 1,
            lineTotal: unit(p) * (p.qty || 1),
          })),
          total = rows.reduce((s, r) => s + r.lineTotal, 0),
          supply = Math.round(total / 1.1),
          vat = total - supply,
          contact = {
            company: $("#ctCompany").value.trim(),
            email: $("#ctEmail").value.trim(),
            phone: $("#ctPhone").value.trim(),
          };
        try {
          await document.fonts.ready;
        } catch (e) {}
        const W = 640,
          PAD = 28,
          SCALE = 2;
        const measure = document.createElement("canvas").getContext("2d");
        measure.font = "700 14px Pretendard, sans-serif";
        let rowHeights = rows.map(
          (r) =>
            wrapCanvasText(measure, r.name, W - PAD * 2 - 150, 2).length,
        );
        const ROW_BASE = 30,
          ROW_LINE = 18;
        let rowsH = rowHeights.reduce((s, n) => s + ROW_BASE + n * ROW_LINE, 0),
          headerH = 56,
          totalsH = 92,
          contactH = 40,
          H = headerH + rowsH + totalsH + contactH + PAD * 2;
        const canvas = document.createElement("canvas");
        canvas.width = W * SCALE;
        canvas.height = H * SCALE;
        const ctx = canvas.getContext("2d");
        ctx.scale(SCALE, SCALE);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        let y = PAD;
        ctx.fillStyle = "#063c2d";
        ctx.textAlign = "left";
        ctx.font = "800 19px Pretendard, sans-serif";
        ctx.fillText("견적서", PAD, y + 18);
        y += headerH;
        rows.forEach((r, idx) => {
          let lines = wrapCanvasText(measure, r.name, W - PAD * 2 - 150, 2);
          ctx.strokeStyle = "#dfe5e1";
          ctx.beginPath();
          ctx.moveTo(PAD, y - 6);
          ctx.lineTo(W - PAD, y - 6);
          ctx.stroke();
          ctx.font = "700 14px Pretendard, sans-serif";
          ctx.fillStyle = "#18201c";
          ctx.textAlign = "left";
          lines.forEach((line, i) =>
            ctx.fillText(line, PAD, y + 14 + i * ROW_LINE),
          );
          let nameH = lines.length * ROW_LINE;
          ctx.font = "400 12px Pretendard, sans-serif";
          ctx.fillStyle = "#6a766f";
          ctx.fillText(`${r.qty}개`, PAD, y + 14 + nameH + 2);
          ctx.textAlign = "right";
          ctx.font = "800 14px Pretendard, sans-serif";
          ctx.fillStyle = "#18201c";
          ctx.fillText(money(r.lineTotal), W - PAD, y + 14 + nameH / 2);
          y += ROW_BASE + nameH;
        });
        y += 10;
        ctx.textAlign = "left";
        const totalLine = (label, value, big) => {
          ctx.font = big
            ? "800 16px Pretendard, sans-serif"
            : "400 13px Pretendard, sans-serif";
          ctx.fillStyle = big ? "#18201c" : "#6a766f";
          ctx.textAlign = "left";
          ctx.fillText(label, PAD, y + 14);
          ctx.textAlign = "right";
          ctx.fillText(value, W - PAD, y + 14);
          y += big ? 26 : 22;
        };
        totalLine("공급가액", money(supply));
        totalLine("부가세", money(vat));
        totalLine("합계", money(total), true);
        y += 12;
        ctx.strokeStyle = "#dfe5e1";
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(W - PAD, y);
        ctx.stroke();
        y += 22;
        ctx.textAlign = "left";
        ctx.font = "400 12px Pretendard, sans-serif";
        ctx.fillStyle = "#6a766f";
        ctx.fillText(
          [contact.company, contact.email, contact.phone]
            .filter(Boolean)
            .join("   ·   "),
          PAD,
          y,
        );
        return new Promise((resolve) =>
          canvas.toBlob(resolve, "image/jpeg", 0.92),
        );
      }
      async function downloadBasketImage() {
        let blob = await buildBasketImage();
        if (!blob) return;
        let url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = `견적서_${new Date().toISOString().slice(0, 10)}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      $("#saveBtn").onclick = async () => {
        let selected = shareData.products.filter((p) => p.selected);
        if (!selected.length) return;
        let includeOffer = $("#includeOffer").checked,
          unit = (p) => (includeOffer ? p.offer : p.sale),
          items = selected.map((p) => ({
            name: p.name,
            price: unit(p),
            qty: p.qty || 1,
            lineTotal: unit(p) * (p.qty || 1),
          })),
          total = items.reduce((s, x) => s + x.lineTotal, 0),
          supply = Math.round(total / 1.1),
          vat = total - supply,
          contact = {
            company: $("#ctCompany").value.trim(),
            email: $("#ctEmail").value.trim(),
            phone: $("#ctPhone").value.trim(),
          };
        $("#saveBtn").disabled = true;
        $("#saveBtn").textContent = "저장 중…";
        try {
          const { db, firestore: f } = await initShareSync();
          await f.setDoc(
            f.doc(db, SHARE_COLLECTION, shareId, "orders", shortId()),
            {
              items,
              includeOffer,
              supply,
              vat,
              total,
              contact,
              createdAt: Date.now(),
            },
          );
          saved = true;
          ["ctCompany", "ctEmail", "ctPhone"].forEach(
            (id) => ($("#" + id).disabled = true),
          );
          $("#editableHint").hidden = true;
          $("#saveBtn").textContent = "저장 완료";
          try {
            await downloadBasketImage();
            toast("저장했습니다. 견적서 이미지가 다운로드됩니다.");
          } catch (imgError) {
            console.error(imgError);
            toast("저장했습니다. (이미지 다운로드에는 실패했어요)");
          }
        } catch (error) {
          console.error(error);
          toast("저장에 실패했습니다. 인터넷 연결을 확인해주세요");
          $("#saveBtn").disabled = false;
          $("#saveBtn").textContent = "저장하기";
        }
      };
      async function boot() {
        if (!shareId) {
          $("#loading").hidden = true;
          $("#notFound").hidden = false;
          return;
        }
        try {
          const { db, firestore: f } = await initShareSync();
          f.onSnapshot(
            f.doc(db, SHARE_COLLECTION, shareId),
            (snap) => {
              $("#loading").hidden = true;
              if (!snap.exists()) {
                $("#notFound").hidden = false;
                $("#filtersSection").hidden = true;
                $("#gridSection").hidden = true;
                return;
              }
              $("#notFound").hidden = true;
              $("#filtersSection").hidden = false;
              $("#gridSection").hidden = false;
              let incoming = snap.data();
              shareData.categories = incoming.categories || [];
              let prevSelections = new Map(
                shareData.products.map((p) => [p.id, { selected: p.selected, qty: p.qty, current: p.current }]),
              );
              shareData.products = applyCustomOrder(
                (incoming.products || []).map((p) => ({
                  ...p,
                  selected: prevSelections.get(p.id)?.selected || false,
                  qty: prevSelections.get(p.id)?.qty || 1,
                  current: Math.min(prevSelections.get(p.id)?.current || 0, Math.max(0, (p.images || []).length - 1)),
                })),
              );
              render();
            },
            (error) => {
              console.error(error);
              $("#loading").hidden = true;
              $("#notFound").hidden = false;
            },
          );
        } catch (error) {
          console.error(error);
          $("#loading").hidden = true;
          $("#notFound").hidden = false;
        }
      }
      const scrollTopButton = $("#scrollTop");
      scrollTopButton.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
      boot();
    </script>
