STARBUCKS HELPER
File : share.html
Version : 1.0
Updated : 2026-09-03
Purpose : Read-only customer-facing catalog page, backed by Firestore.
          Published from catalog-editor.html's "저장" button.
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>상품 안내 | STARBUCKS HELPER</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        font-family: Pretendard, sans-serif;
        --g: #00754a;
        --d: #063c2d;
        --bg: #f3f5f3;
        --line: #dfe5e1;
        --mut: #6a766f;
        --ink: #18201c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        padding-bottom: 90px;
      }
      button,
      input {
        font: inherit;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 15px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-weight: 800;
        color: var(--d);
      }
      .wrap {
        width: min(1200px, 100%);
        margin: auto;
        padding: 18px;
      }
      .state {
        padding: 60px 20px;
        text-align: center;
        color: var(--mut);
      }
      .filters {
        margin-bottom: 16px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .filter-line {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
      }
      .filter-line b {
        flex: 0 0 48px;
        padding-top: 7px;
        font-size: 12px;
      }
      .offer-toggle-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        padding-top: 7px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        cursor: pointer;
      }
      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .filter-btn {
        padding: 7px 10px;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
      }
      .filter-btn.active {
        border-color: var(--g);
        background: #e8f5ee;
        color: var(--g);
      }
      .category {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 1050px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .wrap {
          padding: 10px;
        }
      }
      .product {
        min-width: 0;
        padding: 9px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: #fff;
      }
      .product:has(.pick:checked) {
        border-color: var(--g);
        background: #f2faf6;
      }
      .photo {
        aspect-ratio: 5/6;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f7f7f5;
        border-radius: 10px;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .photo.empty {
        color: var(--mut);
        font-size: 11px;
      }
      .p-name {
        margin-top: 7px;
        font-size: 15px;
        font-weight: 750;
      }
      .p-sale {
        font-size: 12px;
        color: var(--mut);
      }
      .p-offer {
        font-size: 14px;
        font-weight: 800;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
        font-size: 12px;
      }
      .empty-result {
        grid-column: 1/-1;
        padding: 50px;
        text-align: center;
        color: var(--mut);
      }
      .basket {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(560px, calc(100% - 24px));
        padding: 12px 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.18);
      }
      .basket-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .basket-body {
        max-height: 34vh;
        overflow: auto;
        margin-top: 10px;
      }
      .basket.closed .basket-body,
      .basket.closed .basket-foot {
        display: none;
      }
      .basket-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .qty button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .basket-foot {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .totals {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--mut);
        margin-bottom: 3px;
      }
      .totals.grand {
        font-size: 15px;
        font-weight: 800;
        color: var(--ink);
      }
      .contact-fields {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-bottom: 10px;
        opacity: 0.6;
        font-size: 11px;
      }
      .contact-fields label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .contact-fields input {
        width: auto;
        min-width: 40px;
        max-width: 220px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 11px;
      }
      .contact-fields input:disabled {
        background: transparent;
        border-color: transparent;
        color: var(--ink);
      }
      #editableHint {
        color: #d0392c;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        background: #fff;
        color: var(--ink);
        font-weight: 750;
        cursor: pointer;
      }
      .btn.primary {
        width: 100%;
        border-color: var(--g);
        background: var(--g);
        color: #fff;
      }
      .btn.primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn.mini {
        padding: 5px 9px;
        font-size: 11px;
      }
      .notice {
        position: fixed;
        right: 16px;
        top: 70px;
        z-index: 90;
        max-width: min(300px, calc(100vw - 32px));
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--d);
        color: #fff;
        font-size: 12px;
        line-height: 1.5;
        white-space: normal;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
      }
      .notice.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>STARBUCKS MD 안내</header>
    <main class="wrap">
      <div class="state" id="loading">불러오는 중…</div>
      <div class="state" id="notFound" hidden>
        링크를 찾을 수 없습니다. 링크를 다시 확인해주세요.
      </div>
      <section class="filters" id="filtersSection" hidden>
        <div class="filter-line">
          <b>대분류</b>
          <div class="filter-buttons" id="categoryFilters"></div>
          <label class="offer-toggle-top"
            ><input type="checkbox" id="includeOffer" checked /> 제안가
            표기</label
          >
        </div>
      </section>
      <section class="category" id="gridSection" hidden>
        <div class="grid" id="grid"></div>
      </section>
    </main>
    <aside class="basket closed" id="basket" hidden>
      <div class="basket-head">
        <b id="summary">선택 상품 0개</b
        ><button class="btn mini" id="basketFold">펼치기⌃</button>
      </div>
      <div class="basket-body" id="basketRows"></div>
      <div class="basket-foot">
        <div class="totals"><span>공급가액</span><b id="supply">0원</b></div>
        <div class="totals"><span>부가세</span><b id="vat">0원</b></div>
        <div class="totals grand"><span>합계</span><b id="grand">0원</b></div>
        <div class="contact-fields" id="contactFields">
          <label>상호명 <input id="ctCompany" /></label>
          <label>이메일 <input id="ctEmail" /></label>
          <label>연락처 <input id="ctPhone" /></label>
          <small id="editableHint">*수정가능</small>
        </div>
        <button class="btn primary" id="saveBtn">저장하기</button>
      </div>
    </aside>
    <div class="notice" id="notice"></div>
    <script>
      const FIREBASE_CONFIG = {
          apiKey: "AIzaSyAQpr3_koSKTAfihI8E3-kW3PknfMrQdaA",
          authDomain: "starbucks-helper-f578e.firebaseapp.com",
          projectId: "starbucks-helper-f578e",
          storageBucket: "starbucks-helper-f578e.firebasestorage.app",
          messagingSenderId: "1015231512258",
          appId: "1:1015231512258:web:25bb0229b5bc90b56a455b",
          measurementId: "G-8H2H0NCJDF",
        },
        SHARE_COLLECTION = "catalogShares",
        DEFAULT_CONTACT = {
          company: "디스이스마인",
          email: "runipo.kr@gmail.com",
          phone: "010-5711-3730",
        };
      const $ = (s) => document.querySelector(s),
        money = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      let toastTimer;
      function toast(t) {
        $("#notice").textContent = t;
        $("#notice").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => $("#notice").classList.remove("show"),
          3600,
        );
      }
      const params = new URLSearchParams(location.search);
      const shareId = params.get("id");
      let shareData = { categories: [], products: [] };
      let activeCategory = "전체";
      let saved = false;

      function visible() {
        return shareData.products
          .map((p, i) => ({ p, i }))
          .filter(
            ({ p }) =>
              activeCategory === "전체" || p.category === activeCategory,
          );
      }
      function renderFilters() {
        let cats = ["전체", ...shareData.categories];
        $("#categoryFilters").innerHTML = cats
          .map(
            (v) =>
              `<button type="button" class="filter-btn ${v === activeCategory ? "active" : ""}" data-cat="${esc(v)}">${esc(v)}</button>`,
          )
          .join("");
        document.querySelectorAll("[data-cat]").forEach(
          (b) =>
            (b.onclick = () => {
              activeCategory = b.dataset.cat;
              render();
            }),
        );
      }
      function render() {
        let includeOffer = $("#includeOffer").checked,
          items = visible();
        $("#grid").innerHTML =
          items
            .map(
              ({ p, i }) =>
                `<article class="product" data-i="${i}"><div class="photo ${p.images?.length ? "" : "empty"}">${p.images?.length ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}">` : "이미지 없음"}</div><div class="p-name">${esc(p.name)}</div><div class="p-sale">판매가 ${money(p.sale)}</div>${includeOffer ? `<div class="p-offer">제안가 ${money(p.offer)}</div>` : ""}<label class="pick-row"><input type="checkbox" class="pick" ${p.selected ? "checked" : ""}> 선택</label></article>`,
            )
            .join("") +
          (items.length
            ? ""
            : '<div class="empty-result">해당 분류에 상품이 없습니다.</div>');
        document.querySelectorAll(".product").forEach((card) => {
          let i = +card.dataset.i,
            p = shareData.products[i];
          card.querySelector(".pick").onchange = (e) => {
            p.selected = e.target.checked;
            if (p.selected && !p.qty) p.qty = 1;
            renderFilters();
            renderBasket();
          };
        });
        renderFilters();
        renderBasket();
      }
      function renderBasket() {
        let includeOffer = $("#includeOffer").checked,
          selected = shareData.products.filter((p) => p.selected),
          unit = (p) => (includeOffer ? p.offer : p.sale),
          total = selected.reduce((s, p) => s + unit(p) * (p.qty || 1), 0),
          supply = Math.round(total / 1.1),
          vat = total - supply;
        $("#basket").hidden = false;
        $("#summary").textContent = `선택 상품 ${selected.length}개 · 합계 ${money(total)}`;
        $("#supply").textContent = money(supply);
        $("#vat").textContent = money(vat);
        $("#grand").textContent = money(total);
        $("#basketRows").innerHTML =
          selected
            .map(
              (p) =>
                `<div class="basket-row" data-id="${p.id}"><span>${esc(p.name)}</span><span class="qty"><button type="button" class="minus">−</button><b>${p.qty || 1}개</b><button type="button" class="plus">＋</button></span><strong>${money(unit(p) * (p.qty || 1))}</strong></div>`,
            )
            .join("") || "<p>상품을 선택해주세요.</p>";
        document.querySelectorAll(".basket-row").forEach((r) => {
          let p = shareData.products.find((x) => x.id == r.dataset.id);
          r.querySelector(".minus").onclick = () => {
            p.qty = Math.max(1, (p.qty || 1) - 1);
            renderBasket();
          };
          r.querySelector(".plus").onclick = () => {
            p.qty = (p.qty || 1) + 1;
            renderBasket();
          };
        });
        $("#saveBtn").disabled = !selected.length || saved;
      }
      $("#includeOffer").onchange = render;
      $("#basketFold").onclick = () => {
        let c = $("#basket").classList.toggle("closed");
        $("#basketFold").textContent = c ? "펼치기⌃" : "접기⌄";
      };
      ["ctCompany", "ctEmail", "ctPhone"].forEach((id, i) => {
        let key = ["company", "email", "phone"][i];
        $("#" + id).value = DEFAULT_CONTACT[key];
      });
      let shareState = { db: null, firestore: null, ready: false };
      async function initShareSync() {
        if (shareState.ready) return shareState;
        const [{ initializeApp }, f] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
          import(
            "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
          ),
        ]);
        const app = initializeApp(FIREBASE_CONFIG);
        shareState.db = f.getFirestore(app);
        shareState.firestore = f;
        shareState.ready = true;
        return shareState;
      }
      function shortId(len = 10) {
        let chars = "abcdefghijkmnpqrstuvwxyz23456789ABCDEFGHJKMNPQRSTUVWXYZ",
          id = "";
        for (let i = 0; i < len; i++)
          id += chars[Math.floor(Math.random() * chars.length)];
        return id;
      }
      $("#saveBtn").onclick = async () => {
        let selected = shareData.products.filter((p) => p.selected);
        if (!selected.length) return;
        let includeOffer = $("#includeOffer").checked,
          unit = (p) => (includeOffer ? p.offer : p.sale),
          items = selected.map((p) => ({
            name: p.name,
            price: unit(p),
            qty: p.qty || 1,
            lineTotal: unit(p) * (p.qty || 1),
          })),
          total = items.reduce((s, x) => s + x.lineTotal, 0),
          supply = Math.round(total / 1.1),
          vat = total - supply,
          contact = {
            company: $("#ctCompany").value.trim(),
            email: $("#ctEmail").value.trim(),
            phone: $("#ctPhone").value.trim(),
          };
        $("#saveBtn").disabled = true;
        $("#saveBtn").textContent = "저장 중…";
        try {
          const { db, firestore: f } = await initShareSync();
          await f.setDoc(
            f.doc(db, SHARE_COLLECTION, shareId, "orders", shortId()),
            {
              items,
              includeOffer,
              supply,
              vat,
              total,
              contact,
              createdAt: Date.now(),
            },
          );
          saved = true;
          ["ctCompany", "ctEmail", "ctPhone"].forEach(
            (id) => ($("#" + id).disabled = true),
          );
          $("#editableHint").hidden = true;
          $("#saveBtn").textContent = "저장 완료";
          toast("저장했습니다. 이미지는 제공되지 않으니 필요 시 화면을 캡처해주세요.");
        } catch (error) {
          console.error(error);
          toast("저장에 실패했습니다. 인터넷 연결을 확인해주세요");
          $("#saveBtn").disabled = false;
          $("#saveBtn").textContent = "저장하기";
        }
      };
      async function boot() {
        if (!shareId) {
          $("#loading").hidden = true;
          $("#notFound").hidden = false;
          return;
        }
        try {
          const { db, firestore: f } = await initShareSync();
          f.onSnapshot(
            f.doc(db, SHARE_COLLECTION, shareId),
            (snap) => {
              $("#loading").hidden = true;
              if (!snap.exists()) {
                $("#notFound").hidden = false;
                $("#filtersSection").hidden = true;
                $("#gridSection").hidden = true;
                return;
              }
              $("#notFound").hidden = true;
              $("#filtersSection").hidden = false;
              $("#gridSection").hidden = false;
              let incoming = snap.data();
              shareData.categories = incoming.categories || [];
              let prevSelections = new Map(
                shareData.products.map((p) => [p.id, { selected: p.selected, qty: p.qty }]),
              );
              shareData.products = (incoming.products || []).map((p) => ({
                ...p,
                selected: prevSelections.get(p.id)?.selected || false,
                qty: prevSelections.get(p.id)?.qty || 1,
              }));
              render();
            },
            (error) => {
              console.error(error);
              $("#loading").hidden = true;
              $("#notFound").hidden = false;
            },
          );
        } catch (error) {
          console.error(error);
          $("#loading").hidden = true;
          $("#notFound").hidden = false;
        }
      }
      boot();
    </script>
  </body>
</html>
